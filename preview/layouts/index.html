<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}</style>
<title>Cadence Layout-Ideen</title>
<style>
/* Layout: schmale Leiste oben mit den Konzepten als Reiter, darunter der gewaehlte Prototyp bildschirmfuellend.
   Ab Tablet-Breite: links die Liste der Ideen, rechts der Prototyp im Handy-Rahmen. */
:root{
  --bg:#f4f3ef; --surface:#ffffff; --surface-2:#eae8e2; --ink:#23211d; --muted:#6c685f; --line:rgba(35,33,29,.14);
  --accent:#2f5648; --accent-soft:#dfe9e4; --on-accent:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412; --surface:#1e1d1a; --surface-2:#2a2825; --ink:#ece8e1; --muted:#a09a8f; --line:rgba(255,255,255,.16);
  --accent:#a3cbb9; --accent-soft:#24312b; --on-accent:#10201a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1e1d1a; --surface-2:#2a2825; --ink:#ece8e1; --muted:#a09a8f; --line:rgba(255,255,255,.16);
  --accent:#a3cbb9; --accent-soft:#24312b; --on-accent:#10201a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{flex-shrink:0;border-bottom:1px solid var(--line);background:var(--surface)}
.bar-top{display:flex;align-items:center;gap:10px;padding:8px 16px 0}
.bar-top h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-top h1 span{color:var(--muted);font-weight:500}
.link-btn{font-size:13px;font-weight:600;color:var(--accent);padding:8px 0 8px 8px;min-height:36px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:9px 13px;border-radius:999px;background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;min-height:38px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tab.ext::after{content:" ↗"}

.stage{flex:1;min-height:0;display:flex}
.frame{flex:1;min-width:0;display:flex}
.frame iframe{flex:1;width:100%;height:100%;border:0;background:var(--bg)}
.side{display:none}

/* Erklaerung der Ideen (auf dem Handy als Blatt, breit als Spalte) */
.about{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:16px 16px 28px}
.about[hidden]{display:none}
.about-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.about-head h2{margin:0;font-size:20px;font-weight:700}
.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
.idea{border-top:1px solid var(--line);padding:14px 0}
.idea h3{margin:0 0 4px;font-size:16px;font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.idea h3 button{font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0;min-height:32px}
.idea p{margin:0 0 6px;max-width:62ch}
.idea dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13.5px;color:var(--muted)}
.idea dt{font-weight:700}
.idea dd{margin:0}
.next{border-top:1px solid var(--line);padding-top:14px;margin-top:2px;max-width:62ch}
.next b{color:var(--ink)}

@media (min-width:860px){
  body{overflow:auto}
  .bar{display:none}
  .stage{gap:40px;padding:28px 32px;align-items:flex-start;justify-content:center}
  .side{display:block;flex:1;max-width:520px;min-width:0}
  .side .about{position:static;padding:0;overflow:visible;background:none}
  .side .about-head button{display:none}
  .frame{flex:0 0 390px;height:min(844px,calc(100vh - 56px));border:1px solid var(--line);border-radius:28px;overflow:hidden;
    position:sticky;top:28px;background:var(--surface)}
  .idea.sel h3{color:var(--accent)}
}
</style>
</head>
<body>
<div class="bar">
  <div class="bar-top">
    <h1>Cadence <span>· Layout-Ideen</span></h1>
    <button class="link-btn" id="aboutBtn" type="button">Was ist was?</button>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Layout-Ideen"></div>
</div>

<div class="stage">
  <div class="side" id="side"></div>
  <div class="frame"><iframe id="frame" title="Prototyp"></iframe></div>
</div>

<div class="about" id="about" hidden></div>

<script>
"use strict";
// Der aufgeraeumte Umbau der heutigen App liegt als eigene Vorschau vor: auf GitHub Pages direkt daneben,
// sonst als eigene Seite (laesst sich dann nicht einbetten und oeffnet in einem neuen Tab).
const AUF_PAGES=/github\.io$/.test(location.hostname);
const UMBAU_URL=AUF_PAGES?'../':'https://claude.ai/artifact/N2HUFbY751ZoLLQi9JF2Yi';
const IDEEN=[
  {id:'ein-bildschirm',name:'Ein Bildschirm',src:'ein-bildschirm.html',
    idee:'Keine Tab-Leiste. Oben steht, was heute noch offen ist, darunter dein Stand. Alles Seltene liegt hinter einem Menü.',
    staerke:'Öffnen, abhaken, fertig, ohne einen einzigen Wechsel.',
    preis:'Die Seite wird mit mehr Gewohnheiten lang. Ideen und Rückblick sind einen Schritt weiter weg.'},
  {id:'phasen-board',name:'Phasen-Board',src:'phasen-board.html',
    idee:'Die App folgt dem Weg einer Gewohnheit: Idee → Im Aufbau → Stabil → Archiv-reif → Archiv. Tippe unten auf „Weg".',
    staerke:'Du siehst sofort, wo jede Gewohnheit steht und ob Platz für eine neue ist.',
    preis:'Das Board zeigt nie alle Phasen gleichzeitig. Zum Abhaken gibt es weiter eine eigene Liste.'},
  {id:'fokus-karten',name:'Fokus-Karten',src:'fokus-karten.html',
    idee:'Abends eine geführte Runde: eine Gewohnheit pro Bildschirm, beantwortet mit dem Daumen, am Ende „Tag abgeschlossen".',
    staerke:'Einhändig, ohne zu zielen, mit einem klaren Ende.',
    preis:'Bei nur zwei offenen Gewohnheiten ist die Runde langsamer als eine Liste. Den Gesamtstand zeigt erst die Übersicht.'},
  {id:'woche-zuerst',name:'Woche zuerst',src:'woche-zuerst.html',
    idee:'Die letzten sieben Tage sind die Startseite, heute als breite Spalte am rechten Rand.',
    staerke:'Jedes Abhaken passiert im Zusammenhang. Eine Lücke fällt sofort auf.',
    preis:'Dichter als eine Liste. Ab etwa neun Gewohnheiten muss man scrollen.'},
  {id:'ausblick',name:'Ausblick',src:'freie-idee.html',
    idee:'Die App schaut nach vorn statt zurück. Unten liegt nur, was heute noch offen ist; darüber steht mit Datum, was als Nächstes kommt: „Stabil am …", „Platz für eine neue in 10 Tagen".',
    staerke:'Beantwortet deine zwei häufigsten Fragen ohne einen Tipp: Was fehlt heute, und wann darf die nächste starten.',
    preis:'Erledigte Gewohnheiten verschwinden aus der Liste. Die Termine sind Prognosen und verschieben sich bei einem Aussetzer.'},
  {id:'umbau',name:'Umbau der heutigen App',src:UMBAU_URL,extern:!AUF_PAGES,
    idee:'Das heutige Layout, aufgeräumt: ein Balken statt vieler Zahlen, ein Detail-Blatt je Gewohnheit, neue Statistik. Unter Einstellungen → Stil gibt es dazu sieben Stile.',
    staerke:'Vertraut, und als echte App schon fertig gebaut.',
    preis:'Der Aufbau bleibt der alte: vier Reiter, eine Liste für heute.'}
];
const $=id=>document.getElementById(id);
let aktiv=null;
function merk(v){try{if(v)localStorage.setItem('layout-idee',v);else return localStorage.getItem('layout-idee');}catch(e){return null;}}
function waehle(id,ausHash){
  const k=IDEEN.find(x=>x.id===id)||IDEEN[0];
  if(k.extern){window.open(k.src,'_blank','noopener');return;}
  aktiv=k.id;merk(k.id);
  if($('frame').getAttribute('src')!==k.src)$('frame').setAttribute('src',k.src);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.id===k.id)));
  document.querySelectorAll('.idea').forEach(e=>e.classList.toggle('sel',e.dataset.id===k.id));
  const sel=document.querySelector('.tab[aria-selected="true"]');if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest',inline:'center'});
  if(!ausHash){try{history.replaceState(null,'','#'+k.id);}catch(e){}}
  $('about').hidden=true;
}
function tabsHTML(){
  return IDEEN.map(k=>k.extern
    ?`<a class="tab ext" href="${k.src}" target="_blank" rel="noopener">${k.name}</a>`
    :`<button class="tab" role="tab" type="button" data-id="${k.id}" aria-selected="false">${k.name}</button>`).join('');
}
function aboutHTML(mitSchliessen){
  return `<div class="about-head"><h2>Fünf Ideen für den Aufbau</h2>${mitSchliessen?'<button class="link-btn" type="button" data-close>Schließen</button>':''}</div>
    <p class="lead">Alle Prototypen zeigen dieselben Beispieldaten und denselben neutralen Look, damit du nur den Aufbau vergleichst. Abhaken funktioniert, gespeichert wird nichts. In jedem Prototyp erklärt das kleine „i" die Idee.</p>
    ${IDEEN.map(k=>`<section class="idea" data-id="${k.id}">
      <h3>${k.name}${k.extern?`<a href="${k.src}" target="_blank" rel="noopener">Öffnen ↗</a>`:`<button type="button" data-id="${k.id}">Ansehen</button>`}</h3>
      <p>${k.idee}</p>
      <dl><dt>Stärke</dt><dd>${k.staerke}</dd><dt>Preis</dt><dd>${k.preis}</dd></dl></section>`).join('')}
    <p class="next"><b>So geht es weiter:</b> Sag mir, welcher Aufbau dir am besten gefällt. Teile lassen sich kombinieren, zum Beispiel die Überschrift „2 offen" aus „Ein Bildschirm" mit dem „Weg" aus dem Phasen-Board. Den gewählten Aufbau baue ich dann in die echte App und lege einen der Stile darüber.</p>`;
}
$('tabs').innerHTML=tabsHTML();
$('about').innerHTML=aboutHTML(true);
$('side').innerHTML=`<div class="about">${aboutHTML(false)}</div>`;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-id]');
  if(t&&(t.matches('button')||t.classList.contains('tab'))){waehle(t.dataset.id);return;}
  if(e.target.closest('[data-close]')){$('about').hidden=true;return;}
  if(e.target.closest('#aboutBtn')){$('about').hidden=false;}
});
const start=(location.hash||'').slice(1);
waehle(IDEEN.some(k=>k.id===start&&!k.extern)?start:(merk()&&IDEEN.some(k=>k.id===merk()&&!k.extern)?merk():IDEEN[0].id),true);
</script>
</body>
</html>
