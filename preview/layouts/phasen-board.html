<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cadence – Phasen-Board</title>
<link rel="stylesheet" href="base.css">
<style>
#app{height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.scroll,.col,#sheet{scrollbar-width:none}
.scroll::-webkit-scrollbar,.col::-webkit-scrollbar,#sheet::-webkit-scrollbar{display:none}

/* Kopf */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(var(--safe-top) + 12px) 16px 6px 20px}
.top h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.4px}
.top .sub{font-size:14px;color:var(--muted);margin-top:3px}
.top-l{display:flex;align-items:center;gap:4px;min-width:0}
.back{width:44px;height:44px;margin-left:-14px;display:grid;place-items:center;color:var(--accent-ink)}
.ibtn{width:44px;height:44px;margin:-4px -8px 0 0;display:grid;place-items:center;color:var(--faint);border-radius:50%}
.ibtn:active{background:var(--surface-2)}

/* Tabbar */
#tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);flex-shrink:0}
#tabs button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);position:relative}
#tabs button.on{color:var(--accent-ink);font-weight:600}
#tabs button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2.5px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:grid;place-items:center}
.pip{position:absolute;top:8px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--g);border:2px solid var(--surface);box-sizing:content-box}

/* ===== Heute ===== */
.status{padding:0 20px 10px}
.status .line{font-size:17px;font-weight:600}
.status .line span{color:var(--muted);font-weight:500}
.status .bar{height:5px;border-radius:3px;background:var(--surface-3);margin-top:9px;overflow:hidden}
.status .bar i{display:block;height:100%;background:var(--g);border-radius:3px;transition:width .25s}
.list{margin:6px 16px 0;background:var(--surface);border-radius:var(--radius);border:1px solid var(--line)}
.list+.list{margin-top:14px}
.row{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 16px;min-height:68px}
.row+.row{border-top:1px solid var(--line)}
.rtxt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 0;min-height:44px;justify-content:center}
.rname{font-size:17px;font-weight:600;line-height:1.25}
.rphase{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.rphase.b{color:var(--accent-ink)}
.row .tile{width:52px;height:52px;border-radius:14px}
.row .tile svg{width:26px;height:26px}
.row.done .rname{color:var(--ink-soft)}
.hint{font-size:13px;color:var(--faint);text-align:center;padding:16px 28px 28px}
.allgood{margin:6px 16px 0;padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft);color:var(--accent-ink);font-size:15px;font-weight:600}

/* ===== Weg ===== */
.stepper{display:flex;align-items:stretch;padding:4px 12px 0;flex-shrink:0}
.st{flex:1;min-width:0;border-radius:12px;text-align:center;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.st b{font-size:19px;line-height:1.1;font-weight:700}
.st span{font-size:11.5px;color:var(--muted)}
.st.on{background:var(--accent-soft)}
.st.on b,.st.on span{color:var(--accent-ink)}
.st.warn b{color:var(--o)}
.sep{width:9px;align-self:center;color:var(--faint);font-size:13px;text-align:center;margin-top:-2px}
.platz{display:flex;align-items:center;gap:10px;margin:8px 16px 0;padding:0 14px;min-height:44px;border-radius:12px;text-align:left;font-size:14px;font-weight:600;flex-shrink:0;background:var(--surface);border:1px solid var(--line)}
.platz .pd{display:flex;gap:3px;flex-shrink:0}
.platz .pd i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.platz .pd i.free{background:transparent;box-shadow:inset 0 0 0 1.5px var(--accent)}
.platz .pd i.over{background:var(--o)}
.platz.no{color:var(--ink-soft)}
.platz.ok{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.platz .go{margin-left:auto;color:var(--faint)}

.board{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:10px 16px 12px;scroll-padding:0 16px;scrollbar-width:none;position:relative;overscroll-behavior-x:contain}
.board::-webkit-scrollbar{display:none}
.col{flex:0 0 calc(100% - 30px);min-width:0;scroll-snap-align:start;background:var(--surface-2);border-radius:20px;overflow-y:auto;overscroll-behavior:contain;padding:16px 12px 20px;display:flex;flex-direction:column;gap:10px}
.col-head{padding:0 4px 4px}
.col-head h2{font-size:22px;font-weight:700;letter-spacing:-.2px}
.col-head p{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.4}
.kick{font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 4px 0}

.hcard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--radius);padding:14px 14px 13px;border:1px solid var(--line)}
.hcard:active{transform:scale(.985)}
.hc-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hc-name{flex:1;font-size:17px;font-weight:600;line-height:1.25}
.hcard .pfad{margin-right:6px}
.hc-satz{font-size:14px;color:var(--ink-soft);margin-top:10px}
.mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--on-state);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.mk svg{width:14px;height:14px;stroke-width:3}
.mk.g{background:var(--g);box-shadow:none}.mk.o{background:var(--o);box-shadow:none}.mk.r{background:var(--r);box-shadow:none}
.mk.na{box-shadow:none;border:1.5px dashed var(--line-2)}

.cap{background:var(--surface);border-radius:var(--radius);padding:14px;border:1px solid var(--line)}
.cap-top{display:flex;align-items:baseline;gap:8px}
.cap-top b{font-size:26px;font-weight:700;letter-spacing:-.3px}
.cap-top span{font-size:15px;font-weight:600;color:var(--ink-soft)}
.cap.full .cap-top span,.cap.over .cap-top span{color:var(--o)}
.cap.ok .cap-top span{color:var(--accent-ink)}
.slots{display:flex;gap:6px;margin:10px 0 9px}
.slots i{flex:1;height:10px;border-radius:5px;background:var(--accent)}
.slots i.free{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.slots i.over{background:var(--o)}
.cap p{font-size:13.5px;color:var(--muted);line-height:1.4}

.next{background:var(--surface);border-radius:var(--radius);padding:16px 16px 14px;border:1px solid var(--line)}
.next .nt{font-size:20px;font-weight:700;line-height:1.25;letter-spacing:-.2px;margin-top:4px}
.next .nn{font-size:14.5px;color:var(--ink-soft);margin-top:5px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--surface-2);color:var(--ink-soft)}
.chip.hoch{background:var(--accent-soft);color:var(--accent-ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:13px;font-size:16px;font-weight:650;background:var(--accent);color:var(--on-accent);margin-top:14px}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:var(--surface-3);color:var(--faint);cursor:default;transform:none}
.btn.sec{background:var(--surface-2);color:var(--ink)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--ink)}
.btn.txt{background:transparent;color:var(--muted);font-weight:600;min-height:44px;margin-top:6px}
.why{display:flex;gap:9px;margin-top:12px;font-size:14px;line-height:1.4;color:var(--ink-soft)}
.why svg{flex-shrink:0;margin-top:1px;color:var(--o)}
.why small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.why.ok svg{color:var(--accent)}
.irow{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius);padding:4px 6px 4px 14px;min-height:56px;border:1px solid var(--line)}
.irow .it{flex:1;min-width:0;padding:8px 0}
.irow .it div{font-size:15.5px;font-weight:550;line-height:1.3}
.irow .it .chip{margin-top:4px}
.irow button.pull{min-height:44px;padding:0 10px;font-size:14px;font-weight:600;color:var(--accent-ink)}
.addbtn{min-height:48px;border-radius:13px;border:1.5px dashed var(--line-2);color:var(--muted);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}

.empty{background:var(--surface);border-radius:var(--radius);padding:24px 18px;text-align:center;border:1px solid var(--line)}
.empty .ei{width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--muted)}
.empty h3{font-size:17px;font-weight:650}
.empty p{font-size:14.5px;color:var(--ink-soft);margin-top:7px;line-height:1.5}
.empty p b{color:var(--ink)}
.empty .near{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}

.acard{background:var(--surface);border-radius:var(--radius);padding:16px;border:1px solid var(--line)}
.acard .ah{display:flex;align-items:center;gap:12px}
.acard .ai{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.acard h3{font-size:17px;font-weight:650}
.acard .am{font-size:13.5px;color:var(--muted);margin-top:2px}
.ablauf{margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.ablauf li{counter-increment:s;display:flex;gap:10px;align-items:center;font-size:15px;padding:7px 0;border-top:1px solid var(--line)}
.ablauf li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--muted);flex-shrink:0}
.aq{font-size:14.5px;color:var(--ink-soft);font-style:italic;margin-top:12px}

/* ===== Mehr ===== */
.mrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 16px;min-height:72px}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .mi{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.mrow .mt{flex:1}
.mrow .mt b{display:block;font-size:17px;font-weight:600}
.mrow .mt span{font-size:14px;color:var(--muted)}
.mrow .chev{color:var(--faint)}
.rv{padding:4px 16px 0}
.rv-sum{display:flex;gap:10px;margin:2px 0 14px}
.rv-sum div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.rv-sum b{display:block;font-size:24px;font-weight:700}
.rv-sum span{font-size:13px;color:var(--muted)}
.grid{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 8px}
.gr{display:flex;align-items:center;gap:8px;min-height:34px}
.gr .gn{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .gd{display:grid;grid-template-columns:repeat(14,10px);gap:3px;flex-shrink:0}
.gr .gd .dot.today{box-shadow:0 0 0 1.5px var(--ink)}
.gr.gh .gd span{font-size:9px;color:var(--faint);text-align:center;width:10px;overflow:visible;white-space:nowrap}
.gr.gh .gd span.t{color:var(--ink);font-weight:700}
.gsep{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 0 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);padding:12px 4px 24px}
.legend span{display:flex;align-items:center;gap:6px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 16px 10px}
.wcard summary{list-style:none;padding:14px 16px;min-height:60px;display:flex;align-items:center;gap:12px;cursor:pointer}
.wcard summary::-webkit-details-marker{display:none}
.wcard summary b{display:block;font-size:16.5px;font-weight:650}
.wcard summary span{font-size:14px;color:var(--muted)}
.wcard summary .chev{margin-left:auto;color:var(--faint);transition:transform .2s;flex-shrink:0}
.wcard[open] summary .chev{transform:rotate(90deg)}
.wcard .wb{padding:0 16px 16px;font-size:15px;line-height:1.55;color:var(--ink-soft)}
.wcard .wb ol,.wcard .wb ul{margin:8px 0 0;padding-left:20px}
.wcard .wb li{margin:5px 0}
.sgrp{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:16px 20px 7px}
.sbox{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.srow{display:flex;align-items:center;gap:12px;padding:8px 14px 8px 16px;min-height:56px}
.srow+.srow{border-top:1px solid var(--line)}
.srow .sl{flex:1;font-size:16px}
.srow .sl small{display:block;font-size:13px;color:var(--muted)}
.srow .sv{font-size:15px;color:var(--muted)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface-3);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(20px)}
.stp{display:flex;align-items:center;gap:2px}
.stp button{width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:600;display:grid;place-items:center}
.stp b{min-width:26px;text-align:center;font-size:17px}
.foot{font-size:13px;color:var(--faint);text-align:center;padding:20px 20px 30px}

/* ===== Blatt ===== */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:50%;bottom:0;width:min(100%,430px);max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 20px calc(22px + var(--safe-bottom));transform:translate(-50%,102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#scrim.on #sheet{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 12px}
.sh-head{display:flex;align-items:center;gap:12px}
.sh-head .ico{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.sh-head h2{font-size:21px;font-weight:700;line-height:1.2;letter-spacing:-.2px}
.sh-head .pc{font-size:13.5px;color:var(--muted);margin-top:2px}
.sh-x{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);margin-right:-10px;flex-shrink:0}
.bigp{margin:26px 4px 0}
.bigp .pfad{margin-right:0}
.bl{position:relative;height:20px;margin-top:8px;font-size:12px;color:var(--muted)}
.bl span{position:absolute;top:0;white-space:nowrap}
.satz-big{font-size:24px;font-weight:700;letter-spacing:-.3px;margin:14px 4px 0;line-height:1.2}
.stats{display:flex;gap:10px;margin-top:18px}
.stats div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stats b{display:block;font-size:26px;font-weight:700;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.h4{font-size:12px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;color:var(--muted);margin:20px 4px 8px}
.d14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 10px 10px}
.d14 .c{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9.5px;color:var(--faint)}
.d14 .c.t{color:var(--ink);font-weight:700}
.d14 .dot{width:16px;height:16px;border-radius:5px}
.d14 .c.t .dot{box-shadow:0 0 0 1.5px var(--ink)}
.note{font-size:15.5px;font-style:italic;color:var(--ink-soft);padding:2px 4px;line-height:1.5}
.note.none{color:var(--faint)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 2px}
.seg button i{width:14px;height:14px;border-radius:4px;background:var(--surface-3)}
.seg button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.seg button.g i{background:var(--g)}.seg button.o i{background:var(--o)}.seg button.r i{background:var(--r)}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;margin-top:8px}
.opt .tile{width:40px;height:40px;border-radius:11px;box-shadow:none;pointer-events:none}
.opt .tile:not(.g):not(.o):not(.r){box-shadow:inset 0 0 0 1.5px var(--line-2)}
.opt b{display:block;font-size:16.5px;font-weight:650}
.opt span{font-size:13px;color:var(--muted)}
.opt .cur{margin-left:auto;color:var(--accent)}
.fld{display:block;margin-top:14px}
.fld>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 2px 6px}
.fld input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.fld input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:22px;background:var(--surface);border:1px solid var(--line-2);font-size:15px}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.info p{font-size:15.5px;line-height:1.55;color:var(--ink-soft);margin-top:10px}
.info p b{color:var(--ink)}
.info h3{font-size:24px;font-weight:700;margin:6px 0 0;letter-spacing:-.3px}
.plan{font-size:14px;color:var(--muted);margin:14px 2px 0;line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(76px + var(--safe-bottom));transform:translate(-50%,20px);max-width:min(380px,90%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:550;opacity:0;pointer-events:none;transition:.25s;z-index:30;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <section class="screen" id="s-heute"></section>
  <section class="screen" id="s-weg"></section>
  <section class="screen" id="s-mehr"></section>
  <nav id="tabs">
    <button data-act="tab" data-tab="heute"></button>
    <button data-act="tab" data-tab="weg"></button>
    <button data-act="tab" data-tab="mehr"></button>
  </nav>
  <div id="toast"></div>
</div>
<div id="scrim" data-act="scrim"><div id="sheet"></div></div>
<script src="demo.js"></script>

<script>
(function(){
const D=DEMO, I=D.icons;
I.route='<circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8.2 18H14a3.5 3.5 0 0 0 0-7h-4a3.5 3.5 0 0 1 0-7h5.8"/>';
I.dots='<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>';
I.lock='<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>';
const ic=(n,s)=>D.svg(I[n],s);
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reg={max:D.regel.maxAufbau,neuAb:D.regel.neuAb};
const ideas=D.ideen.map(x=>Object.assign({},x));
const PRIO={hoch:'Wichtig',mittel:'Mittel',irgendwann:'Irgendwann'};
const PORD={hoch:0,mittel:1,irgendwann:2};
const PHASES=['ideas','build','stable','ready','archive'];
const PNAME=['Ideen','Aufbau','Stabil','Reif','Archiv'];
const ST={g:'Erledigt',o:'Entschuldigt',r:'Nicht','':'Offen'};
let tab='heute', mehrPage=null, cur=1, sheetKind=null;

/* ---------- Daten ---------- */
const ofPhase=p=>D.habits.filter(h=>h.phase===p);
const active=()=>D.habits.filter(h=>h.phase!=='idea');
const due=()=>active().filter(h=>h.faelligHeute);
function tag(){const f=due();return{e:f.filter(h=>h.heute==='g'||h.heute==='o').length,n:f.length,offen:f.filter(h=>!h.heute).length};}
const nBuild=()=>ofPhase('build').length;
const platz=()=>nBuild()<=reg.neuAb;
const counts=()=>[ideas.length,nBuild(),ofPhase('stable').length,ofPhase('archive').length,D.archiv.length];
const days=h=>{const m=/\d+/.exec(h.satz);return m?+m[0]:999;};
function whenRoom(){ // frühestens, wann wieder Platz ist
  const need=nBuild()-reg.neuAb; if(need<=0)return 0;
  const d=ofPhase('build').map(days).sort((a,b)=>a-b);return d[need-1]||null;
}
const stIcon=s=>s==='g'?ic('check'):s==='o'?ic('dash'):s==='r'?ic('x'):'';
function pfad(h,big){
  return `<div class="pfad${big?' big':''}"><i style="width:${(h.fill*100).toFixed(1)}%"></i><b class="${h.fill>=h.mark?'on':''}" style="left:${h.mark*100}%"></b><b class="end"></b></div>`;
}
function mark(h){
  if(!h.faelligHeute&&!h.heute)return `<span class="mk na" aria-label="Heute nicht fällig"></span>`;
  return `<span class="mk ${h.heute}" aria-label="Heute: ${ST[h.heute]}">${stIcon(h.heute)}</span>`;
}
const phaseLabel=h=>({build:'Im Aufbau',stable:'Stabil',archive:'Archiv-reif'}[h.phase]);

/* ---------- Kopf ---------- */
function renderTop(){
  let t='',sub='',back='';
  if(tab==='heute'){t='Heute';sub=D.heuteLang;}
  else if(tab==='weg'){t='Weg';sub='Von der Idee bis ins Archiv';}
  else if(!mehrPage){t='Mehr';sub='Rückblick, Wissen, Einstellungen';}
  else{t={rueck:'Rückblick',wissen:'Wissen',einst:'Einstellungen'}[mehrPage];back=`<button class="back" data-act="back" aria-label="Zurück">${ic('back',24)}</button>`;}
  $('#top').innerHTML=`<div class="top-l">${back}<div><h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div></div><button class="ibtn" data-act="info" aria-label="Über dieses Layout">${ic('info',22)}</button>`;
}
function renderTabs(){
  const o=tag().offen, bt=document.querySelectorAll('#tabs button');
  bt[0].innerHTML=ic('check',24)+'Heute'+(o?`<span class="badge num">${o}</span>`:'');
  bt[1].innerHTML=ic('route',24)+'Weg'+(platz()&&ideas.length?'<span class="pip" title="Platz für eine neue"></span>':'');
  bt[2].innerHTML=ic('menu',24)+'Mehr';
  bt.forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
}

/* ---------- Heute ---------- */
function row(h){
  const sport=!h.faelligHeute;
  const lab=phaseLabel(h)+(sport?` · ${(h.wocheStand||'0/2').replace(/^\d/,m=>String(+m+(h.heute==='g'?1:0)))} diese Woche`:'');
  return `<div class="row ${h.heute==='g'?'done':''}"><button class="rtxt" data-act="detail" data-id="${h.id}"><span class="rname">${esc(h.name)}</span><span class="rphase ${h.phase==='build'?'b':''}">${lab}</span></button><button class="tile ${h.heute}" data-act="tile" data-id="${h.id}" aria-label="${esc(h.name)}: ${ST[h.heute]}">${stIcon(h.heute)}</button></div>`;
}
function renderHeute(){
  const s=$('#s-heute'), old=$('.scroll',s), top=old?old.scrollTop:0, t=tag();
  const daily=due(), build=daily.filter(h=>h.phase==='build'), rest=daily.filter(h=>h.phase!=='build'), extra=active().filter(h=>!h.faelligHeute);
  const line=t.offen?`<b>${t.offen} offen</b> <span>· ${t.e} von ${t.n}</span>`:`<b>Alles erledigt</b> <span>· ${t.e} von ${t.n}</span>`;
  s.innerHTML=`<div class="status"><div class="line num">${line}</div><div class="bar"><i style="width:${t.n?t.e/t.n*100:0}%"></i></div></div>
  <div class="scroll">
   ${t.offen===0?'<div class="allgood">Schön. Für heute ist alles abgehakt.</div>':''}
   ${build.length?`<div class="list">${build.map(row).join('')}</div>`:''}
   ${rest.length?`<div class="list">${rest.map(row).join('')}</div>`:''}
   ${extra.length?`<div class="list">${extra.map(row).join('')}</div>`:''}
   <p class="hint">Tippen = erledigt. Gedrückt halten oder auf eine<br>gefüllte Kachel tippen für Entschuldigt und Nicht.</p>
  </div>`;
  $('.scroll',s).scrollTop=top;
}

/* ---------- Weg ---------- */
function slotsHTML(cls,n){const len=Math.max(reg.max,n);let h='';for(let i=0;i<len;i++)h+=`<i class="${i>=n?'free':i>=reg.max?'over':''}"></i>`;return h;}
function renderStepper(){
  const c=counts(), n=nBuild();
  let h='';
  PNAME.forEach((p,i)=>{h+=(i?'<span class="sep">›</span>':'')+`<button class="st ${i===cur?'on':''} ${i===1&&n>reg.max?'warn':''}" data-act="goto" data-i="${i}"><b class="num">${c[i]}</b><span>${p}</span></button>`;});
  const ok=platz();
  let dots='';for(let i=0;i<Math.max(reg.max,n);i++)dots+=`<i class="${i>=n?'free':i>=reg.max?'over':''}"></i>`;
  const txt=ok?'Platz für eine neue Gewohnheit':`Noch kein Platz: ${n} im Aufbau`;
  return `<div class="stepper" id="stepper">${h}</div><button class="platz ${ok?'ok':'no'}" data-act="goto" data-i="${ok?0:1}"><span class="pd">${dots}</span><span>${txt}</span><span class="go">${ic('chev',18)}</span></button>`;
}
function colIdeas(){
  const n=nBuild(), ok=platz(), top=ideas[0];
  let h=`<div class="col-head"><h2>Ideen</h2><p>Hier parkst du Einfälle, nach Wichtigkeit. Nichts davon eilt.</p></div>`;
  if(!top){h+=`<div class="empty"><div class="ei">${ic('bulb',24)}</div><h3>Keine Ideen geparkt</h3><p>Fällt dir etwas ein, parke es hier, statt es sofort zu starten.</p></div>`;}
  else{
    let why;
    if(ok)why=`<div class="why ok">${ic('check',18)}<div>Platz ist da: ${n} im Aufbau, eine neue ab höchstens ${reg.neuAb}.</div></div>`;
    else{const w=whenRoom();why=`<div class="why">${ic('info',18)}<div>Noch kein Platz: ${n} im Aufbau, eine neue ab höchstens ${reg.neuAb}.${w?`<small>Frühestens in etwa ${w} Tagen, wenn die ersten stabil sind.</small>`:''}</div></div>`;}
    h+=`<div class="kick">Nächste Idee</div><div class="next"><span class="chip ${top.prio==='hoch'?'hoch':''}">${PRIO[top.prio]}</span><div class="nt">${esc(top.text)}</div>${top.notiz?`<div class="nn">${esc(top.notiz)}</div>`:''}<button class="btn" data-act="startsheet" data-i="0" ${ok?'':'disabled'}>Starten</button>${why}</div>`;
    if(ideas.length>1){
      h+=`<div class="kick">Danach</div>`+ideas.slice(1).map((x,i)=>`<div class="irow"><div class="it"><div>${esc(x.text)}</div><span class="chip ${x.prio==='hoch'?'hoch':''}">${PRIO[x.prio]}</span></div><button class="pull" data-act="pull" data-i="${i+1}">Vorziehen</button></div>`).join('');
    }
  }
  h+=`<button class="addbtn" data-act="parksheet">${ic('plus',18)} Idee parken</button>`;
  return h;
}
function colBuild(){
  const n=nBuild(), hs=ofPhase('build');
  let cls,word;
  if(n<=reg.neuAb){cls='ok';word='Platz für eine neue';}
  else if(n<=reg.max&&n===reg.max){cls='full';word='voll';}
  else if(n<reg.max){cls='';word='fast Platz';}
  else {cls='over';word='eher voll';}
  return `<div class="col-head"><h2>Im Aufbau</h2><p>Hier brauchen Gewohnheiten deine Aufmerksamkeit, bis sie sitzen.</p></div>
   <div class="cap ${cls}"><div class="cap-top"><b class="num">${n} von ${reg.max}</b><span>${word}</span></div><div class="slots">${slotsHTML(cls,n)}</div><p>Eine neue Gewohnheit erst, wenn höchstens ${reg.neuAb} im Aufbau sind.</p></div>`
   +hs.map(card).join('')||'';
}
function card(h){return `<button class="hcard" data-act="detail" data-id="${h.id}"><div class="hc-top"><span class="hc-name">${esc(h.name)}</span>${mark(h)}</div>${pfad(h)}<div class="hc-satz">${esc(h.satz)}</div></button>`;}
function colStable(){
  const hs=ofPhase('stable');
  return `<div class="col-head"><h2>Stabil</h2><p>Sie sitzen und machen Platz im Aufbau. Du hakst sie noch ab, bis sie von allein laufen.</p></div>`+
   (hs.length?hs.map(card).join(''):`<div class="empty"><p>Noch keine stabile Gewohnheit. Die erste kommt, wenn eine im Aufbau die Marke erreicht.</p></div>`);
}
function colReady(){
  const hs=ofPhase('archive');
  let h=`<div class="col-head"><h2>Archiv-reif</h2><p>Sie laufen von allein. Du musst nicht mehr daran denken.</p></div>`;
  if(hs.length){h+=hs.map(card).join('');return h;}
  const near=ofPhase('stable').sort((a,b)=>days(a)-days(b))[0];
  h+=`<div class="empty"><div class="ei">${ic('archive',24)}</div><h3>Noch nichts hier</h3><p>Sobald eine stabile Gewohnheit am Ende ihres Balkens ankommt, landet sie hier. <b>„Ins Archiv legen"</b> bietet dir die App nur an dieser Stelle an, nie früher.</p>${near?`<div class="near">Am nächsten dran: <b>${esc(near.name)}</b>, ${near.satz.replace('Archiv-reif ','')}.</div>`:''}</div>`;
  return h;
}
function colArchive(){
  let h=`<div class="col-head"><h2>Archiv</h2><p>Geschafft. Hier musst du nichts mehr abhaken.</p></div>`;
  h+=D.archiv.map(a=>`<div class="acard"><div class="ah"><span class="ai">${D.svg(a.icon,22)}</span><div><h3>${esc(a.name)}</h3><div class="am num">${a.tageDabei} Tage dabei · Quote ${a.quote} %</div></div></div><div class="kick" style="padding-left:0;margin-top:14px">Ablauf</div><ol class="ablauf">${a.ablauf.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${a.notiz?`<div class="aq">„${esc(a.notiz)}"</div>`:''}</div>`).join('');
  return h;
}
function renderWeg(keep){
  const s=$('#s-weg'), b=$('.board',s);
  const sl=b?b.scrollLeft:0, st=b?[...b.children].map(c=>c.scrollTop):[];
  s.innerHTML=renderStepper()+`<div class="board" id="board"><div class="col" data-i="0">${colIdeas()}</div><div class="col" data-i="1">${colBuild()}</div><div class="col" data-i="2">${colStable()}</div><div class="col" data-i="3">${colReady()}</div><div class="col" data-i="4">${colArchive()}</div></div>`;
  const nb=$('.board',s);
  nb.style.scrollSnapType='none';
  nb.scrollLeft=keep?sl:colLeft(cur);
  if(keep)[...nb.children].forEach((c,i)=>c.scrollTop=st[i]||0);
  requestAnimationFrame(()=>{nb.style.scrollSnapType='';});
  nb.addEventListener('scroll',onScroll,{passive:true});
}
const colLeft=i=>{const c=$(`.col[data-i="${i}"]`);return c?Math.max(0,c.offsetLeft-16):0;};
function jump(i,smooth){cur=i;const b=$('#board');if(!b)return;b.scrollTo({left:colLeft(i),behavior:smooth?'smooth':'auto'});markStep();}
function markStep(){document.querySelectorAll('#stepper .st').forEach((e,i)=>e.classList.toggle('on',i===cur));}
let raf=0;
function onScroll(e){
  if(raf)return;
  raf=requestAnimationFrame(()=>{raf=0;const b=e.target;let best=0,bd=1e9;
    b.querySelectorAll('.col').forEach((c,i)=>{const d=Math.abs(c.offsetLeft-16-b.scrollLeft);if(d<bd){bd=d;best=i;}});
    if(best!==cur){cur=best;markStep();}});
}

/* ---------- Mehr ---------- */
function renderMehr(){
  const s=$('#s-mehr');
  if(!mehrPage){
    s.innerHTML=`<div class="scroll"><div class="list" style="margin-top:8px">
     <button class="mrow" data-act="mehr" data-p="rueck"><span class="mi">${ic('chart',22)}</span><span class="mt"><b>Rückblick</b><span>Die letzten 14 Tage</span></span><span class="chev">${ic('chev',20)}</span></button>
     <button class="mrow" data-act="mehr" data-p="wissen"><span class="mi">${ic('book',22)}</span><span class="mt"><b>Wissen</b><span>Kernideen und „Es hakt – was tun?"</span></span><span class="chev">${ic('chev',20)}</span></button>
     <button class="mrow" data-act="mehr" data-p="einst"><span class="mi">${ic('gear',22)}</span><span class="mt"><b>Einstellungen</b><span>Erinnerung, Tempo, Sicherung</span></span><span class="chev">${ic('chev',20)}</span></button>
    </div><p class="hint">Ideen und Archiv findest du auf dem Weg,<br>dort, wo sie im Leben einer Gewohnheit liegen.</p></div>`;
  }else if(mehrPage==='rueck'){
    const lab=D.tageLabels(14), ds=due(), avg=ds.length?Math.round(ds.reduce((a,h)=>a+h.quote,0)/ds.length):0;
    const all=active().filter(h=>h.phase==='build').concat(active().filter(h=>h.phase!=='build'));
    const g=h=>`<div class="gr"><span class="gn">${esc(h.name)}</span><span class="gd">${h.letzte14.map((x,i)=>`<i class="dot ${x} ${i===13?'today':''}"></i>`).join('')}</span></div>`;
    s.innerHTML=`<div class="scroll"><div class="rv"><div class="rv-sum"><div><b class="num">${avg} %</b><span>Quote, täglich</span></div><div><b class="num">${ofPhase('build').length+ofPhase('stable').length}</b><span>Gewohnheiten aktiv</span></div></div>
     <div class="grid"><div class="gr gh"><span class="gn"></span><span class="gd">${lab.map((l,i)=>`<span class="${i===13?'t':''}">${l.charAt(0)}</span>`).join('')}</span></div>${all.map(g).join('')}</div>
     <div class="legend"><span><i class="dot g"></i>Erledigt</span><span><i class="dot o"></i>Entschuldigt</span><span><i class="dot r"></i>Nicht</span><span><i class="dot"></i>Offen oder noch nicht dabei</span></div></div></div>`;
  }else if(mehrPage==='wissen'){
    const w=[
     ['Jeden Tag ein bisschen besser','Kleine Schritte zählen, weil sie sich summieren.','<p>Eine Gewohnheit wächst nicht durch einen großen Anlauf, sondern durch Wiederholung. Ein Prozent besser pro Tag ist kaum zu spüren und nach einem Jahr trotzdem enorm. Zähl deshalb Tage, nicht Ergebnisse.</p>'],
     ['Erst wer du sein willst','Identität zuerst, dann die Handlung.','<p>Frag nicht „Was will ich erreichen?", sondern „Wer will ich sein?". Jedes Abhaken ist eine Stimme für diese Person. Deshalb gibt es zu jeder Gewohnheit einen Satz wie „Ich erledige Dinge direkt."</p>'],
     ['Nie zweimal aussetzen','Einmal ist ein Ausrutscher, zweimal der Anfang einer neuen Gewohnheit.','<p>Ein verpasster Tag ist menschlich. Wichtig ist, am nächsten Tag wieder anzufangen. Entschuldigte Tage (Krankheit, Reise) zählen darum nicht als Aussetzer.</p>'],
     ['Es hakt – was tun?','Vier Hebel, in dieser Reihenfolge.','<ol><li><b>Kleiner machen.</b> Nur die ersten zwei Minuten: Schuhe anziehen, App öffnen.</li><li><b>An etwas Festes koppeln.</b> „Nach dem Zähneputzen …"</li><li><b>Sichtbar machen.</b> Der Auslöser liegt dort, wo du ihn siehst.</li><li><b>Sofort belohnen.</b> Ein Haken zählt schon, gönn dir das Gefühl.</li></ol>']
    ];
    s.innerHTML=`<div class="scroll" style="padding-top:6px">${w.map((x,i)=>`<details class="wcard" ${i===3?'open':''}><summary><div><b>${x[0]}</b><span>${x[1]}</span></div><span class="chev">${ic('chev',20)}</span></summary><div class="wb">${x[2]}</div></details>`).join('')}<div style="height:24px"></div></div>`;
  }else{
    const sw=(k)=>`<button class="sw ${state[k]?'on':''}" data-act="toggle" data-k="${k}" role="switch" aria-checked="${!!state[k]}"></button>`;
    const stp=(k,v)=>`<span class="stp"><button data-act="regel" data-k="${k}" data-d="-1" aria-label="weniger">−</button><b class="num">${v}</b><button data-act="regel" data-k="${k}" data-d="1" aria-label="mehr">+</button></span>`;
    s.innerHTML=`<div class="scroll"><div class="sgrp">Erinnerung</div><div class="sbox">
      <div class="srow"><span class="sl">Abends erinnern<small>Eine ruhige Nachricht, keine Serie.</small></span>${sw('push')}</div>
      <div class="srow"><span class="sl">Uhrzeit</span><span class="sv num">21:00</span></div></div>
     <div class="sgrp">Tempo</div><div class="sbox">
      <div class="srow"><span class="sl">Gleichzeitig im Aufbau<small>höchstens</small></span>${stp('max',reg.max)}</div>
      <div class="srow"><span class="sl">Neue Gewohnheit ab<small>höchstens … im Aufbau</small></span>${stp('neuAb',reg.neuAb)}</div></div>
     <div class="sgrp">Sicherung</div><div class="sbox">
      <div class="srow"><span class="sl">Letzte Sicherung<small>Automatisch in der Cloud</small></span><span class="sv">Heute, 07:12</span></div>
      <div class="srow"><button class="sl" style="text-align:left;color:var(--accent-ink);font-weight:600;min-height:44px" data-act="backup">Jetzt sichern</button></div>
      <div class="srow"><span class="sl">Wiederherstellungscode</span><span class="sv">${ic('lock',18)}</span></div></div>
     <div class="sgrp">Darstellung</div><div class="sbox"><div class="srow"><span class="sl">Hell oder Dunkel</span><span class="sv">Automatisch</span></div></div>
     <p class="foot">Cadence · Prototyp „Phasen-Board"</p></div>`;
  }
}
const state={push:true};

/* ---------- Blatt ---------- */
function openSheet(html,kind){sheetKind=kind||null;$('#sheet').innerHTML=`<div class="grab"></div>`+html;$('#scrim').classList.add('on');$('#sheet').scrollTop=0;}
function closeSheet(){$('#scrim').classList.remove('on');sheetKind=null;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2300);}
const closeBtn=`<button class="sh-x" data-act="close" aria-label="Schließen">${ic('x',22)}</button>`;

function detail(id){
  const h=D.habits.find(x=>x.id===id); if(!h)return;
  const lab=D.tageLabels(14);
  const pc=h.phase==='build'?`Im Aufbau · seit ${h.alter} Tagen`:h.phase==='stable'?`Stabil · seit ${h.alter} Tagen dabei`:'Archiv-reif';
  const unit=h.serieEinheit==='Wochen'?'Wochen am Stück':'Tage am Stück';
  openSheet(`<div class="sh-head"><span class="ico">${D.svg(h.icon,24)}</span><div><h2>${esc(h.name)}</h2><div class="pc">${pc}</div></div>${closeBtn}</div>
   <div class="bigp">${pfad(h,true)}<div class="bl"><span style="left:0">Start</span><span style="left:${h.mark*100}%;transform:translateX(-50%)">Stabil</span><span style="right:0">Archiv-reif</span></div></div>
   <div class="satz-big">${esc(h.satz)}</div>
   <div class="stats"><div><b class="num">${h.quote?h.quote+' %':'–'}</b><span>Quote</span></div><div><b class="num">${h.serie}</b><span>${unit}</span></div></div>
   <div class="h4">Letzte 14 Tage</div>
   <div class="d14">${h.letzte14.map((x,i)=>`<div class="c ${i===13?'t':''}"><i class="dot ${x}"></i>${lab[i].charAt(0)}</div>`).join('')}</div>
   <div class="h4">Notiz</div>
   ${h.notiz?`<p class="note">„${esc(h.notiz)}"</p>`:`<p class="note none">Noch keine Notiz. Wer willst du mit dieser Gewohnheit sein?</p>`}
   <div class="h4">Heute</div>
   <div class="seg">${['g','o','r',''].map(s=>`<button class="${s} ${h.heute===s?'on':''}" data-act="set" data-id="${h.id}" data-s="${s}"><i></i>${s===''?'Offen':ST[s]}</button>`).join('')}</div>
   ${h.phase==='archive'?`<button class="btn" data-act="archive" data-id="${h.id}">${ic('archive',20)} Ins Archiv legen</button>`:''}
   <button class="btn sec" data-act="edit" data-id="${h.id}" ${h.phase==='archive'?'':''}>Bearbeiten</button>`,'detail');
}
function editSheet(id){
  const h=D.habits.find(x=>x.id===id);
  openSheet(`<div class="sh-head"><span class="ico">${D.svg(h.icon,24)}</span><div><h2>Bearbeiten</h2><div class="pc">${esc(h.name)}</div></div>${closeBtn}</div>
   <label class="fld"><span>Name</span><input id="f-name" value="${esc(h.name)}"></label>
   <div class="fld"><span>Rhythmus</span><div class="chips"><button class="${h.faelligHeute?'on':''}">Jeden Tag</button><button class="${h.faelligHeute?'':'on'}">2× pro Woche</button><button>Wochentage</button></div></div>
   <label class="fld"><span>Wer willst du sein? (Notiz)</span><input id="f-note" value="${esc(h.notiz)}" placeholder="Ich bin jemand, der …"></label>
   <button class="btn" data-act="save" data-id="${h.id}">Speichern</button>
   <button class="btn txt" data-act="parkback" data-id="${h.id}">Zurück in die Ideen parken</button>`,'edit');
}
function startSheet(i){
  const x=ideas[i]; if(!x)return;
  openSheet(`<div class="sh-head"><span class="ico">${ic('bulb',24)}</span><div><h2>Im Aufbau starten</h2><div class="pc">Aus deinen Ideen</div></div>${closeBtn}</div>
   <label class="fld"><span>Name</span><input id="f-name" value="${esc(x.text)}"></label>
   <div class="fld"><span>Rhythmus</span><div class="chips" id="rh"><button class="on" data-act="rh" data-v="d">Jeden Tag</button><button data-act="rh" data-v="w">2× pro Woche</button></div></div>
   <label class="fld"><span>Wer willst du sein? (Notiz)</span><input id="f-note" value="${esc(x.notiz||'')}" placeholder="Ich bin jemand, der …"></label>
   <p class="plan">Stabil nach etwa 21 Tagen, Archiv-reif nach etwa 60. Danach ist wieder Platz.</p>
   <button class="btn" data-act="startgo" data-i="${i}">Im Aufbau starten</button>`,'start');
}
function parkSheet(){
  openSheet(`<div class="sh-head"><span class="ico">${ic('bulb',24)}</span><div><h2>Idee parken</h2><div class="pc">Sie wartet, bis Platz ist</div></div>${closeBtn}</div>
   <label class="fld"><span>Idee</span><input id="f-name" placeholder="z. B. Morgens Wasser trinken"></label>
   <div class="fld"><span>Wichtigkeit</span><div class="chips" id="pr"><button data-act="pr" data-v="hoch">Wichtig</button><button class="on" data-act="pr" data-v="mittel">Mittel</button><button data-act="pr" data-v="irgendwann">Irgendwann</button></div></div>
   <button class="btn" data-act="parkgo">Parken</button>`,'park');
}
function choice(id){
  const h=D.habits.find(x=>x.id===id);
  const o=[['g','Erledigt','Zählt für deine Serie'],['o','Entschuldigt','Zählt nicht als Aussetzer'],['r','Nicht','Heute nicht geschafft'],['','Zurücksetzen','Wieder offen']];
  openSheet(`<div class="sh-head"><div><h2>${esc(h.name)}</h2><div class="pc">Heute</div></div>${closeBtn}</div>`+o.map(x=>`<button class="opt" data-act="set" data-id="${id}" data-s="${x[0]}" data-close="1"><span class="tile ${x[0]}">${stIcon(x[0])}</span><span><b>${x[1]}</b><span>${x[2]}</span></span>${h.heute===x[0]?`<span class="cur">${ic('check',22)}</span>`:''}</button>`).join(''),'choice');
}
function infoSheet(){
  openSheet(`<div class="sh-head"><div style="flex:1"></div>${closeBtn}</div><div class="info" style="margin-top:-30px"><h3>Phasen-Board</h3>
   <p>Die App folgt dem Leben einer Gewohnheit: Idee, Im Aufbau, Stabil, Archiv-reif, Archiv. Der Weg ist die Navigation, jede Gewohnheit steht in genau einer Spalte.</p>
   <p><b>Stärke.</b> Du siehst auf einen Blick, wo alles steht und ob Platz für eine neue Gewohnheit ist; deine Tempo-Regel steht sichtbar im Raum statt in deinem Kopf.</p>
   <p><b>Preis.</b> Das Board ist ein zusätzlicher Ort, den man verstehen muss, und für alle fünf Phasen braucht es Wischen. Wer nur abhaken will, braucht es selten.</p></div>`,'info');
}

/* ---------- Aktionen ---------- */
function setHeute(id,s){D.setHeute(id,s);refresh();}
function refresh(){renderTop();renderTabs();renderHeute();renderWeg(true);if(tab==='mehr')renderMehr();}
function show(t){
  if(t!=='mehr'||tab==='mehr')mehrPage=null;
  tab=t;
  ['heute','weg','mehr'].forEach(k=>$('#s-'+k).classList.toggle('on',k===t));
  renderTop();renderTabs();
  if(t==='heute')renderHeute();
  if(t==='weg')renderWeg(false);
  if(t==='mehr')renderMehr();
}
let longFired=false,lt=0;
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-act="tile"]');if(!t)return;longFired=false;
  lt=setTimeout(()=>{longFired=true;choice(t.dataset.id);},480);
});
['pointerup','pointercancel','pointermove','scroll'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lt),true));

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==='scrim'){if(e.target.id==='scrim')closeSheet();return;}
  if(a==='tile'){
    if(longFired){longFired=false;return;}
    const h=D.habits.find(x=>x.id===id);
    if(!h.heute)setHeute(id,'g');else choice(id);return;
  }
  switch(a){
    case 'tab':show(el.dataset.tab);break;
    case 'goto':jump(+el.dataset.i,true);break;
    case 'detail':detail(id);break;
    case 'set':D.setHeute(id,el.dataset.s);refresh();if(el.dataset.close)closeSheet();else detail(id);break;
    case 'close':closeSheet();break;
    case 'info':infoSheet();break;
    case 'edit':editSheet(id);break;
    case 'save':{const h=D.habits.find(x=>x.id===id);const n=$('#f-name').value.trim();if(n)h.name=n;h.notiz=$('#f-note').value.trim();closeSheet();refresh();toast('Gespeichert');break;}
    case 'parkback':{const h=D.habits.find(x=>x.id===id);h.phase='idea';ideas.push({text:h.name,notiz:'Zurückgestellt, kommt später wieder dran.',prio:'mittel'});ideas.sort((x,y)=>PORD[x.prio]-PORD[y.prio]);closeSheet();refresh();toast('Zurück in den Ideen. Im Aufbau: '+nBuild());break;}
    case 'archive':{const h=D.habits.find(x=>x.id===id);h.phase='idea';D.archiv.unshift({name:h.name,icon:h.icon,tageDabei:h.alter,quote:h.quote,ablauf:[],notiz:h.notiz});closeSheet();refresh();toast('Im Archiv. Geschafft.');break;}
    case 'pull':{const i=+el.dataset.i;const [x]=ideas.splice(i,1);ideas.unshift(x);refresh();toast('Jetzt die nächste Idee');break;}
    case 'startsheet':startSheet(+el.dataset.i);break;
    case 'rh':document.querySelectorAll('#rh button').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'startgo':{
      const i=+el.dataset.i,x=ideas[i];if(!x||!platz())return;
      const daily=$('#rh .on').dataset.v==='d';
      const n=$('#f-name').value.trim()||x.text;
      ideas.splice(i,1);
      D.habits.push({id:'n'+Date.now(),name:n,icon:I.bulb,rhythmus:daily?'Jeden Tag':'2× pro Woche',faelligHeute:daily,wocheStand:'0/2',gruppe:null,notiz:$('#f-note').value.trim(),alter:0,phase:'build',fill:0,mark:.35,satz:'Stabil in 21 Tagen',quote:0,serie:0,serieEinheit:daily?'Tage':'Wochen',heute:'',letzte14:Array(14).fill('')});
      closeSheet();cur=1;refresh();jump(1,true);toast('Gestartet. Im Aufbau: '+nBuild());break;}
    case 'parksheet':parkSheet();break;
    case 'pr':document.querySelectorAll('#pr button').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'parkgo':{const t=$('#f-name').value.trim();if(!t){$('#f-name').focus();return;}ideas.push({text:t,notiz:'',prio:$('#pr .on').dataset.v});ideas.sort((x,y)=>PORD[x.prio]-PORD[y.prio]);closeSheet();refresh();toast('Geparkt');break;}
    case 'mehr':mehrPage=el.dataset.p;renderTop();renderMehr();break;
    case 'back':mehrPage=null;renderTop();renderMehr();break;
    case 'toggle':state[el.dataset.k]=!state[el.dataset.k];renderMehr();break;
    case 'regel':{const k=el.dataset.k,d=+el.dataset.d;
      if(k==='max')reg.max=Math.min(6,Math.max(1,reg.max+d));else reg.neuAb=Math.min(6,Math.max(0,reg.neuAb+d));
      if(reg.neuAb>reg.max)reg.neuAb=reg.max;refresh();break;}
    case 'backup':toast('Gesichert (Demo)');break;
  }
});

show('heute');
})();
</script>
</body>
</html>
