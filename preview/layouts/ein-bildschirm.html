<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cadence – Ein Bildschirm</title>
<link rel="stylesheet" href="base.css">
<style>
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
body.lock{overflow:hidden}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:430px;margin:0 auto;min-height:100dvh;padding:0 16px calc(48px + var(--safe-bottom))}
.muted{color:var(--muted)}

/* ---------- Kopf ---------- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-top) + 4px) 0 0;margin:0 -16px;padding-left:16px;padding-right:4px;background:var(--bg)}
.top .date{font-size:14px;color:var(--muted)}
.top .btns{display:flex}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-soft)}
.ibtn.q{color:var(--faint)}
.ibtn:active{background:var(--surface-2)}
.head{padding:6px 0 22px}
.head .big{font-size:46px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.head .big .num{font-size:60px;margin-right:4px}
.head .big.calm{font-size:38px}
.head .sub{margin-top:6px;font-size:17px;color:var(--ink-soft)}
.segs{display:flex;gap:3px;margin-top:14px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--surface-3);transition:background .25s}
.segs i.g{background:var(--g)} .segs i.o{background:var(--o)} .segs i.r{background:var(--r)}

/* ---------- Abschnitte ---------- */
.sec-h{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0 0 10px}
section.sec{margin-bottom:30px}

/* offene Reihen */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:8px;min-height:76px;background:var(--surface);border-radius:var(--radius);
  padding:8px 10px 8px 4px;box-shadow:0 0 0 1px var(--line);transition:opacity .35s,transform .35s}
.row.leave{opacity:.45;transform:scale(.985)}
.row .nm{flex:1;min-width:0;text-align:left;padding:10px 12px;min-height:60px;display:flex;flex-direction:column;justify-content:center;border-radius:10px}
.row .nm .t{font-size:18px;font-weight:600;line-height:1.25}
.row .nm .s{font-size:13px;color:var(--muted);margin-top:2px}
.tile.big{width:60px;height:60px;border-radius:16px}
.tile.big svg{width:28px;height:28px}
.tile{-webkit-touch-callout:none}
.hint{margin:12px 4px 0;font-size:13px;color:var(--faint);text-align:center}
.calm-line{display:flex;align-items:center;gap:10px;padding:16px;border-radius:var(--radius);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.calm-line .tile{width:28px;height:28px;border-radius:9px;background:var(--g);box-shadow:none}
.calm-line .tile svg{width:16px;height:16px}

/* erledigt-Block */
.done{margin-top:16px}
.done-h{display:flex;align-items:center;gap:6px;width:100%;min-height:44px;padding:0 4px;font-size:14px;font-weight:600;color:var(--muted);text-align:left}
.done-h svg{width:16px;height:16px;transition:transform .2s}
.done.open .done-h svg{transform:rotate(90deg)}
.done-list{display:none;border-top:1px solid var(--line)}
.done.open .done-list{display:block}
.dl{display:flex;align-items:center;border-bottom:1px solid var(--line);min-height:46px}
.dl .nm{flex:1;min-width:0;text-align:left;font-size:15px;color:var(--muted);padding:10px 4px;min-height:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .nm.r{color:var(--faint)}
.tile.mini{position:relative;width:28px;height:28px;border-radius:9px;margin:0 8px}
.tile.mini svg{width:16px;height:16px}
.tile.mini::after{content:"";position:absolute;inset:-9px -8px}

/* Dein Stand */
.grp-h{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 6px}
.grp-h:first-of-type{margin-top:0}
.rule{margin:0 4px 10px;font-size:14px;color:var(--ink-soft)}
.rule button{color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);padding:6px 0}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.srow{display:block;width:100%;text-align:left;padding:12px 16px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow:active{background:var(--surface-2)}
.srow .l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.srow .t{font-size:16px;font-weight:600;line-height:1.3}
.srow .wk{font-size:12.5px;color:var(--muted);white-space:nowrap}
.pfad{display:block}
.srow .satz{display:block;margin-top:9px;font-size:13.5px;color:var(--muted)}

.foot{margin-top:6px}
.addrow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--radius);
  border:1.5px dashed var(--line-2);color:var(--muted);font-weight:600;font-size:15px}
.addrow svg{width:18px;height:18px}
.addrow:active{background:var(--surface-2)}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,10,8,.42);opacity:0;pointer-events:none;transition:opacity .22s;z-index:30}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.hi{z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:430px;background:var(--surface);
  border-radius:22px 22px 0 0;max-height:92dvh;overflow-y:auto;overflow-x:hidden;transform:translateY(106%);visibility:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;z-index:31;padding:8px 20px calc(22px + var(--safe-bottom))}
.sheet.hi{z-index:41}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:38px;height:4px;border-radius:2px;background:var(--surface-3);margin:0 auto 10px}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:18px}
.sh-head h2{font-size:22px;line-height:1.25;letter-spacing:-.01em}
.sh-head p{font-size:14px;color:var(--muted);margin-top:2px}
.sh-head .ibtn{margin:-6px -10px 0 0;flex-shrink:0}
.bar{margin:4px 0 0;padding-right:2px}
.bar-l{position:relative;height:20px;margin-top:8px;font-size:12px;color:var(--muted)}
.bar-l span{position:absolute;top:0;white-space:nowrap}
.satz-big{margin-top:6px;font-size:18px;font-weight:600}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}
.fig{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px 16px}
.fig b{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.fig span{font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(14,1fr);justify-items:center;row-gap:6px;margin-bottom:6px}
.days .dot{width:17px;height:17px;border-radius:5px}
.days .dot.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink-soft)}
.days small{font-size:11px;color:var(--faint)}
.days small.t{color:var(--ink);font-weight:700}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.note{margin:16px 0 0;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:var(--radius);font-weight:600;font-size:16px;
  background:var(--surface-2);color:var(--ink)}
.btn:active{background:var(--surface-3)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.pri:active{filter:brightness(.92)}
.btn+.btn{margin-top:10px}
.today-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:10px 10px 10px 16px;border-radius:var(--radius-sm);background:var(--surface-2)}
.today-row span{font-size:15px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;text-align:left;font-size:17px;font-weight:600;padding:0 4px;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .tile{width:34px;height:34px;border-radius:10px;pointer-events:none}
.opt .tile svg{width:18px;height:18px}
.opt small{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--muted)}
.opt:disabled{opacity:.4;cursor:default}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--radius-sm);padding:12px 14px;min-height:48px;outline:0;resize:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--surface-2);border-radius:var(--radius-sm);padding:3px;gap:2px}
.seg button{flex:1;min-height:42px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.warn{padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface-2);font-size:14px;color:var(--ink-soft);margin-bottom:14px;border-left:3px solid var(--o)}
.info-k{margin-top:14px}
.info-k b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.info-k p{font-size:15px}

/* ---------- Menü / Seiten ---------- */
.panel{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:430px;background:var(--bg);z-index:20;
  display:flex;flex-direction:column;transform:translateX(104%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s}
.panel.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.panel.pg{z-index:25}
.ph{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 4px) 4px 0 8px;flex-shrink:0}
.back{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 10px 0 4px;color:var(--accent-ink);font-weight:600;font-size:16px}
.back svg{width:22px;height:22px}
.pbody{flex:1;overflow-y:auto;padding:4px 16px calc(40px + var(--safe-bottom))}
.pbody h1{font-size:32px;letter-spacing:-.02em;line-height:1.15;margin:6px 4px 16px}
.pbody .lead{margin:-8px 4px 18px;color:var(--muted);font-size:15px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:68px;padding:10px 14px 10px 14px;background:var(--surface);
  border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);margin-bottom:8px}
.mrow:active{background:var(--surface-2)}
.mrow .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft);flex-shrink:0}
.mrow .tx{flex:1;min-width:0}
.mrow .tx b{display:block;font-size:17px;font-weight:600}
.mrow .tx span{font-size:13.5px;color:var(--muted)}
.mrow>svg{color:var(--faint);width:18px;height:18px}
.item{padding:14px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{display:block;font-size:16px;font-weight:600}
.item span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.status{padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft);color:var(--accent-ink);font-size:15px;margin-bottom:6px}
.status b{display:block;margin-bottom:2px}
.addidea{display:flex;gap:8px;margin:14px 0 4px}
.addidea input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line-2);border-radius:var(--radius-sm);padding:0 14px;min-height:48px;outline:0}
.addidea input:focus{border-color:var(--accent)}
.addidea button{min-width:48px;padding:0 16px;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);font-weight:600;min-height:48px}
.steps{margin:8px 0 0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:8px 0;font-size:15.5px}
.steps li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--muted);flex-shrink:0}
.sums{display:flex;gap:14px;flex-wrap:wrap;margin:0 4px 16px;font-size:14px;color:var(--ink-soft)}
.sums span{display:flex;align-items:center;gap:6px}
.rb{padding:14px 14px 12px;background:var(--surface);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);margin-bottom:8px}
.rb-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.rb-h button{text-align:left;font-weight:600;font-size:15px;min-height:30px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-h span{font-size:12.5px;color:var(--muted)}
.rb .days{margin:0}
.rb .days .dot{width:16px;height:16px}
.rbhead{display:grid;grid-template-columns:repeat(14,1fr);justify-items:center;margin:0 14px 6px;font-size:11px;color:var(--faint)}
.rbhead .t{color:var(--ink);font-weight:700}
.wcard{background:var(--surface);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);margin-bottom:8px;overflow:hidden}
.wcard>button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;padding:8px 16px;text-align:left;font-weight:600;font-size:16.5px}
.wcard>button svg{width:18px;height:18px;color:var(--faint);transition:transform .2s;flex-shrink:0}
.wcard.open>button svg{transform:rotate(90deg)}
.wcard .wb{display:none;padding:0 16px 16px;font-size:15.5px;color:var(--ink-soft)}
.wcard.open .wb{display:block}
.wcard .wb p+p,.wcard .wb ul{margin-top:8px}
.wcard .wb ul{padding-left:20px;margin-bottom:0}
.wcard .wb li{margin-bottom:5px}
.srow2{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.srow2:last-child{border-bottom:0}
.srow2 .tx{flex:1;min-width:0}
.srow2 .tx b{display:block;font-weight:600;font-size:16px}
.srow2 .tx span{font-size:13px;color:var(--muted)}
.srow2 .val{font-size:15px;color:var(--muted)}
.srow2>svg{width:16px;height:16px;color:var(--faint)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface-3);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.slbl{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <span class="date" id="date"></span>
    <span class="btns">
      <button class="ibtn q" id="btnInfo" aria-label="Über dieses Layout"></button>
      <button class="ibtn" id="btnMenu" aria-label="Menü"></button>
    </span>
  </header>
  <div class="head" id="head"></div>
  <section class="sec" id="heute"></section>
  <section class="sec" id="stand"></section>
  <div class="foot"><button class="addrow" id="btnNew"></button></div>
</div>

<div class="panel" id="menu"></div>
<div class="panel pg" id="page"></div>

<div class="scrim" id="scrimA"></div><section class="sheet" id="sheetA"></section>
<div class="scrim hi" id="scrimB"></div><section class="sheet hi" id="sheetB"></section>
<div class="toast" id="toast"></div>

<script src="demo.js"></script>
<script>
(function(){
const D=DEMO, I=D.icons;
const $=s=>document.querySelector(s);
const ic=(k,s)=>D.svg(I[k],s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const markIc={g:'check',o:'dash',r:'x'};
const stName=D.zustandName;
const tileHtml=(st,cls,id)=>`<button class="tile ${cls||''} ${st}" data-tile="${id}" aria-label="${stName[st]}">${st?ic(markIc[st],22):''}</button>`;

// Wochenstand fuer nicht taeglich faellige Gewohnheiten
D.habits.forEach(h=>{ if(h.wocheStand){ h._w0=parseInt(h.wocheStand,10)||0; h._wz=parseInt(h.wocheStand.split('/')[1],10)||1; } });
const woche=h=>`${h._w0+(h.heute==='g'?1:0)}/${h._wz}`;
const byId=id=>D.habits.find(h=>h.id===id);

let doneOpen=true, detailId=null, pending=null, toastT=null;

/* ---------- Kopf ---------- */
function renderHead(){
  $('#date').textContent=D.heuteLang;
  const f=D.faellig(), t=D.tag();
  const op=f.filter(h=>!h.heute).length, nr=f.filter(h=>h.heute==='r').length;
  const big=op?`<span class="num">${op}</span> offen`:`Nichts offen`;
  const order=['g','o','r',''];
  const segs=[...f].sort((a,b)=>order.indexOf(a.heute)-order.indexOf(b.heute)).map(h=>`<i class="${h.heute}"></i>`).join('');
  $('#head').innerHTML=`<h1 class="big ${op?'':'calm'}">${big}</h1>
    <p class="sub num">${t.erledigt} von ${t.gesamt} erledigt${nr?` · ${nr} nicht`:''}</p>
    <div class="segs" aria-hidden="true">${segs}</div>`;
}

/* ---------- Heute ---------- */
function renderHeute(){
  const f=D.faellig(), open=f.filter(h=>!h.heute), done=f.filter(h=>h.heute);
  const nG=done.filter(h=>h.heute!=='r').length, nR=done.length-nG;
  let html=`<h2 class="sec-h">Heute</h2>`;
  if(open.length){
    html+=`<div class="rows">`+open.map(h=>`<div class="row" data-row="${h.id}">
      <button class="nm" data-open="${h.id}"><span class="t">${esc(h.name)}</span>${h.gruppe?`<span class="s">${esc(h.gruppe)}</span>`:''}</button>
      ${tileHtml('', 'big', h.id)}</div>`).join('')+`</div>
      <p class="hint">Tippen = erledigt · Halten = Entschuldigt / Nicht</p>`;
  }else{
    html+=`<div class="calm-line"><span class="tile">${ic('check',16)}</span>${nR?'Für heute ist alles abgehakt':'Alles erledigt für heute'}</div>`;
  }
  if(done.length){
    html+=`<div class="done ${doneOpen?'open':''}"><button class="done-h" data-act="done">${ic('chev',16)}<span class="num">Erledigt · ${nG}${nR?` · ${nR} nicht`:''}</span></button>
      <div class="done-list">`+done.map(h=>`<div class="dl"><button class="nm ${h.heute==='r'?'r':''}" data-open="${h.id}">${esc(h.name)}</button>${tileHtml(h.heute,'mini',h.id)}</div>`).join('')+`</div></div>`;
  }
  $('#heute').innerHTML=html;
}

/* ---------- Dein Stand ---------- */
function pfadHtml(h,big){
  const fill=Math.min(1,h.fill)*100, passed=h.fill>=h.mark;
  return `<span class="pfad ${big?'big':''}"><i style="width:${fill}%"></i><b class="${passed?'on':''}" style="left:${h.mark*100}%"></b><b class="end ${h.fill>=1?'on':''}"></b></span>`;
}
function standRow(h){
  return `<button class="srow" data-open="${h.id}"><span class="l1"><span class="t">${esc(h.name)}</span>${h.faelligHeute?'':`<span class="wk num">Woche ${woche(h)}</span>`}</span>
    ${pfadHtml(h)}<span class="satz">${esc(h.satz)}${h.faelligHeute?'':' · heute nicht fällig'}</span></button>`;
}
function renderStand(){
  const p=D.nachPhase(), nb=p.build.length;
  let html=`<h2 class="sec-h">Dein Stand</h2>`;
  const rule= nb<=D.regel.neuAb ? `${nb} im Aufbau. Du hast Platz für eine neue.` : `${nb} im Aufbau. Eine neue erst, wenn es höchstens ${D.regel.neuAb} sind.`;
  if(p.build.length) html+=`<h3 class="grp-h">${D.phaseName.build}</h3><p class="rule">${rule} <button data-page="ideen">Ideen ansehen</button></p><div class="card">${p.build.map(standRow).join('')}</div>`;
  if(p.stable.length) html+=`<h3 class="grp-h">${D.phaseName.stable}</h3><div class="card">${p.stable.map(standRow).join('')}</div>`;
  if(p.archive.length) html+=`<h3 class="grp-h">${D.phaseName.archive}</h3><p class="rule">Läuft von allein. Du darfst sie ins Archiv legen.</p><div class="card">${p.archive.map(standRow).join('')}</div>`;
  $('#stand').innerHTML=html;
}
function renderAll(){ renderHead(); renderHeute(); renderStand(); if(detailId&&sheetA.isOpen&&sheetA.kind==='detail') detailView(detailId,true); }

/* ---------- Sheets ---------- */
function mkSheet(sc,sh){
  const o={isOpen:false,kind:'',
    open(html,kind){ sh.innerHTML=`<div class="grab"></div>`+html; sh.scrollTop=0; sh.classList.add('on'); sc.classList.add('on'); o.isOpen=true; o.kind=kind||''; },
    fill(html){ const y=sh.scrollTop; sh.innerHTML=`<div class="grab"></div>`+html; sh.scrollTop=y; },
    close(){ sh.classList.remove('on'); sc.classList.remove('on'); o.isOpen=false; } };
  sc.addEventListener('click',()=>o.close());
  return o;
}
const sheetA=mkSheet($('#scrimA'),$('#sheetA'));
const sheetB=mkSheet($('#scrimB'),$('#sheetB'));
sheetA.el=$('#sheetA'); sheetB.el=$('#sheetB');

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------- Detail ---------- */
function detailView(id,refresh){
  const h=byId(id); if(!h) return;
  detailId=id;
  const lbl=D.tageLabels(14);
  const dots=h.letzte14.map((s,i)=>`<i class="dot ${s} ${i===13?'today':''}"></i>`).join('');
  const letters=lbl.map((l,i)=>`<small class="${i===13?'t':''}">${l[0]}</small>`).join('');
  const passed=h.fill>=h.mark;
  const sub=`${D.phaseName[h.phase]} · ${h.rhythmus}`;
  const html=`<div class="sh-head"><div><h2>${esc(h.name)}</h2><p>${esc(sub)}</p></div><button class="ibtn" data-act="close-a" aria-label="Schließen">${ic('x',22)}</button></div>
    <div class="bar">${pfadHtml(h,true)}
      <div class="bar-l"><span style="left:0">Start</span><span style="left:${h.mark*100}%;transform:translateX(-50%);${passed?'color:var(--accent-ink);font-weight:700':''}">Stabil</span><span style="right:0">Archiv-reif</span></div></div>
    <p class="satz-big">${esc(h.satz)}</p>
    <div class="figs"><div class="fig"><b class="num">${h.quote?h.quote+' %':'–'}</b><span>Quote</span></div>
      <div class="fig"><b class="num">${h.serie}</b><span>${h.serieEinheit} am Stück</span></div></div>
    <div class="lbl" style="margin-top:0">Letzte 14 Tage</div>
    <div class="days">${dots}${letters}</div>
    ${h.notiz?`<p class="note">${esc(h.notiz)}</p>`:''}
    ${h.faelligHeute?'':`<div class="today-row"><span>Heute trotzdem eintragen</span>${tileHtml(h.heute,'big',h.id)}</div>`}
    <div style="margin-top:20px"><button class="btn" data-act="edit" data-id="${h.id}">Bearbeiten</button></div>`;
  if(refresh) sheetA.fill(html); else sheetA.open(html,'detail');
}
function editView(id){
  const h=id?byId(id):null, nb=D.nachPhase().build.length;
  const tooMany=!h && nb>D.regel.neuAb;
  const html=`<div class="sh-head"><div><h2>${h?'Bearbeiten':'Neue Gewohnheit'}</h2><p>${h?esc(h.name):'Klein anfangen. Zwei Minuten reichen.'}</p></div><button class="ibtn" data-act="close-a" aria-label="Schließen">${ic('x',22)}</button></div>
    ${tooMany?`<div class="warn">Gerade ${nb} im Aufbau. Deine Regel: eine neue erst bei höchstens ${D.regel.neuAb}. Parke sie lieber als Idee.</div>`:''}
    <label class="field"><span>Name</span><input id="fName" value="${esc(h?h.name:'')}" placeholder="z. B. Direkt nach dem Essen abspülen"></label>
    <div class="field"><span>Rhythmus</span><div class="seg"><button class="on" data-act="seg">Jeden Tag</button><button data-act="seg">Mehrmals pro Woche</button></div></div>
    <label class="field"><span>Ich bin jemand, der …</span><textarea id="fNote" rows="2" placeholder="Ich erledige Dinge direkt.">${esc(h?h.notiz:'')}</textarea></label>
    ${h?`<button class="btn pri" data-act="save" data-id="${h.id}">Speichern</button>`
       :(tooMany?`<button class="btn pri" data-act="park">Als Idee parken</button><button class="btn" data-act="create">Trotzdem anlegen</button>`
               :`<button class="btn pri" data-act="create">Anlegen</button>`)}`;
  sheetA.open(html,'edit');
}
function infoView(){
  sheetA.open(`<div class="sh-head"><div><h2>Ein Bildschirm</h2><p>Layout-Prototyp</p></div><button class="ibtn" data-act="close-a" aria-label="Schließen">${ic('x',22)}</button></div>
    <p style="font-size:16px">Es gibt keine Tab-Leiste. Der ganze Tag passiert auf einer Seite: oben, was offen ist, darunter dein Stand. Alles Seltene liegt hinter einem einzigen Menü.</p>
    <div class="info-k"><b>Stärke</b><p>Du siehst beim Öffnen sofort, was noch offen ist, und bist fertig, ohne zu navigieren.</p></div>
    <div class="info-k"><b>Preis</b><p>Stand und Seltenes sind weiter weg, und die Seite wird mit mehr Gewohnheiten länger.</p></div>`,'info');
}

/* ---------- Auswahl (Erledigt / Entschuldigt / Nicht / Zurücksetzen) ---------- */
function choiceView(id){
  const h=byId(id); if(!h) return;
  const cur=h.heute;
  const opt=(st,label,extra)=>`<button class="opt" data-act="set" data-id="${id}" data-st="${st}" ${extra||''}>${st?`<span class="tile ${st}">${ic(markIc[st],18)}</span>`:`<span class="tile" style="color:var(--muted)">${D.svg('<path d="M4 12a8 8 0 1 1 3 6.2"/><path d="M4 5v7h7"/>',18)}</span>`}${label}${cur===st&&st?'<small>aktuell</small>':''}</button>`;
  sheetB.open(`<div style="margin:2px 4px 8px"><div style="font-size:13px;color:var(--muted)">Heute</div><div style="font-size:18px;font-weight:700">${esc(h.name)}</div></div>
    ${opt('g','Erledigt')}${opt('o','Entschuldigt')}${opt('r','Nicht')}${opt('', 'Zurücksetzen', cur?'':'disabled')}`,'choice');
}

/* ---------- Menü und Seiten ---------- */
const menuItems=[
  ['ideen','bulb','Ideen',()=>`${D.ideen.length} geparkt`],
  ['archiv','archive','Archiv',()=>`${D.archiv.length} geschafft`],
  ['rueckblick','chart','Rückblick','Letzte 14 Tage'],
  ['wissen','book','Wissen','Kernideen und Hilfe'],
  ['einstellungen','gear','Einstellungen','Erinnerung, Sicherung, Darstellung']
];
function openMenu(){
  $('#menu').innerHTML=`<div class="ph"><span></span><button class="ibtn" data-act="close-menu" aria-label="Menü schließen">${ic('x',24)}</button></div>
    <div class="pbody"><h1>Menü</h1>`+menuItems.map(m=>`<button class="mrow" data-page="${m[0]}"><span class="ic">${ic(m[1],22)}</span><span class="tx"><b>${m[2]}</b><span>${typeof m[3]==='function'?m[3]():m[3]}</span></span>${ic('chev',18)}</button>`).join('')+`</div>`;
  $('#menu').classList.add('on'); document.body.classList.add('lock');
}
function closeMenu(){ $('#menu').classList.remove('on'); if(!$('#page').classList.contains('on')) document.body.classList.remove('lock'); }

let pageName='', pageFromMenu=false;
const prioName={hoch:'Hoch',mittel:'Mittel',irgendwann:'Irgendwann'};
const pages={
  ideen(){
    const nb=D.nachPhase().build.length, ok=nb<=D.regel.neuAb;
    let h=`<h1>Ideen</h1><div class="status"><b>${ok?'Platz für eine neue':'Noch nicht starten'}</b>${nb} im Aufbau. ${ok?'Wähle die oberste Idee.':`Eine neue erst, wenn es höchstens ${D.regel.neuAb} sind.`}</div>
      <div class="addidea"><input id="ideaIn" placeholder="Neue Idee parken …" enterkeyhint="done"><button data-act="add-idee">Parken</button></div>`;
    ['hoch','mittel','irgendwann'].forEach(p=>{
      const l=D.ideen.filter(i=>i.prio===p); if(!l.length) return;
      h+=`<div class="slbl">${prioName[p]}</div><div class="card">${l.map(i=>`<div class="item"><b>${esc(i.text)}</b>${i.notiz?`<span>${esc(i.notiz)}</span>`:''}</div>`).join('')}</div>`;
    });
    return h;
  },
  archiv(){
    let h=`<h1>Archiv</h1><p class="lead">Gewohnheiten, die von allein laufen. Du kannst sie jederzeit zurückholen.</p>`;
    h+=D.archiv.map(a=>`<div class="rb" style="padding:16px"><div class="rb-h"><b style="font-size:17px">${esc(a.name)}</b></div>
      <p class="muted num" style="font-size:14px">${a.tageDabei} Tage dabei · Quote ${a.quote} %</p>
      ${a.notiz?`<p class="note">${esc(a.notiz)}</p>`:''}
      <div class="lbl">Ablauf</div><ol class="steps">${a.ablauf.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
      <div style="margin-top:12px"><button class="btn" data-act="toast" data-msg="Im Prototyp nur angedeutet.">Zurückholen</button></div></div>`).join('');
    return h;
  },
  rueckblick(){
    const lbl=D.tageLabels(14); let c={g:0,o:0,r:0};
    D.habits.forEach(h=>h.letzte14.forEach(s=>{ if(s) c[s]++; }));
    let h=`<h1>Rückblick</h1><div class="sums num"><span><i class="dot g"></i>${c.g} erledigt</span><span><i class="dot o"></i>${c.o} entschuldigt</span><span><i class="dot r"></i>${c.r} nicht</span></div>
      <div class="rbhead">${lbl.map((l,i)=>`<span class="${i===13?'t':''}">${l[0]}</span>`).join('')}</div>`;
    h+=D.habits.map(x=>`<div class="rb"><div class="rb-h"><button data-open="${x.id}">${esc(x.name)}</button><span class="num">${x.quote} %</span></div><div class="days">${x.letzte14.map(s=>`<i class="dot ${s}"></i>`).join('')}</div></div>`).join('');
    return h;
  },
  wissen(){
    const cards=[
      ['Es hakt – was tun?',`<p>Geh die Fragen der Reihe nach durch:</p><ul><li><b>Zu groß?</b> Mach sie kleiner: nur der erste Handgriff, zwei Minuten.</li><li><b>Nicht sichtbar?</b> Leg den Auslöser dorthin, wo du ohnehin bist.</li><li><b>Zu mühsam?</b> Räum die Reibung weg, bevor du anfängst.</li><li><b>Zu viele auf einmal?</b> Pausiere die schwächste.</li></ul>`],
      ['Nie zweimal auslassen',`<p>Ein Aussetzer ist normal. Erst der zweite in Folge macht aus Ausnahme eine neue Gewohnheit.</p><p>Hast du einen Tag verpasst, mach am nächsten Tag wenigstens die kleinste Version.</p>`],
      ['Die Regeln dieser App',`<ul><li>Höchstens etwa 3 Gewohnheiten gleichzeitig im Aufbau.</li><li>Eine neue erst, wenn höchstens 2 im Aufbau sind.</li><li><b>Stabil:</b> sie sitzt, es ist Platz für eine neue.</li><li><b>Archiv-reif:</b> sie läuft von allein.</li><li><b>Entschuldigt</b> zählt nicht als Aussetzer.</li></ul>`],
      ['1 % besser, jeden Tag',`<p>Kleine Schritte wirken über Wochen stärker als ein großer Anlauf. Jeder Haken ist eine Stimme dafür, wer du sein willst.</p>`]
    ];
    return `<h1>Wissen</h1><p class="lead">Kurz und zum Nachschlagen.</p>`+cards.map((c,i)=>`<div class="wcard ${i===0?'open':''}"><button data-act="wcard">${c[0]}${ic('chev',18)}</button><div class="wb">${c[1]}</div></div>`).join('');
  },
  einstellungen(){
    return `<h1>Einstellungen</h1>
      <div class="slbl" style="margin-top:0">Erinnerung</div>
      <div class="card"><div class="srow2"><div class="tx"><b>Tägliche Erinnerung</b><span>Eine Mitteilung am Abend</span></div><button class="sw on" data-act="sw" aria-label="Erinnerung"></button></div>
        <button class="srow2" data-act="toast" data-msg="Im Prototyp nur angedeutet."><div class="tx"><b>Uhrzeit</b></div><span class="val num">21:00</span>${ic('chev',16)}</button></div>
      <div class="slbl">Sicherung</div>
      <div class="card"><div class="srow2"><div class="tx"><b>Letzte Sicherung</b><span>Automatisch, im Hintergrund</span></div><span class="val">heute, 08:14</span></div>
        <button class="srow2" data-act="toast" data-msg="Gesichert."><div class="tx"><b>Jetzt sichern</b></div>${ic('chev',16)}</button>
        <button class="srow2" data-act="toast" data-msg="Im Prototyp nur angedeutet."><div class="tx"><b>Wiederherstellungscode</b><span>Auf einem neuen Gerät einlösen</span></div>${ic('chev',16)}</button></div>
      <div class="slbl">Darstellung</div>
      <div class="seg"><button class="on" data-act="seg">System</button><button data-act="toast" data-msg="Im Prototyp folgt die Darstellung deinem Gerät.">Hell</button><button data-act="toast" data-msg="Im Prototyp folgt die Darstellung deinem Gerät.">Dunkel</button></div>`;
  }
};
function openPage(name,fromMenu){
  pageName=name; pageFromMenu=fromMenu;
  const back=fromMenu?'Menü':'Heute';
  $('#page').innerHTML=`<div class="ph"><button class="back" data-act="back">${ic('back',22)}${back}</button></div><div class="pbody" id="pbody">${pages[name]()}</div>`;
  $('#page').classList.add('on'); document.body.classList.add('lock');
  if(!fromMenu) closeMenu();
}
function rerenderPage(){ if($('#page').classList.contains('on')){ const b=$('#pbody'),y=b.scrollTop; b.innerHTML=pages[pageName](); b.scrollTop=y; } }
function closePage(){
  $('#page').classList.remove('on');
  if(!pageFromMenu || !$('#menu').classList.contains('on')) document.body.classList.remove('lock');
}

/* ---------- Abhaken ---------- */
function tileTap(id,el){
  const h=byId(id); if(!h) return;
  if(h.heute){ choiceView(id); return; }
  D.setHeute(id,'g');
  renderHead();
  const row=el.closest('.row');
  if(row){
    el.className='tile big g'; el.innerHTML=ic('check',28);
    row.classList.add('leave');
    clearTimeout(pending); pending=setTimeout(()=>{ renderAll(); },420);
  }else renderAll();
  if(navigator.vibrate) try{navigator.vibrate(8)}catch(e){}
}
function setState(id,st){
  D.setHeute(id,st);
  sheetB.close(); renderAll();
  if(!$('#page').classList.contains('on')) return; rerenderPage();
}

/* Langer Druck */
let lp=null, lpFired=false, lpX=0, lpY=0;
document.addEventListener('pointerdown',e=>{
  lpFired=false;
  const b=e.target.closest('[data-tile]'); if(!b) return;
  lpX=e.clientX; lpY=e.clientY; clearTimeout(lp);
  lp=setTimeout(()=>{ lpFired=true; if(navigator.vibrate) try{navigator.vibrate(15)}catch(_){}; choiceView(b.dataset.tile); },480);
});
document.addEventListener('pointermove',e=>{ if(lp && Math.hypot(e.clientX-lpX,e.clientY-lpY)>10){ clearTimeout(lp); lp=null; } });
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{ clearTimeout(lp); lp=null; }));
document.addEventListener('contextmenu',e=>{ if(e.target.closest('[data-tile]')) e.preventDefault(); });

/* ---------- Klicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tile]');
  if(t){ if(lpFired){ lpFired=false; return; } tileTap(t.dataset.tile,t); return; }
  const op=e.target.closest('[data-open]'); if(op){ detailView(op.dataset.open); return; }
  const pg=e.target.closest('[data-page]'); if(pg){ openPage(pg.dataset.page,!!pg.closest('#menu')); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  switch(act){
    case 'done': doneOpen=!doneOpen; renderHeute(); break;
    case 'close-a': sheetA.close(); break;
    case 'close-menu': closeMenu(); break;
    case 'back': closePage(); break;
    case 'edit': editView(id); break;
    case 'set': setState(id,a.dataset.st); break;
    case 'save': { const h=byId(id); const n=$('#fName').value.trim(); if(n) h.name=n; h.notiz=$('#fNote').value.trim(); sheetA.close(); renderAll(); toast('Gespeichert.'); break; }
    case 'create': {
      const n=$('#fName').value.trim(); if(!n){ $('#fName').focus(); break; }
      D.habits.push({id:'n'+Date.now(),name:n,icon:I.wand,rhythmus:'Jeden Tag',faelligHeute:true,gruppe:null,notiz:$('#fNote').value.trim(),alter:0,phase:'build',fill:0,mark:.35,satz:'Stabil in 21 Tagen',quote:0,serie:0,serieEinheit:'Tage',heute:'',letzte14:Array(14).fill('')});
      sheetA.close(); renderAll(); toast('Angelegt.'); break; }
    case 'park': { const n=$('#fName').value.trim(); if(!n){ $('#fName').focus(); break; } D.ideen.push({text:n,notiz:'',prio:'mittel'}); sheetA.close(); toast('Als Idee geparkt.'); break; }
    case 'seg': a.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===a)); break;
    case 'add-idee': { const i=$('#ideaIn'); const v=i.value.trim(); if(!v){ i.focus(); break; } D.ideen.push({text:v,notiz:'',prio:'mittel'}); rerenderPage(); toast('Geparkt.'); break; }
    case 'wcard': a.parentNode.classList.toggle('open'); break;
    case 'sw': a.classList.toggle('on'); break;
    case 'toast': toast(a.dataset.msg); break;
  }
});

/* ---------- Start ---------- */
$('#btnInfo').innerHTML=ic('info',22);
$('#btnMenu').innerHTML=ic('menu',24);
$('#btnNew').innerHTML=ic('plus',18)+'Neue Gewohnheit';
$('#btnInfo').addEventListener('click',infoView);
$('#btnMenu').addEventListener('click',openMenu);
$('#btnNew').addEventListener('click',()=>editView(null));
renderAll();
})();
</script>
</body>
</html>
