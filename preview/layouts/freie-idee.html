<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cadence – Ausblick</title>
<link rel="stylesheet" href="base.css">
<style>
/* Konzept „Ausblick": unten liegt, was heute noch offen ist; darüber wächst, was kommt. */
html,body{overflow:hidden}
.lab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ic{flex-shrink:0;display:grid;place-items:center}

/* ---------- Heute ---------- */
#home{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-top)}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 0 20px;flex-shrink:0}
.top .date{font-size:14px;color:var(--muted)}
.tools{display:flex}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.ib.quiet{color:var(--faint)}
.ib:active{background:var(--surface-2)}
#h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.02em;padding:0 20px;flex-shrink:0}
#h1.pop{animation:pop .36s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Der Tag als Leiste: ein Feld je Gewohnheit, füllt sich mit dem Zustand */
.strip{display:flex;gap:3px;padding:14px 20px 0;flex-shrink:0}
.cell{flex:1 1 0;min-width:0;height:44px;border-radius:6px;display:grid;place-items:center;position:relative;
  background:var(--surface-3);color:var(--faint);transition:background .22s,color .22s}
.cell:first-child{border-radius:12px 6px 6px 12px}
.cell:last-child{border-radius:6px 12px 12px 6px}
.cell.g{background:var(--g)} .cell.o{background:var(--o)} .cell.r{background:var(--r)}
.cell.g,.cell.o,.cell.r{color:var(--on-state);box-shadow:none}
.cell:active{transform:scale(.95)}
.cell .bdg{position:absolute;right:3px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--on-state);display:grid;place-items:center}
.cell.o .bdg{color:var(--o)} .cell.r .bdg{color:var(--r)}
.cell .bdg svg{stroke-width:3.4}

.sec{padding:20px 20px 0;flex-shrink:0}
.lead{flex-shrink:0;margin:8px 12px 0;padding:11px 8px 11px 14px;border-radius:var(--radius);background:var(--accent-soft);
  display:flex;align-items:center;gap:8px;text-align:left;min-height:60px}
.lead .tx{flex:1;min-width:0}
.lead b{display:block;font-size:16px;font-weight:650;color:var(--accent-ink);line-height:1.25}
.lead .s{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead>svg{color:var(--accent-ink);flex-shrink:0}

.stream{flex:1 1 0;min-height:0;overflow-y:auto;padding:0 20px;margin-top:6px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent)}
.stream,.open,.pbody,.sheet{scrollbar-width:none}
.stream::-webkit-scrollbar,.open::-webkit-scrollbar,.pbody::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.stream{container-type:size}
@container (max-height:58px){.grp{visibility:hidden}} /* kein angeschnittener Rest, wenn alles noch offen ist */
.stream::after{content:"";display:block;height:30px}
.closed .stream::after{height:calc(var(--safe-bottom) + 30px)}
.grp{display:grid;grid-template-columns:90px 1fr;column-gap:8px;border-top:1px solid var(--line);padding:3px 0}
.grp:first-child{border-top:0}
.when{padding-top:10px}
.when b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.when span{display:block;font-size:12.5px;color:var(--muted)}
.ev{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;min-height:44px}
.ev .ic{color:var(--muted);margin-top:1px}
.ev .tx{flex:1;min-width:0}
.ev .tx b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.ev .tx span{display:block;font-size:13px;color:var(--muted)}
.ev .tx .then{color:var(--accent-ink);font-weight:600}

/* Offen: am Daumen, von unten verankert */
.open{flex:0 1 auto;min-height:0;padding:0 12px calc(var(--safe-bottom) + 2px);overflow-y:auto}
.open:empty{padding:0}
.row{display:flex;align-items:center;gap:12px;width:100%;height:56px;padding:0 6px 0 14px;margin-top:6px;background:var(--surface);flex-shrink:0;
  border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);text-align:left;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:background .45s}
.row .ic{color:var(--muted)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.hold{background:var(--surface-3)}
.row.opt{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.row.opt .nm b{font-size:16px;line-height:1.25}
.row.leaving{height:0;margin-top:0;opacity:0;transition:height .26s ease,margin-top .26s ease,opacity .2s ease}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:36px;font-size:12.5px;color:var(--muted);text-align:center}
button.hint{min-height:44px}
.hint b{color:var(--accent-ink);font-weight:650;text-decoration:underline;text-underline-offset:3px}
@media (max-height:720px){
  .row{height:52px}.row.opt .nm span{display:none}
  #h1{font-size:28px}.strip{padding-top:10px}.sec{display:none}.lead{margin-top:12px}
}

/* ---------- Seiten (selten gebraucht) ---------- */
.page{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--safe-top);
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s,visibility 0s .18s}
.page.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .18s}
.phead{display:flex;align-items:center;gap:2px;padding:6px 8px 4px;flex-shrink:0}
.phead h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.pbody{flex:1;min-height:0;overflow-y:auto;padding:6px 16px calc(var(--safe-bottom) + 28px);-webkit-overflow-scrolling:touch}
.pbody .lab{margin:22px 4px 8px}
.pbody .lab:first-child{margin-top:8px}
.note{font-size:14px;color:var(--muted);margin:0 4px 10px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.card.pad{padding:14px}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 10px 12px 14px;min-height:60px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .ic{color:var(--muted)}
.hrow .tx{flex:1;min-width:0}
.hrow .tx b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.hrow .tx .s{display:block;font-size:13px;color:var(--muted)}
.hrow .tx .pfad{display:block;margin:8px 4px 7px 0}
.hrow>svg{color:var(--faint);flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:var(--radius);
  background:var(--accent);color:var(--on-accent);font-weight:650;font-size:16px;margin-top:16px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn:active{opacity:.85}
.link{display:block;width:100%;min-height:44px;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.box{background:var(--accent-soft);border-radius:var(--radius);padding:12px 14px;font-size:14px;color:var(--ink-soft)}
.box b{display:block;font-size:16px;color:var(--accent-ink);font-weight:650;margin-bottom:2px}
.addrow{display:flex;gap:8px;margin-top:12px}
.inp{flex:1;min-width:0;height:48px;border-radius:var(--radius-sm);border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line-2);
  padding:0 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;width:100%}
.inp:focus{box-shadow:0 0 0 2px var(--accent)}
.inp::placeholder{color:var(--faint)}
.sq{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex-shrink:0}

/* Rückblick */
.g14{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;border-top:1px solid var(--line)}
.g14.head{min-height:22px;border-top:0}
.g14 .nm{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g14 .dots{display:grid;grid-template-columns:repeat(14,9px);gap:3px;flex-shrink:0}
.g14 .dots .dot{width:9px;height:9px}
.g14.head .dots span{font-size:9px;color:var(--faint);text-align:center;line-height:1}
.g14.head .dots span.t{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 0;gap:2px}
.stack i{display:block;height:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.cal span{aspect-ratio:1;max-height:40px;display:grid;place-items:center;font-size:13px;border-radius:9px;color:var(--faint);position:relative}
.cal .wd{aspect-ratio:auto;height:18px;font-size:11px}
.cal .ok{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.cal .miss::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--r)}
.cal .now{box-shadow:inset 0 0 0 2px var(--accent);color:var(--ink);font-weight:700}

/* Wissen, Einstellungen */
details{border-top:1px solid var(--line)}
details:first-child{border-top:0}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 12px 0 14px;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary svg{color:var(--faint);transition:transform .2s;flex-shrink:0}
details[open] summary svg{transform:rotate(90deg)}
details p{padding:0 14px 14px;font-size:15px;color:var(--ink-soft)}
.set{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:60px;padding:10px 14px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set .tx{flex:1;min-width:0}
.set .tx b{display:block;font-size:16px;font-weight:600}
.set .tx span{display:block;font-size:13px;color:var(--muted)}
.set .val{font-size:15px;color:var(--muted);flex-shrink:0}
.sw{width:50px;height:30px;border-radius:15px;background:var(--surface-3);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.set[aria-checked="true"] .sw{background:var(--accent)}
.set[aria-checked="true"] .sw::after{transform:translateX(20px)}

/* ---------- Blatt von unten ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:90dvh;overflow-y:auto;
  padding:10px 20px calc(var(--safe-bottom) + 20px);transform:translateY(102%);visibility:hidden;transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
.sheet.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--surface-3);margin:0 auto 10px}
.shead{display:flex;align-items:center;gap:12px}
.shead .ic{width:44px;height:44px;border-radius:12px;background:var(--surface-2);color:var(--ink-soft)}
.shead .tx{flex:1;min-width:0}
.shead h2{font-size:19px;font-weight:700;line-height:1.25}
.shead p{font-size:13.5px;color:var(--muted)}
.shead .ib{margin-right:-10px;flex-shrink:0}
.sheet .lab{margin:22px 0 8px}
.states{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{min-height:64px;border-radius:var(--radius);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:14px;font-weight:600}
.st svg{stroke-width:2.6}
.st.g svg{color:var(--g)} .st.o svg{color:var(--o)} .st.r svg{color:var(--r)}
.st.sel{color:var(--on-state)} .st.sel svg{color:var(--on-state)}
.st.g.sel{background:var(--g)} .st.o.sel{background:var(--o)} .st.r.sel{background:var(--r)}
.st:active{transform:scale(.97)}
.satz{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.vor{font-size:14px;color:var(--muted);margin-top:2px}
.pw{margin:16px 6px 0 6px}
.pl{position:relative;height:18px;margin-top:8px;font-size:12px;color:var(--muted)}
.pl span{position:absolute;top:0;white-space:nowrap}
.pl span:last-child{right:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.facts div{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px}
.facts b{display:block;font-size:18px;font-weight:700}
.facts span{font-size:13px;color:var(--muted)}
.d14{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.d14 span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--faint)}
.d14 .dot{width:100%;max-width:16px;height:auto;aspect-ratio:1;border-radius:4px}
.notiz{margin-top:18px;font-size:15px;color:var(--ink-soft);font-style:italic}
.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;text-align:left;font-size:16px;font-weight:600;border-top:1px solid var(--line)}
.mi:first-of-type{border-top:0}
.mi .ic{color:var(--muted)}
.mi span.tx{flex:1}
.mi small{font-size:13px;font-weight:400;color:var(--muted)}
.mi>svg{color:var(--faint)}
.info h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.info .kicker{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.info p{font-size:15.5px;color:var(--ink-soft);margin-top:10px}
.info dl{margin:16px 0 0}
.info dt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.info dd{margin:3px 0 0;font-size:15.5px;color:var(--ink)}
.fld{display:block;margin-top:14px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin:0 2px 6px}
.sheet .inp{background:var(--surface-2);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface-2);font-size:15px;font-weight:600}
.chip.sel{background:var(--accent);color:var(--on-accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-bottom) + 24px);z-index:60;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:22px;transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<main id="home">
  <header class="top">
    <div class="date" id="date"></div>
    <div class="tools">
      <button class="ib quiet" id="bInfo" aria-label="Über dieses Konzept"></button>
      <button class="ib" id="bMehr" aria-label="Mehr"></button>
    </div>
  </header>
  <h1 id="h1"></h1>
  <div class="strip" id="strip" aria-label="Dein Tag"></div>
  <div class="sec"><div class="lab">Was kommt</div></div>
  <button class="lead" id="lead"></button>
  <div class="stream" id="stream"></div>
  <div class="open" id="open"></div>
</main>

<section class="page" id="page" aria-hidden="true">
  <header class="phead"><button class="ib" id="pBack" aria-label="Zurück"></button><h2 id="pTitle"></h2></header>
  <div class="pbody" id="pBody"></div>
</section>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script src="demo.js"></script>
<script>
(function(){
  const D=DEMO, I=D.icons, svg=D.svg, $=s=>document.querySelector(s);
  const GLYPH={g:I.check,o:I.dash,r:I.x};
  const BASE=new Date(2026,9,12);
  const WD=['So','Mo','Di','Mi','Do','Fr','Sa'], MO=['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
  const PRIO=[['hoch','Hoch'],['mittel','Mittel'],['irgendwann','Irgendwann']];
  const H=id=>D.habits.find(h=>h.id===id);
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const el={h1:$('#h1'),strip:$('#strip'),lead:$('#lead'),stream:$('#stream'),open:$('#open'),home:$('#home'),
    page:$('#page'),pTitle:$('#pTitle'),pBody:$('#pBody'),sheet:$('#sheet'),scrim:$('#scrim'),toast:$('#toast')};

  /* ---------- Prognose: aus „Stabil in 4 Tagen" wird ein Datum ---------- */
  function tageBis(h){const m=/in (\d+) Tag/.exec(h.satz);return m?(+m[1])+(h.heute==='r'?1:0):null;}
  function datum(n){const d=new Date(BASE);d.setDate(d.getDate()+n);return WD[d.getDay()]+', '+d.getDate()+'. '+MO[d.getMonth()];}
  function inTagen(n){return n<=0?'heute':n===1?'morgen':'in '+n+' Tagen';}
  const gross=s=>s.charAt(0).toUpperCase()+s.slice(1);
  function satz(h){const n=tageBis(h);if(n==null)return h.satz;
    return (h.phase==='build'?'Stabil ':'Archiv-reif ')+inTagen(n)+(/ohne Lücke/.test(h.satz)?' ohne Lücke':'');}
  // Wann ist Platz für eine neue? Sobald höchstens regel.neuAb im Aufbau sind.
  function platz(){
    const b=D.habits.filter(h=>h.phase==='build').sort((a,c)=>tageBis(a)-tageBis(c));
    const fehlt=b.length-D.regel.neuAb;
    if(fehlt<=0)return {n:0,nach:null,jetzt:b.length};
    return {n:tageBis(b[fehlt-1]),nach:b[fehlt-1].id,jetzt:b.length};
  }
  function ideenSortiert(){return PRIO.flatMap(p=>D.ideen.filter(i=>i.prio===p[0]));}
  function wocheText(h){const p=(h.wocheStand||'0/0').split('/');return (+p[0]+(h.heute==='g'?1:0))+' von '+p[1];}

  /* ---------- Heute ---------- */
  let undo=null, undoT=null, busy=false;

  function renderHead(pop){
    const due=D.faellig(), offen=due.filter(h=>!h.heute), opt=D.habits.filter(h=>!h.faelligHeute);
    const titel=offen.length?('Noch '+offen.length+' offen'):(due.some(h=>h.heute==='r')?'Tag abgeschlossen':'Tag geschafft');
    if(el.h1.textContent!==titel){el.h1.textContent=titel;
      if(pop&&!offen.length){el.h1.classList.remove('pop');void el.h1.offsetWidth;el.h1.classList.add('pop');}}
    el.home.classList.toggle('closed',!offen.length);

    el.strip.innerHTML=due.concat(opt.filter(h=>h.heute)).map(h=>
      `<button class="cell ${h.heute}" data-habit="${h.id}" aria-label="${esc(h.name)}: ${D.zustandName[h.heute]}">${svg(h.icon,20)}${
        h.heute==='o'||h.heute==='r'?`<i class="bdg">${svg(GLYPH[h.heute],9)}</i>`:''}</button>`).join('');

    const p=platz(), top=ideenSortiert()[0];
    el.lead.innerHTML=`<span class="tx"><b>${p.n>0?'Platz für eine neue '+inTagen(p.n):'Jetzt ist Platz für eine neue'}</b>
      <span class="s">${p.n>0?'ab '+datum(p.n)+(top?' · dann: '+esc(top.text):''):(top?'Oben auf deiner Liste: '+esc(top.text):'Noch keine Idee geparkt')}</span></span>${svg(I.chev,18)}`;

    const ev=D.habits.map(h=>({h,n:tageBis(h)})).filter(e=>e.n!=null).sort((a,b)=>a.n-b.n), grp=[];
    ev.forEach(e=>{const g=grp[grp.length-1];if(g&&g.n===e.n)g.items.push(e);else grp.push({n:e.n,items:[e]});});
    const y=el.stream.scrollTop;
    el.stream.innerHTML=grp.map(g=>`<div class="grp"><div class="when"><b>${gross(inTagen(g.n))}</b><span>${datum(g.n)}</span></div><div>${
      g.items.map(e=>`<button class="ev" data-habit="${e.h.id}"><span class="ic">${svg(e.h.icon,18)}</span><span class="tx"><b>${esc(e.h.name)}</b>
        <span>${e.h.phase==='build'?'wird stabil':'wird archiv-reif'}${e.h.heute==='r'?' · um einen Tag verschoben':''}</span>${
        p.nach===e.h.id?'<span class="then">Danach ist Platz für eine neue.</span>':''}</span></button>`).join('')}</div></div>`).join('')
      +`<div class="grp"><div class="when"><b>Irgendwann</b></div><div><button class="ev" data-go="ideen"><span class="ic">${svg(I.bulb,18)}</span>
        <span class="tx"><b>${D.ideen.length} Ideen geparkt</b><span>${top?'Ganz oben: '+esc(top.text):'Noch leer'}</span></span></button></div></div>`;
    el.stream.scrollTop=y;
  }

  function rowHTML(h,opt){
    return `<button class="row${opt?' opt':''}" data-row="${h.id}"><span class="ic">${svg(h.icon,22)}</span>
      <span class="nm"><b>${esc(h.name)}</b>${opt?`<span>Freiwillig heute · diese Woche ${wocheText(h)}</span>`:''}</span><span class="tile"></span></button>`;
  }
  function renderOpen(){
    const offen=D.faellig().filter(h=>!h.heute), opt=D.habits.filter(h=>!h.faelligHeute&&!h.heute);
    let html=opt.map(h=>rowHTML(h,true)).join('')+offen.map(h=>rowHTML(h)).join('');
    if(undo) html+=`<button class="hint" data-undo>„${esc(H(undo.id).name)}" erledigt · <b>Rückgängig</b></button>`;
    else if(offen.length||opt.length) html+=`<div class="hint">Tippen: erledigt · Halten: entschuldigt oder nicht</div>`;
    el.open.innerHTML=html;
    el.open.scrollTop=el.open.scrollHeight; // falls es eng wird: das Unterste bleibt am Daumen
  }
  function renderHome(pop){renderHead(pop);renderOpen();}

  function erledige(row,id){
    if(busy)return; busy=true;
    const h=H(id), prev=h.heute;
    D.setHeute(id,'g');
    const t=row.querySelector('.tile'); t.classList.add('g'); t.innerHTML=svg(I.check,22);
    renderHead(true);
    row.style.height=row.offsetHeight+'px';
    setTimeout(()=>row.classList.add('leaving'),150);
    setTimeout(()=>{busy=false; undo={id,prev}; clearTimeout(undoT);
      undoT=setTimeout(()=>{undo=null;renderOpen();},5000); renderOpen();},430);
  }

  // Tippen = erledigt, Halten = Blatt mit allen Zuständen
  let pressT=null, pressed=false, sx=0, sy=0;
  const endPress=()=>{clearTimeout(pressT);el.open.querySelectorAll('.hold').forEach(x=>x.classList.remove('hold'));setTimeout(()=>{pressed=false;},80);};
  el.open.addEventListener('pointerdown',e=>{const r=e.target.closest('.row');if(!r||busy)return;
    sx=e.clientX;sy=e.clientY;clearTimeout(pressT);r.classList.add('hold');
    pressT=setTimeout(()=>{pressed=true;r.classList.remove('hold');habitSheet(r.dataset.row);},480);});
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.open.addEventListener(n,endPress));
  el.open.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10){clearTimeout(pressT);
    el.open.querySelectorAll('.hold').forEach(x=>x.classList.remove('hold'));}});
  el.open.addEventListener('contextmenu',e=>{const r=e.target.closest('.row');if(!r)return;e.preventDefault();clearTimeout(pressT);
    r.classList.remove('hold');habitSheet(r.dataset.row);});
  el.open.addEventListener('click',e=>{
    if(e.target.closest('[data-undo]')){if(undo){D.setHeute(undo.id,undo.prev);undo=null;clearTimeout(undoT);renderHome();}return;}
    const r=e.target.closest('.row');if(!r)return;
    if(pressed){pressed=false;return;}
    erledige(r,r.dataset.row);
  });

  /* ---------- Blatt ---------- */
  let cur=null;
  function sheet(html){el.sheet.innerHTML='<div class="grab"></div>'+html;el.sheet.scrollTop=0;el.sheet.classList.add('on');el.scrim.classList.add('on');}
  function closeSheet(){el.sheet.classList.remove('on');el.scrim.classList.remove('on');cur=null;}
  const xBtn=`<button class="ib" data-close aria-label="Schließen">${svg(I.x,20)}</button>`;

  function pfad(h,big){return `<span class="pfad${big?' big':''}" style="display:block"><i style="width:${Math.round(h.fill*100)}%"></i><b class="${h.fill>=h.mark?'on':''}" style="left:${h.mark*100}%"></b><b class="end${h.fill>=1?' on':''}"></b></span>`;}

  function habitSheet(id){
    const h=H(id), n=tageBis(h), labs=D.tageLabels(14); cur=id;
    sheet(`<div class="shead"><span class="ic">${svg(h.icon,24)}</span><div class="tx"><h2>${esc(h.name)}</h2>
        <p>${h.rhythmus}${h.gruppe?' · '+esc(h.gruppe):''} · ${D.phaseName[h.phase]}</p></div>${xBtn}</div>
      <div class="lab">${h.faelligHeute?'Heute':'Heute · freiwillig, diese Woche '+wocheText(h)}</div>
      <div class="states">${['g','o','r'].map(s=>`<button class="st ${s}${h.heute===s?' sel':''}" data-set="${s}">${svg(GLYPH[s],22)}<span>${D.zustandName[s]}</span></button>`).join('')}</div>
      ${h.heute?'<button class="link" data-set="">Eintrag für heute zurücknehmen</button>':''}
      <div class="lab">Stand</div>
      <p class="satz">${satz(h)}</p>
      ${n!=null?`<p class="vor">voraussichtlich ${datum(n)}${h.heute==='r'?' · heute ausgelassen, um einen Tag verschoben':''}</p>`:''}
      <div class="pw">${pfad(h,true)}<div class="pl"><span>Start</span><span style="left:${h.mark*100}%;transform:translateX(-50%)">Stabil</span><span>Archiv-reif</span></div></div>
      <div class="facts"><div><b class="num">${h.quote} %</b><span>Quote</span></div><div><b class="num">${h.serie} ${h.serieEinheit}</b><span>am Stück</span></div></div>
      <div class="lab">Letzte 14 Tage</div>
      <div class="d14">${h.letzte14.map((s,i)=>`<span><i class="dot ${s}"></i>${labs[i][0]}</span>`).join('')}</div>
      ${h.notiz?`<p class="notiz">„${esc(h.notiz)}"</p>`:''}
      <button class="btn ghost" data-edit="${h.id}">Bearbeiten</button>`);
  }

  function menuSheet(){
    const p=D.nachPhase();
    const mi=(go,ic,t,s)=>`<button class="mi" data-go="${go}"><span class="ic">${svg(ic,22)}</span><span class="tx">${t}${s?`<br><small>${s}</small>`:''}</span>${svg(I.chev,18)}</button>`;
    sheet(`<div class="shead"><div class="tx"><h2>Mehr</h2></div>${xBtn}</div>
      <div style="margin-top:8px">
      ${mi('gewohnheiten',I.check,'Alle Gewohnheiten',p.build.length+' im Aufbau · '+p.stable.length+' stabil')}
      ${mi('ideen',I.bulb,'Ideen',D.ideen.length+' geparkt')}
      ${mi('rueckblick',I.chart,'Rückblick','Letzte 14 Tage und der Monat')}
      ${mi('archiv',I.archive,'Archiv',D.archiv.length+' geschafft')}
      ${mi('wissen',I.book,'Wissen','Kernideen · Es hakt – was tun?')}
      ${mi('einstellungen',I.gear,'Einstellungen','Erinnerung, Sicherung')}
      </div>
      <button class="btn" data-new>${svg(I.plus,20)} Neue Gewohnheit</button>`);
  }

  function infoSheet(){
    sheet(`<div class="info"><div class="shead"><div class="tx"><div class="kicker">Layout-Konzept</div><h2>Ausblick</h2></div>${xBtn}</div>
      <p>Die App schaut nach vorn statt zurück. Unten am Daumen liegt nur, was heute noch offen ist; jeder Haken räumt eine Zeile weg und gibt darüber mehr von dem frei, was kommt: wann eine Gewohnheit stabil wird und ab wann Platz für eine neue ist.</p>
      <dl><dt>Stärke</dt><dd>Deine zwei echten Fragen – was fehlt heute, wann darf die nächste dazu – beantwortet der erste Bildschirm ohne Tippen, mit einem Datum statt mit Zahlen zum Deuten.</dd>
      <dt>Preis</dt><dd>Die Daten sind Prognosen und rutschen nach hinten, wenn du einen Tag auslässt. Erledigtes erkennst du oben nur noch am Symbol, und Rückblick, Quote und Serie liegen einen Tipp tiefer als heute.</dd>
      <dt>Bedienung</dt><dd>Zeile tippen: erledigt. Zeile halten oder Feld in der Leiste oben tippen: Entschuldigt, Nicht und der Stand der Gewohnheit.</dd></dl></div>`);
  }

  function formSheet(titel,name,edit){
    const p=platz(), h=edit?H(edit):null;
    sheet(`<div class="shead"><div class="tx"><h2>${titel}</h2></div>${xBtn}</div>
      ${!edit&&p.n>0?`<div class="box" style="margin-top:12px"><b>Noch nicht ganz dran</b>Gerade sind ${p.jetzt} im Aufbau. Deine Regel: eine neue erst bei ${D.regel.neuAb} – voraussichtlich ${datum(p.n)}</div>`:''}
      <label class="fld"><span>Name</span><input class="inp" id="fName" value="${esc(name||'')}" placeholder="z. B. Nach dem Essen abspülen"></label>
      <div class="fld"><span>Rhythmus</span><div class="chips">${['Jeden Tag','Bestimmte Tage','Mehrmals pro Woche'].map((c,i)=>
        `<button class="chip${(h?(h.rhythmus==='Jeden Tag'?0:2):0)===i?' sel':''}" data-chip>${c}</button>`).join('')}</div></div>
      <label class="fld"><span>Winzige Version (höchstens zwei Minuten)</span><input class="inp" placeholder="z. B. Einen Teller abspülen"></label>
      <label class="fld"><span>Wer will ich damit sein?</span><input class="inp" value="${esc(h?h.notiz:'')}" placeholder="Ich bin jemand, der …"></label>
      ${edit?`<button class="btn" data-toast="Im Prototyp nur angedeutet">Speichern</button><button class="link" data-toast="Im Prototyp nur angedeutet" style="margin-top:6px">Ins Archiv verschieben</button>`
        :(p.n>0?`<button class="btn" data-park>Als Idee parken</button><button class="link" data-toast="Im Prototyp nur angedeutet" style="margin-top:6px">Trotzdem jetzt anlegen</button>`
               :`<button class="btn" data-toast="Im Prototyp nur angedeutet">Anlegen</button>`)}`);
  }

  function ideeSheet(i){
    const it=D.ideen[i], p=platz();
    sheet(`<div class="shead"><span class="ic">${svg(I.bulb,24)}</span><div class="tx"><h2>${esc(it.text)}</h2>${it.notiz?`<p>${esc(it.notiz)}</p>`:''}</div>${xBtn}</div>
      <div class="lab">Wichtigkeit</div>
      <div class="chips">${PRIO.map(q=>`<button class="chip${it.prio===q[0]?' sel':''}" data-prio="${q[0]}" data-i="${i}">${q[1]}</button>`).join('')}</div>
      <button class="btn" data-start="${i}">Als Gewohnheit starten</button>
      <p class="note" style="text-align:center;margin-top:10px">${p.n>0?'Deine Regel sagt: ab '+datum(p.n):'Es ist Platz – los geht’s.'}</p>`);
  }

  /* ---------- Seiten ---------- */
  const stack=[];
  const SEITEN={
    gewohnheiten:['Alle Gewohnheiten',()=>{
      const p=D.nachPhase();
      const sec=(k,a,note)=>a.length?`<div class="lab">${D.phaseName[k]} · ${a.length}</div>${note?`<p class="note">${note}</p>`:''}<div class="card">${
        a.map(h=>`<button class="hrow" data-habit="${h.id}"><span class="ic">${svg(h.icon,22)}</span><span class="tx"><b>${esc(h.name)}</b>${pfad(h)}<span class="s">${satz(h)}</span></span>${svg(I.chev,18)}</button>`).join('')}</div>`:'';
      return sec('build',p.build,`Deine Regel: höchstens ${D.regel.maxAufbau} gleichzeitig, eine neue erst bei ${D.regel.neuAb}.`)
        +sec('stable',p.stable,'Sie sitzen. Weiter abhaken, bis sie von allein laufen.')+sec('archive',p.archive)
        +`<button class="btn ghost" data-new>${svg(I.plus,20)} Neue Gewohnheit</button>`;
    }],
    ideen:['Ideen',()=>{
      const p=platz();
      return `<div class="box"><b>${p.n>0?'Platz für eine neue '+inTagen(p.n):'Jetzt ist Platz für eine neue'}</b>${
        p.n>0?`Gerade sind ${p.jetzt} im Aufbau, deine Regel sagt: eine neue erst bei ${D.regel.neuAb}. Das ist voraussichtlich ${datum(p.n)} Bis dahin hier parken.`
             :'Such dir eine aus und fang winzig an.'}</div>
        <div class="addrow"><input class="inp" id="iNeu" placeholder="Neue Idee für später …" aria-label="Neue Idee"><button class="sq" data-add aria-label="Idee parken">${svg(I.plus,22)}</button></div>
        ${PRIO.map(q=>{const a=D.ideen.map((it,i)=>({it,i})).filter(x=>x.it.prio===q[0]);
          return `<div class="lab">${q[1]} · ${a.length}</div>`+(a.length?`<div class="card">${a.map(x=>
            `<button class="hrow" data-idea="${x.i}"><span class="tx"><b>${esc(x.it.text)}</b>${x.it.notiz?`<span class="s">${esc(x.it.notiz)}</span>`:''}</span>${svg(I.chev,18)}</button>`).join('')}</div>`
            :'<p class="note">Nichts geparkt.</p>');}).join('')}`;
    }],
    rueckblick:['Rückblick',()=>{
      const labs=D.tageLabels(14);
      const cal=[];for(let i=0;i<3;i++)cal.push('<span></span>');
      for(let d=1;d<=31;d++)cal.push(`<span class="${d<12?'ok':''}${d===3||d===7?' miss':''}${d===12?' now':''}">${d}</span>`);
      return `<div class="lab">Letzte 14 Tage</div>
        <div class="card pad"><div class="g14 head"><span class="nm"></span><span class="dots">${labs.map((l,i)=>`<span class="${i===13?'t':''}">${l[0]}</span>`).join('')}</span></div>
          ${D.habits.map(h=>`<button class="g14" data-habit="${h.id}"><span class="nm">${esc(h.name)}</span><span class="dots">${h.letzte14.map(s=>`<i class="dot ${s}"></i>`).join('')}</span></button>`).join('')}
          <div class="legend"><span><i class="dot g"></i>Erledigt</span><span><i class="dot o"></i>Entschuldigt</span><span><i class="dot r"></i>Nicht</span></div></div>
        <div class="lab">Letzte 30 Tage</div>
        <div class="card pad"><p style="font-size:15px;color:var(--ink-soft)"><b style="color:var(--ink)">102-mal erledigt</b>, 5-mal entschuldigt, 2-mal nicht. Das sind 98 %.</p>
          <div class="stack"><i style="flex:102;background:var(--g)"></i><i style="flex:5;background:var(--o)"></i><i style="flex:2;background:var(--r)"></i></div></div>
        <div class="lab">Oktober</div>
        <div class="card pad"><div class="cal">${['M','D','M','D','F','S','S'].map(w=>`<span class="wd">${w}</span>`).join('')}${cal.join('')}</div>
          <p class="note" style="margin:12px 0 0">Hinterlegt: alles eingetragen. Punkt: an dem Tag gab es einen Aussetzer.</p></div>
        <button class="btn ghost" data-go="archiv">${svg(I.archive,20)} Archiv · ${D.archiv.length} geschafft</button>`;
    }],
    archiv:['Archiv',()=>`<p class="note" style="margin-top:8px">Gewohnheiten, die von allein laufen. Du trackst sie nicht mehr.</p>`+D.archiv.map(a=>
      `<div class="card pad"><div class="shead"><span class="ic" style="background:var(--surface-2)">${svg(a.icon,24)}</span><div class="tx"><h2>${esc(a.name)}</h2><p>${a.tageDabei} Tage dabei · ${a.quote} % erledigt</p></div></div>
        <div class="lab" style="margin:18px 0 6px">Ablauf</div><p style="font-size:15px;color:var(--ink-soft)">${a.ablauf.map(esc).join(' → ')}</p>
        ${a.notiz?`<p class="notiz">„${esc(a.notiz)}"</p>`:''}
        <button class="btn ghost" data-toast="Im Prototyp nur angedeutet">Wieder aufnehmen</button></div>`).join('')],
    wissen:['Wissen',()=>{
      const d=(t,p)=>`<details><summary>${t}${svg(I.chev,18)}</summary><p>${p}</p></details>`;
      return `<div class="lab">Es hakt – was tun?</div><div class="card">
        ${d('Ich vergesse es','Häng die Gewohnheit an etwas, das du ohnehin tust: „Nach dem Zähneputzen öffne ich Anki." Leg den Auslöser dorthin, wo du ihn siehst.')}
        ${d('Ich habe keine Lust','Schrumpf sie auf die Zwei-Minuten-Version. Nur öffnen zählt. Verbinde sie mit etwas, das du magst.')}
        ${d('Ich habe einen Tag ausgelassen','Kein Drama. Trag „Nicht" ehrlich ein und sorg nur dafür, dass morgen wieder ein Haken steht.')}
        ${d('Ich war krank oder unterwegs','Dafür gibt es „Entschuldigt". Es zählt nicht als Aussetzer.')}
        ${d('Es wird mir zu viel','Nimm keine neue dazu, bevor wieder höchstens zwei im Aufbau sind. Lieber eine pausieren, als alle schleifen zu lassen.')}</div>
        <div class="lab">Kernideen</div><div class="card">
        ${d('Winzig schlägt groß','Jeden Tag ein kleines Stück besser summiert sich. Wichtig ist die Richtung, nicht die Größe des Schritts.')}
        ${d('Erst wer, dann was','Frag nicht, was du erreichen willst, sondern wer du sein willst. Jeder Haken ist eine Stimme für diese Person.')}
        ${d('Vier Stellschrauben','Mach es sichtbar, reizvoll, einfach und befriedigend. Bei schlechten Gewohnheiten dreh jede Schraube in die andere Richtung.')}
        ${d('Zwei Minuten','Eine neue Gewohnheit beginnt in einer Version, die höchstens zwei Minuten dauert. Erst auftauchen, dann ausbauen.')}
        ${d('Nie zweimal','Ein Aussetzer ist ein Ausrutscher. Zwei hintereinander sind der Anfang einer neuen Gewohnheit.')}</div>`;
    }],
    einstellungen:['Einstellungen',()=>{
      const sw=(t,s,on)=>`<button class="set" role="switch" aria-checked="${on}" data-sw><span class="tx"><b>${t}</b><span>${s}</span></span><i class="sw"></i></button>`;
      const row=(t,s,v)=>`<button class="set" data-toast="Im Prototyp nur angedeutet"><span class="tx"><b>${t}</b>${s?`<span>${s}</span>`:''}</span><span class="val">${v}</span></button>`;
      return `<div class="lab">Erinnerung</div><div class="card">${sw('Tägliche Erinnerung','Abends, wenn es Zeit zum Abhaken ist',true)}${row('Uhrzeit','','21:00')}${sw('Stündlich nacherinnern','Bis der Tag abgeschlossen ist',false)}</div>
        <div class="lab">Tempo</div><div class="card">${row('Gleichzeitig im Aufbau','Höchstens',D.regel.maxAufbau)}${row('Neue Gewohnheit ab','So viele dürfen noch im Aufbau sein',D.regel.neuAb)}${row('Meilensteine','Stabil nach 21 Tagen, archiv-reif nach 60','Ändern')}</div>
        <div class="lab">Sicherung</div><div class="card">${row('Automatische Sicherung','Zuletzt: gestern, 21:04','Jetzt sichern')}${row('Wiederherstellungs-Code','','Anzeigen')}</div>
        <div class="lab">Darstellung</div><div class="card">${row('Design','Hell, Dunkel oder automatisch','Automatisch')}</div>`;
    }]
  };
  function renderPage(keep){const k=stack[stack.length-1];if(!k)return;const y=el.pBody.scrollTop;
    el.pTitle.textContent=SEITEN[k][0];el.pBody.innerHTML=SEITEN[k][1]();el.pBody.scrollTop=keep?y:0;}
  function go(k){closeSheet();if(stack[stack.length-1]!==k)stack.push(k);renderPage();el.page.classList.add('on');el.page.setAttribute('aria-hidden','false');}
  function back(){stack.pop();if(stack.length)renderPage();else{el.page.classList.remove('on');el.page.setAttribute('aria-hidden','true');}}

  let toastT=null;
  function toast(t){el.toast.textContent=t;el.toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.toast.classList.remove('on'),1800);}
  function refresh(){renderHome();renderPage(true);}

  /* ---------- Tipp-Verteilung ---------- */
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-close],[data-set],[data-habit],[data-go],[data-new],[data-edit],[data-idea],[data-prio],[data-start],[data-park],[data-add],[data-sw],[data-chip],[data-toast]');
    if(!t||el.open.contains(t))return;
    const d=t.dataset;
    if('close' in d)return closeSheet();
    if('set' in d){if(cur){undo=null;clearTimeout(undoT);D.setHeute(cur,d.set);}closeSheet();return refresh();}
    if(d.habit)return habitSheet(d.habit);
    if(d.go)return go(d.go);
    if('new' in d)return formSheet('Neue Gewohnheit','');
    if(d.edit)return formSheet('Bearbeiten',H(d.edit).name,d.edit);
    if(d.idea)return ideeSheet(+d.idea);
    if(d.prio){D.ideen[+d.i].prio=d.prio;refresh();return ideeSheet(+d.i);}
    if(d.start)return formSheet('Neue Gewohnheit',D.ideen[+d.start].text);
    if('park' in d){const v=($('#fName').value||'').trim();if(!v)return toast('Gib der Idee einen Namen');
      D.ideen.push({text:v,notiz:'',prio:'mittel'});closeSheet();refresh();return toast('Als Idee geparkt');}
    if('add' in d){const i=$('#iNeu'),v=(i.value||'').trim();if(!v)return i.focus();
      D.ideen.push({text:v,notiz:'',prio:'mittel'});refresh();return toast('Unter „Mittel" geparkt');}
    if('sw' in d)return t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true');
    if('chip' in d){t.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',c===t));return;}
    if(d.toast){toast(d.toast);if(el.sheet.contains(t))closeSheet();}
  });
  el.scrim.addEventListener('click',closeSheet);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(el.sheet.classList.contains('on'))closeSheet();else if(stack.length)back();}
    if(e.key==='Enter'&&e.target.id==='iNeu')$('[data-add]').click();});
  $('#pBack').innerHTML=svg(I.back,24); $('#pBack').addEventListener('click',back);
  $('#bInfo').innerHTML=svg(I.info,20); $('#bInfo').addEventListener('click',infoSheet);
  $('#bMehr').innerHTML=svg(I.menu,22); $('#bMehr').addEventListener('click',menuSheet);
  el.lead.addEventListener('click',()=>go('ideen'));
  $('#date').textContent=D.heuteLang;
  renderHome();
})();
</script>
</body>
</html>
