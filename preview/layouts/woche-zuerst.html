<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cadence – Woche zuerst</title>
<link rel="stylesheet" href="base.css">
<style>
#app{height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}

/* Kopf */
.top{flex:none;display:flex;align-items:flex-start;gap:8px;padding:calc(var(--safe-top) + 12px) 16px 8px}
.top .tt{flex:1;min-width:0}
.top h1{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.top .sub{font-size:14px;color:var(--muted);margin-top:2px}
.top .sub b{color:var(--ink);font-weight:650}
.ibtn{flex:none;width:44px;height:44px;margin:-6px -10px 0 0;display:grid;place-items:center;color:var(--faint)}
.ibtn span{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center}
.ibtn svg{width:16px;height:16px}
.backb{flex:none;display:flex;align-items:center;gap:2px;height:44px;margin:-6px 0 0 -10px;padding:0 10px;color:var(--accent-ink);font-weight:600;font-size:15px}
.backb svg{width:20px;height:20px}

main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:12px}

/* Tab-Leiste */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 8px calc(var(--safe-bottom) + 4px)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent-ink)}
.tabs button.on svg{stroke-width:2.1}

/* ---------- Woche: das Raster ---------- */
.raster{position:relative;padding:0 16px}
.raster::before{content:"";position:absolute;right:10px;width:104px;top:0;bottom:0;background:var(--accent-soft);border-radius:18px}
.raster>*{position:relative}
.lcol{flex:1;min-width:0}
.rcol{width:92px;flex:none}
.rowh{display:flex;gap:12px;align-items:flex-end;height:34px;padding-bottom:5px}
.dgrid{display:grid;grid-template-columns:repeat(6,1fr)}
.rowh .dgrid span{text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.rowh .rcol{text-align:center;font-size:12px;font-weight:700;color:var(--accent-ink)}
.gh{display:flex;gap:12px;align-items:center;padding:10px 0 0;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.gh .l{flex:1}
.gh .rcol{text-align:center;text-transform:none;letter-spacing:0;font-weight:600;color:var(--accent-ink)}
.hr{display:flex;gap:12px;align-items:center}
.hr .lcol{padding:5px 0 4px;border-top:1px solid var(--line)}
.gh+.hr .lcol{border-top:0}
.nm{display:block;max-width:100%;text-align:left;font-size:15px;font-weight:600;line-height:24px;letter-spacing:-.005em}
.hr .pfad{margin:1px 4px 5px 0}
.dc{height:32px;display:grid;place-items:center;position:relative}
.dc::after{content:"";position:absolute;inset:-4px 0}
.dc .dot{width:16px;height:16px;border-radius:5px}
.dot.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.dc .dot.nil{width:5px;height:5px;border-radius:50%;background:var(--surface-3)}
.dot.risk{outline:2px solid var(--o);outline-offset:2px}
.warn{display:flex;align-items:center;gap:7px;font-size:12px;line-height:16px;color:var(--ink-soft);padding:0 0 1px}
.warn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--o);flex:none}

.tile.wide{width:92px;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:650;line-height:1.2}
.tile.wide svg{width:20px;height:20px}
.tile.wide.open{background:var(--surface);color:var(--accent-ink);box-shadow:inset 0 0 0 2px var(--accent)}
.tile.wide.open svg{opacity:.55}
.tile.wide.open.risk{box-shadow:inset 0 0 0 2px var(--o)}
.tile.wide.open.frei{box-shadow:inset 0 0 0 1.5px var(--line-2);color:var(--muted);background:transparent}
.tile.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}

.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:12px 20px 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:10px;height:10px;border-radius:3px}
.hint{padding:2px 20px 0;font-size:12px;color:var(--muted)}

/* ---------- gemeinsame Bausteine ---------- */
.page{padding:0 16px}
.sec{padding:18px 4px 8px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:0 0 0 1px var(--line)}
.lead{font-size:15px;color:var(--ink-soft);line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft)}
.chip.a{background:var(--accent-soft);color:var(--accent-ink)}
.pl{position:relative;height:16px;margin:6px 4px 0 0;font-size:11px;color:var(--faint)}
.pl span{position:absolute;top:0;white-space:nowrap}
.pl .s{left:0}.pl .m{transform:translateX(-50%)}.pl .e{right:0}
.pl .cur{color:var(--accent-ink);font-weight:650}
.card .pfad{margin-top:8px}
.card .nmrow{display:flex;align-items:center;justify-content:space-between}
.card .nmrow svg{width:18px;height:18px;color:var(--faint)}
.srow{display:flex;gap:14px;align-items:flex-end;margin-top:12px}
.srow .stx{flex:1;min-width:0}
.sat{font-size:14px;font-weight:600}
.figs{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px;font-size:13px;color:var(--muted)}
.figs b{color:var(--ink);font-weight:650}
.d14{flex:none;display:grid;grid-template-columns:repeat(7,12px);gap:4px}
.d14 .dot{width:12px;height:12px;border-radius:4px}
.d14 .dot.nil{width:4px;height:4px;border-radius:50%;margin:4px}
.d14 .dot.today{outline:1.5px solid var(--ink-soft);outline-offset:1px}
.d14cap{font-size:11px;color:var(--faint);text-align:right;margin-bottom:5px}

.ideen .it{padding:12px 16px;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:var(--radius);margin-bottom:8px}
.ideen .it b{display:block;font-size:15px;font-weight:600}
.ideen .it small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.park{display:flex;gap:8px;margin:12px 0 4px}
.inp{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;background:var(--surface-2);color:var(--ink);border:1.5px solid transparent;outline:0}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:76px;resize:none}
.btn{min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:650;font-size:15px}
.btn.sec2{background:var(--surface-2);color:var(--ink)}
.btn.full{width:100%}

.list{background:var(--surface);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);margin-bottom:10px;overflow:hidden}
.list .li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;text-align:left}
.list .li+.li{border-top:1px solid var(--line)}
.li .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft);flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:15px;font-weight:600}
.li .tx small{display:block;font-size:13px;color:var(--muted)}
.li>svg{width:18px;height:18px;color:var(--faint);flex:none}
.kn h3{font-size:16px;margin-bottom:4px}
.kn p,.kn li{font-size:14px;color:var(--ink-soft);line-height:1.5}
.kn ul{margin:6px 0 0;padding-left:18px}
.sw{position:relative;flex:none;width:46px;height:28px;border-radius:99px;background:var(--surface-3);transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(18px)}

/* ---------- Blatt (Sheet) ---------- */
#sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end;visibility:hidden}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s}
#sheet .panel{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 18px calc(var(--safe-bottom) + 18px);transform:translateY(100%);transition:transform .24s ease-out}
#sheet.open{visibility:visible}
#sheet.open .bd{opacity:1}
#sheet.open .panel{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--surface-3);margin:0 auto 12px}
.panel h2{font-size:20px;line-height:1.25}
.panel .meta{font-size:14px;color:var(--muted);margin:2px 0 14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:6px 4px;text-align:left}
.opt+.opt{border-top:1px solid var(--line)}
.opt .sq{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-soft);flex:none}
.opt .sq.g{background:var(--g);color:var(--on-state)}.opt .sq.o{background:var(--o);color:var(--on-state)}.opt .sq.r{background:var(--r);color:var(--on-state)}
.opt .sq svg{width:20px;height:20px;stroke-width:2.4}
.opt .tx{flex:1}.opt b{display:block;font-size:16px;font-weight:600}.opt small{font-size:13px;color:var(--muted)}
.opt .cur{color:var(--accent-ink);width:22px;height:22px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat3 div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat3 b{display:block;font-size:20px;font-weight:700}
.stat3 small{font-size:12px;color:var(--muted)}
.panel .pfad.big{margin:14px 4px 0 0}
.panel .pl{margin-top:8px}
.panel .sat{font-size:16px;margin-top:10px}
.big14{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;justify-items:center;margin:6px 0 4px}
.big14 .lt{font-size:11px;color:var(--faint);font-weight:600}
.big14 .dot{width:24px;height:24px;border-radius:7px}
.big14 .dot.nil{width:6px;height:6px;border-radius:50%;margin:9px}
.big14 .dot.today{outline:2px solid var(--ink-soft);outline-offset:2px}
.panel .lab{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.panel p{font-size:15px;color:var(--ink-soft);line-height:1.5}
.panel .two{display:flex;gap:8px;margin-top:18px}
.panel .two .btn{flex:1}
.fld{margin-top:12px}.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.info p+p{margin-top:10px}
.info b{color:var(--ink)}

#toast{position:absolute;left:50%;bottom:calc(var(--safe-bottom) + 70px);transform:translate(-50%,10px);background:var(--ink);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs" aria-label="Hauptnavigation"></nav>
  <div id="sheet"><div class="bd" data-a="close"></div><div class="panel" id="panel"></div></div>
  <div id="toast"></div>
</div>
<script src="demo.js"></script>
<script>
(function(){
const D=DEMO, H=D.habits, IC=D.icons;
const S={tab:'woche',sub:null,sheet:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const ico=(k,n)=>D.svg(IC[k]||k,n||20);
const ownIcon={woche:'<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M9.5 10v9.5"/>'};
const COLS=D.tageLabels(7);               // Di Mi Do Fr Sa So Mo
const baseSerie={};H.forEach(h=>baseSerie[h.id]=h.serie-(h.heute==='g'?1:0));
const isWeekly=h=>h.wocheStand!==undefined;
const byId=id=>H.find(h=>h.id===id);
const dateOf=k=>k===13?'Heute, '+D.heuteLang:new Date(2026,9,12-(13-k)).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const atRisk=h=>h.faelligHeute&&h.heute===''&&h.alter>1&&(h.letzte14[12]===''||h.letzte14[12]==='r');
const serieLive=h=>isWeekly(h)?h.serie:(h.heute==='r'?0:baseSerie[h.id]+(h.heute==='g'?1:0));
const weekCount=h=>h.letzte14.slice(-(D.heuteWochentag+1)).filter(x=>x==='g').length;
const weekZiel=h=>parseInt(h.wocheStand.split('/')[1],10);
const nBuild=()=>H.filter(h=>h.phase==='build').length;

/* ---------- Bausteine ---------- */
function pfad(h,big){
  const f=Math.round(h.fill*100),m=Math.round(h.mark*100);
  return `<div class="pfad${big?' big':''}"><i style="width:${f}%"></i><b${h.fill>=h.mark?' class="on"':''} style="left:${m}%"></b><b class="end"></b></div>`;
}
function pfadLbl(h){
  const m=Math.round(h.mark*100),ph=h.phase;
  return `<div class="pl"><span class="s${ph==='build'?' cur':''}">Aufbau</span><span class="m${ph==='stable'?' cur':''}" style="left:${m}%">Stabil</span><span class="e${ph==='archive'?' cur':''}">Archiv-reif</span></div>`;
}
function dotCls(h,k){
  const st=h.letzte14[k],age=14-k;
  if(st)return st;
  return (age>h.alter||isWeekly(h))?'nil':'miss';
}
function dayCell(h,k,risk){
  const st=h.letzte14[k],c=dotCls(h,k);
  if(c==='nil'&&14-k>h.alter)return `<span class="dc"><i class="dot nil"></i></span>`;
  return `<button class="dc" data-a="day" data-id="${h.id}" data-k="${k}" aria-label="${esc(h.name)}, ${dateOf(k)}: ${D.zustandName[st]}"><i class="dot ${c}${risk?' risk':''}"></i></button>`;
}
function todayTile(h,risk){
  const st=h.heute,ic={g:'check',o:'dash',r:'x'};
  const frei=isWeekly(h)&&st==='';
  return `<button class="tile wide ${st||'open'}${risk?' risk':''}${frei?' frei':''}" data-a="tile" data-id="${h.id}" aria-label="${esc(h.name)} heute: ${D.zustandName[st]}">${ico(ic[st]||'check',20)}<span>${frei?'Heute frei':D.zustandName[st]}</span></button>`;
}
function row(h){
  const risk=atRisk(h);let dots='';
  for(let k=7;k<13;k++)dots+=dayCell(h,k,risk&&k===12);
  return `<div class="hr"><div class="lcol"><button class="nm" data-a="name" data-id="${h.id}">${esc(h.name)}</button>${pfad(h)}<div class="dgrid">${dots}</div>${risk?'<div class="warn">Nicht zweimal auslassen</div>':''}</div><div class="rcol">${todayTile(h,risk)}</div></div>`;
}
function dots14(h,cls){
  let s='';
  for(let k=0;k<14;k++){
    const c=dotCls(h,k);
    s+=`<i class="dot ${c}${k===13?' today':''}"></i>`;
  }
  return s;
}

/* ---------- Ansicht: Woche ---------- */
function viewWoche(){
  const f=D.faellig(),offen=f.filter(h=>h.heute==='').length,nicht=f.filter(h=>h.heute==='r').length,t=D.tag();
  const ph=D.nachPhase();
  const build=ph.build.filter(h=>h.faelligHeute),stable=ph.stable.filter(h=>h.faelligHeute);
  const weekly=H.filter(h=>!h.faelligHeute&&isWeekly(h));
  let head=`<div class="rowh"><div class="lcol dgrid">${COLS.slice(0,6).map(c=>`<span>${c}</span>`).join('')}</div><div class="rcol">Heute · ${COLS[6]}</div></div>`;
  let h='';
  const grp=(title,list)=>list.length?`<div class="gh"><div class="l">${title}</div><div class="rcol"></div></div>${list.map(row).join('')}`:'';
  h+=grp('Im Aufbau',build)+grp('Stabil',stable);
  if(weekly.length){
    h+=`<div class="gh"><div class="l">Diese Woche · ${esc(weekly[0].name)} ${weekCount(weekly[0])} von ${weekZiel(weekly[0])}</div><div class="rcol"></div></div>`;
    h+=weekly.map(row).join('');
  }
  return `<div class="raster">${head}${h}</div>
  <div class="legend"><span><i class="dot g"></i>Erledigt</span><span><i class="dot o"></i>Entschuldigt</span><span><i class="dot r"></i>Nicht</span><span><i class="dot miss"></i>Ohne Eintrag</span></div>`;
}
function topWoche(){
  const f=D.faellig(),offen=f.filter(h=>h.heute==='').length,nicht=f.filter(h=>h.heute==='r').length,t=D.tag();
  const st=(offen?`<b>${offen} offen</b>`:'<b>Alles erledigt</b>')+` · ${t.erledigt} von ${t.gesamt}`+(nicht?` · ${nicht} nicht`:'');
  return `<div class="tt"><h1>${D.heuteLang}</h1><div class="sub">${st}</div></div>${infoBtn()}`;
}

/* ---------- Ansicht: Stand ---------- */
function regelSatz(){
  const n=nBuild(),r=D.regel;
  if(n>r.maxAufbau)return `Im Aufbau sind ${n} – mehr als deine Grenze von ${r.maxAufbau}. Eine neue Gewohnheit kommt erst, wenn höchstens ${r.neuAb} im Aufbau sind.`;
  if(n<=r.neuAb)return `Im Aufbau sind ${n}. Es ist Platz für eine neue Gewohnheit.`;
  return `Im Aufbau sind ${n} von höchstens ${r.maxAufbau}. Eine neue Gewohnheit kommt erst, wenn höchstens ${r.neuAb} im Aufbau sind.`;
}
function standCard(h){
  const ser=serieLive(h),einheit=isWeekly(h)?(ser===1?'Woche':'Wochen'):(ser===1?'Tag':'Tage');
  return `<div class="card">
    <button class="nmrow nm" style="width:100%" data-a="name" data-id="${h.id}"><span>${esc(h.name)}</span>${ico('chev',18)}</button>
    ${pfad(h)}${pfadLbl(h)}
    <div class="srow"><div class="stx"><div class="sat">${h.satz}</div><div class="figs"><span><b class="num">${h.quote} %</b> Quote</span><span><b class="num">${ser}</b> ${einheit} am Stück</span></div></div>
    <div><div class="d14cap">Letzte 14 Tage</div><div class="d14">${dots14(h)}</div></div></div>
  </div>`;
}
function viewStand(){
  const ph=D.nachPhase();
  const c=k=>ph[k].length;
  let h=`<div class="page"><div class="card" style="margin-top:6px"><p class="lead">${regelSatz()}</p>
  <div class="chips"><span class="chip a">${c('build')} im Aufbau</span><span class="chip">${c('stable')} stabil</span><span class="chip">${c('archive')} archiv-reif</span></div></div>`;
  [['build','Im Aufbau'],['stable','Stabil'],['archive','Archiv-reif']].forEach(([k,t])=>{
    if(ph[k].length)h+=`<div class="sec"><span>${t}</span></div>`+ph[k].map(standCard).join('');
  });
  return h+'</div>';
}

/* ---------- Ansicht: Ideen ---------- */
function viewIdeen(){
  const n=nBuild(),r=D.regel,platz=n<=r.neuAb;
  let h=`<div class="page ideen"><div class="card" style="margin-top:6px"><p class="lead">${platz?`Du hast Platz: Im Aufbau sind nur ${n}. Wähle die oberste Idee.`:`Noch nicht: ${n} Gewohnheiten sind im Aufbau. Eine neue startest du, wenn höchstens ${r.neuAb} im Aufbau sind. Bis dahin parkst du Einfälle hier.`}</p></div>
  <form class="park" data-form="park"><input class="inp" id="ideaIn" placeholder="Neue Idee parken …" autocomplete="off"><button class="btn" type="submit">Parken</button></form>`;
  [['hoch','Wichtig'],['mittel','Mittel'],['irgendwann','Irgendwann']].forEach(([k,t])=>{
    const l=D.ideen.filter(i=>i.prio===k);
    if(!l.length)return;
    h+=`<div class="sec"><span>${t}</span><span>${l.length}</span></div>`+l.map(i=>`<div class="it"><b>${esc(i.text)}</b>${i.notiz?`<small>${esc(i.notiz)}</small>`:''}</div>`).join('');
  });
  return h+'</div>';
}

/* ---------- Ansicht: Mehr ---------- */
function li(ic,t,s,a){return `<button class="li" data-a="sub" data-s="${a}"><span class="ic">${ico(ic,18)}</span><span class="tx"><b>${t}</b><small>${s}</small></span>${ico('chev',18)}</button>`;}
function viewMehr(){
  if(S.sub==='archiv')return viewArchiv();
  if(S.sub==='wissen')return viewWissen();
  if(S.sub==='einst')return viewEinst();
  return `<div class="page"><div class="list" style="margin-top:6px">
    ${li('archive','Archiv',D.archiv.length+' geschaffte Gewohnheit','archiv')}
    ${li('book','Wissen','Kernideen und „Es hakt – was tun?“','wissen')}
    ${li('gear','Einstellungen','Erinnerung, Sicherung, Tempo-Regel','einst')}</div>
    <div class="list"><button class="li" data-a="new"><span class="ic">${ico('plus',18)}</span><span class="tx"><b>Gewohnheit anlegen</b><small>Oder erst als Idee parken</small></span>${ico('chev',18)}</button></div>
    <p class="hint" style="padding:6px 6px">Cadence · Layout-Prototyp „Woche zuerst“</p></div>`;
}
function viewArchiv(){
  return `<div class="page">`+D.archiv.map(a=>`<div class="card" style="margin-top:6px"><div class="nmrow" style="gap:12px;justify-content:flex-start"><span class="ic" style="width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center">${D.svg(a.icon,20)}</span><div><b style="font-size:16px">${esc(a.name)}</b><div class="figs" style="margin:0"><span>${a.tageDabei} Tage dabei</span><span>Quote ${a.quote} %</span></div></div></div>
    <div class="lab" style="font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px">Ablauf</div>
    <ol style="margin:0;padding-left:20px;font-size:14px;color:var(--ink-soft);line-height:1.6">${a.ablauf.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <p class="lead" style="margin-top:10px;font-size:14px">„${esc(a.notiz)}“</p>
    <button class="btn sec2 full" style="margin-top:12px" data-a="toast" data-t="Zurückgeholt – als Prototyp nur angedeutet">Zurück in den Aufbau holen</button></div>`).join('')
    +`<p class="hint" style="padding:6px 6px">Archiv-reife Gewohnheiten laufen von allein. Hier bleiben sie sichtbar, ohne dein Raster zu füllen.</p></div>`;
}
function viewWissen(){
  const c=(t,p)=>`<div class="card kn"><h3>${t}</h3>${p}</div>`;
  return `<div class="page" style="padding-top:6px">`+
   c('Die 1 %-Methode','<p>Jeden Tag ein kleines bisschen besser. Nicht die große Anstrengung zählt, sondern dass du morgen wieder da bist.</p>')+
   c('Nie zweimal auslassen','<p>Einmal auslassen passiert. Zweimal hintereinander ist der Anfang einer neuen Gewohnheit – der falschen. Darum steht gestern direkt neben heute.</p>')+
   c('Klein anfangen','<p>Mach die Gewohnheit so klein, dass du sie auch an einem schlechten Tag schaffst. „Anki öffnen“ reicht; das Lernen kommt danach von selbst.</p>')+
   c('Es hakt – was tun?','<ul><li>Zu groß? Halbiere sie.</li><li>Vergessen? Häng sie an etwas, das du ohnehin tust.</li><li>Keine Lust? Erinnere dich, wer du sein willst.</li><li>Zu viele auf einmal? Parke eine bei den Ideen.</li></ul>')+`</div>`;
}
const tg=(k,on)=>`<button class="sw${on?' on':''}" data-a="tg" data-k="${k}" aria-label="${k}" aria-pressed="${on}"></button>`;
function viewEinst(){
  return `<div class="page" style="padding-top:6px">
  <div class="sec"><span>Erinnerung</span></div><div class="list">
    <div class="li"><span class="tx"><b>Abends erinnern</b><small>Damit du den Tag nicht vergisst</small></span>${tg('erin',ST.erin)}</div>
    <div class="li"><span class="tx"><b>Uhrzeit</b></span><input type="time" class="inp" style="width:auto;padding:8px 12px" value="21:30"></div></div>
  <div class="sec"><span>Sicherung</span></div><div class="list">
    <div class="li"><span class="tx"><b>Automatisch sichern</b><small>Letzte Sicherung: heute, 08:12</small></span>${tg('sich',ST.sich)}</div>
    <button class="li" data-a="toast" data-t="Gesichert"><span class="tx"><b>Jetzt sichern</b></span>${ico('chev',18)}</button></div>
  <div class="sec"><span>Tempo-Regel</span></div><div class="list">
    <div class="li"><span class="tx"><b>Höchstens ${D.regel.maxAufbau} im Aufbau</b><small>Eine neue erst bei höchstens ${D.regel.neuAb}</small></span></div></div></div>`;
}
const ST={erin:true,sich:true};

/* ---------- Kopf, Tabs, Rendern ---------- */
function infoBtn(){return `<button class="ibtn" data-a="info" aria-label="Über dieses Layout"><span>${ico('info',16)}</span></button>`;}
const TITLES={stand:['Stand','Wo jede Gewohnheit auf ihrem Weg steht'],ideen:['Ideen','Geparkt, bis Platz ist'],mehr:['Mehr','']};
const SUBT={archiv:'Archiv',wissen:'Wissen',einst:'Einstellungen'};
function render(){
  const main=$('main'),y=main.scrollTop;
  let top,body;
  if(S.tab==='woche'){top=topWoche();body=viewWoche();}
  else if(S.tab==='stand'){top=`<div class="tt"><h1>Stand</h1><div class="sub">Wo jede Gewohnheit auf ihrem Weg steht</div></div>${infoBtn()}`;body=viewStand();}
  else if(S.tab==='ideen'){top=`<div class="tt"><h1>Ideen</h1><div class="sub">Geparkt, bis Platz ist</div></div>${infoBtn()}`;body=viewIdeen();}
  else if(S.sub){top=`<button class="backb" data-a="back">${ico('back',20)}Mehr</button><div class="tt" style="padding-top:2px"><h1 style="font-size:19px;text-align:center;margin-right:44px">${SUBT[S.sub]}</h1></div>${infoBtn()}`;body=viewMehr();}
  else{top=`<div class="tt"><h1>Mehr</h1></div>${infoBtn()}`;body=viewMehr();}
  $('top').innerHTML=top;main.innerHTML=body;main.scrollTop=y;
  const tabs=[['woche','Woche',ownIcon.woche],['stand','Stand',IC.chart],['ideen','Ideen',IC.bulb],['mehr','Mehr',IC.menu]];
  $('tabs').innerHTML=tabs.map(([k,l,i])=>`<button data-a="tab" data-t="${k}" class="${S.tab===k?'on':''}" ${S.tab===k?'aria-current="page"':''}>${D.svg(i,22)}<span>${l}</span></button>`).join('');
}

/* ---------- Blätter ---------- */
function openSheet(html){$('panel').innerHTML='<div class="grab"></div>'+html;$('panel').scrollTop=0;$('sheet').classList.add('open');}
function closeSheet(){$('sheet').classList.remove('open');S.sheet=null;}
const OPTS=[['g','check','Erledigt','Gemacht'],['o','dash','Entschuldigt','Zählt nicht als Aussetzer'],['r','x','Nicht','Zählt als ausgelassen'],['','back','Zurücksetzen','Wieder offen']];
function sheetDay(id,k){
  const h=byId(id),cur=k===13?h.heute:h.letzte14[k];S.sheet={type:'day',id,k};
  openSheet(`<h2>${esc(h.name)}</h2><p class="meta">${dateOf(k)}</p>`+OPTS.map(([st,ic,t,s])=>`<button class="opt" data-a="pick" data-st="${st}"><span class="sq ${st}">${ico(st===''?'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>':ic,20)}</span><span class="tx"><b>${t}</b><small>${s}</small></span>${st===cur&&st!==''||(st===''&&cur==='')?`<span class="cur">${ico('check',22)}</span>`:''}</button>`).join(''));
}
function sheetDetail(id){
  const h=byId(id),ser=serieLive(h),w=isWeekly(h);S.sheet={type:'detail',id};
  const einheit=w?(ser===1?'Woche':'Wochen'):(ser===1?'Tag':'Tage');
  let g='';COLS.length;
  const lt=D.tageLabels(14);
  for(let i=0;i<7;i++)g+=`<span class="lt">${lt[i]}</span>`;
  for(let k=0;k<14;k++)g+=`<i class="dot ${dotCls(h,k)}${k===13?' today':''}"></i>`;
  openSheet(`<h2>${esc(h.name)}</h2><p class="meta">${D.phaseName[h.phase]} · ${esc(h.rhythmus)} · seit ${h.alter} Tagen</p>
  ${pfad(h,true)}${pfadLbl(h)}<div class="sat">${h.satz}</div>
  <div class="stat3"><div><b class="num">${h.quote} %</b><small>Quote</small></div><div><b class="num">${ser}</b><small>${einheit} am Stück</small></div><div><b class="num">${h.alter}</b><small>Tage dabei</small></div></div>
  <div class="lab" style="margin-top:4px">Letzte 14 Tage</div><div class="big14">${g}</div>
  <div class="lab">Notiz</div><p>${h.notiz?'„'+esc(h.notiz)+'“':'Noch keine Notiz.'}</p>
  <div class="two"><button class="btn sec2" data-a="close">Schließen</button><button class="btn" data-a="edit" data-id="${h.id}">Bearbeiten</button></div>`);
}
function sheetEdit(id){
  const h=id?byId(id):null;S.sheet={type:'edit',id};
  openSheet(`<h2>${h?'Bearbeiten':'Gewohnheit anlegen'}</h2>
  ${h?'':`<p class="meta">${nBuild()>D.regel.neuAb?`Im Aufbau sind schon ${nBuild()}. Parke sie besser erst bei den Ideen.`:'Es ist Platz im Aufbau.'}</p>`}
  <div class="fld"><label>Name</label><input class="inp" id="edName" value="${h?esc(h.name):''}" placeholder="z. B. Abends 10 Seiten lesen"></div>
  <div class="fld"><label>Rhythmus</label><input class="inp" value="${h?esc(h.rhythmus):'Jeden Tag'}" readonly></div>
  <div class="fld"><label>Notiz (wer du sein willst)</label><textarea class="inp" id="edNote" placeholder="Ich bin jemand, der …">${h?esc(h.notiz):''}</textarea></div>
  <div class="two"><button class="btn sec2" data-a="close">Abbrechen</button><button class="btn" data-a="save">${h?'Speichern':'In Ideen parken'}</button></div>`);
}
function sheetInfo(){
  openSheet(`<div class="info"><h2>Woche zuerst</h2><p class="meta">Konzept dieses Prototyps</p>
  <p><b>Die Idee.</b> Eine Gewohnheit ist ein Muster über Tage, kein Kästchen für heute. Darum ist die Startansicht ein Raster der letzten sieben Tage, und heute steht groß am rechten Rand.</p>
  <p><b>Stärke.</b> Jeder Haken setzt sichtbar eine Reihe fort, ein ausgelassener Vortag fällt genau dort auf, wo du abhakst, und vergangene Tage korrigierst du direkt im Raster.</p>
  <p><b>Preis.</b> Eine Zeile trägt mehr Information als in einer reinen Heute-Liste, und bei deutlich mehr als acht Gewohnheiten wird das Raster lang.</p>
  <p style="font-size:13px;color:var(--muted)">Die Warnung „Nicht zweimal auslassen“ erscheint, sobald gestern leer oder „Nicht“ ist und heute noch offen. Probiere es: Tippe bei einer offenen Gewohnheit auf den gestrigen Punkt und wähle „Nicht“.</p>
  <div class="two"><button class="btn" data-a="close">Verstanden</button></div></div>`);
}
let tt;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800);}

/* ---------- Eingaben ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,id=el.dataset.id;
  if(a==='tile'){
    const h=byId(id);
    if(h.heute===''){D.setHeute(id,'g');render();const t=document.querySelector(`.tile[data-id="${id}"]`);if(t)t.classList.add('pop');}
    else sheetDay(id,13);
  }
  else if(a==='day')sheetDay(id,+el.dataset.k);
  else if(a==='name')sheetDetail(id);
  else if(a==='pick'){
    const {id:hid,k}=S.sheet,st=el.dataset.st;
    if(k===13)D.setHeute(hid,st);else byId(hid).letzte14[k]=st;
    closeSheet();render();
  }
  else if(a==='close')closeSheet();
  else if(a==='info')sheetInfo();
  else if(a==='edit')sheetEdit(id);
  else if(a==='new')sheetEdit(null);
  else if(a==='save'){
    const name=$('edName').value.trim(),note=$('edNote').value.trim(),sid=S.sheet.id;
    if(!name){$('edName').focus();return;}
    if(sid){const h=byId(sid);h.name=name;h.notiz=note;closeSheet();render();toast('Gespeichert');}
    else{D.ideen.push({text:name,notiz:note,prio:'mittel'});closeSheet();toast('In Ideen geparkt');render();}
  }
  else if(a==='tab'){S.tab=el.dataset.t;S.sub=null;$('main').scrollTop=0;render();}
  else if(a==='sub'){S.sub=el.dataset.s;$('main').scrollTop=0;render();}
  else if(a==='back'){S.sub=null;render();}
  else if(a==='toast')toast(el.dataset.t);
  else if(a==='tg'){ST[el.dataset.k]=!ST[el.dataset.k];render();}
});
document.addEventListener('submit',e=>{
  if(e.target.dataset.form==='park'){
    e.preventDefault();const v=$('ideaIn').value.trim();if(!v)return;
    D.ideen.push({text:v,notiz:'',prio:'mittel'});render();toast('Geparkt');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
render();
})();
</script>
</body>
</html>
