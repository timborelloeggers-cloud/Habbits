  camera:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="3.3"/><path d="M8.5 7l1.3-2.5h4.4L15.5 7"/>',
  tooth:'<path d="M12 4.5C10 3 7.2 3.2 6.2 5.6c-1 2.3-.2 4.7.3 7.5.4 2.3.6 5.9 2 5.9 1.2 0 1.2-2 1.7-3.8.4-1.5 1.2-1.5 1.6 0 .5 1.8.5 3.8 1.7 3.8 1.4 0 1.6-3.6 2-5.9.5-2.8 1.3-5.2.3-7.5C16.8 3.2 14 3 12 4.5z"/>',
  shower:'<path d="M8.5 3.5A2.5 2.5 0 0 1 11 6v1.5"/><path d="M4 11c0-3 3.2-4.5 7-4.5s7 1.5 7 4.5z"/><path d="M8 15v1.5M12 14.5v1.5M16 15v1.5M10 18v1.5M14 18v1.5"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.6 2.6 5.4-5.8"/>',
  plant:'<path d="M6 21h12"/><path d="M12 21v-8"/><path d="M12 13c-4 0-6-2-6-6 4 0 6 2 6 6z"/><path d="M12 11c0-3 1.6-5 5-5 0 3-1.6 5-5 5z"/>'
};
const ICON_KEYS=Object.keys(ICONS);
function svgIcon(key){return '<svg viewBox="0 0 24 24">'+(ICONS[key]||ICONS.leaf)+'</svg>';}
const EMOJI_MAP={'🌱':'sprout','💪':'dumbbell','📖':'book','🧘':'yoga','💧':'drop','🏃':'run','🍎':'apple',
  '😴':'moon','✍️':'pen','🧠':'brain','🎯':'target','☀️':'sun','🌙':'moon','🚭':'smokefree','🎸':'music',
  '💊':'pill','🧹':'clean','💰':'money','🥦':'broccoli','📵':'phoneoff'};

/* ---------- State ---------- */
// Vorschau-Fassung (cadence-app/preview/, vom Build per window.CADENCE_PREVIEW markiert):
// arbeitet auf einer eigenen Kopie der Daten und ohne Netz - die echte App und ihre Sicherung bleiben unberuehrt.
const PREVIEW=!!window.CADENCE_PREVIEW;
const KEY=PREVIEW?'cadence_preview':'cadence_v1';
// Schwellen fuer die automatischen Meilensteine (in den Einstellungen aenderbar)
const MS_DEFAULTS={stableMinDays:21,stableWindow:14,archiveMinDays:60,archiveWindow:30,archivePct:90};
// Abstaende (in Tagen) zwischen den Rueckfragen zu archivierten Gewohnheiten:
// erst nach 5 Tagen, dann in immer groesseren Abstaenden bis 2 Jahre. Der letzte Wert wiederholt sich.
const CHECK_GAPS=[5,10,15,20,30,45,90,180,360,730];
const CHECK_GAPS_V=2;   // Version der Abstaende: steigt sie, werden offene erste Rueckfragen neu gelegt
const DEFAULT={habits:[],entries:{},ideas:[],groups:[],
  settings:Object.assign({theme:'system',style:'original',ideaCollapsed:{},push:{enabled:false,time:'21:00',id:null,repeat:false,repeatMax:6}},MS_DEFAULTS),nextId:1};
let S=load();
function load(){try{let raw=localStorage.getItem(KEY);
  if(!raw&&PREVIEW)raw=localStorage.getItem('cadence_v1');   // erste Oeffnung: Stand der echten App uebernehmen
  if(raw)return Object.assign({},DEFAULT,JSON.parse(raw));}catch(e){}return JSON.parse(JSON.stringify(DEFAULT));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}markDirty();queueStatus();}
function uid(){return 'i'+(S.nextId++);}
function migrate(){
  S.habits.forEach(h=>{
    if(!h.icon)h.icon=EMOJI_MAP[h.emoji]||'leaf';
    if(!h.schedule)h.schedule='daily';
    if(h.schedule==='weekly'&&h.weeklyTarget==null)h.weeklyTarget=3;
    if(h.monthlyTarget==null)h.monthlyTarget=8;
    if(!h.weekdays)h.weekdays=[0,1,2,3,4];
    if(h.interval==null)h.interval=2;
    if(!h.startDate)h.startDate=todayStr();
    // split old single "goalDays" into rhythm (schedule) + separate end-goal
    if(h.goalEnabled==null){h.goalEnabled=!!(h.goalDays>0);h.goalN=h.goalDays>0?h.goalDays:30;}
    if(h.goalN==null)h.goalN=30;
    if(h.celebrated==null)h.celebrated=false;
    if(!h.reminders)h.reminders={enabled:false,times:[]};
    if(!h.reminders.times)h.reminders.times=h.reminders.time?[h.reminders.time]:[];
    (h.situations||[]).forEach(s=>{if(!s.id)s.id=uid();});
    if(!h.situations||!h.situations.length)h.situations=[{id:uid(),name:'Standard'}];
    if(h.note==null)h.note='';
    if(h.archived==null){h.archived=false;h.archivedAt=null;}
    if(h.archived&&!h.check)h.check=newCheck(h.archivedAt||todayStr());   // Rueckfrage-Plan nachruesten
    if(!h.archived&&h.check)h.check=null;
  });
  S.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT.settings)),S.settings);
  if(!S.settings.push||typeof S.settings.push!=='object')S.settings.push={enabled:false,time:'21:00',id:null};
  if(S.settings.push.repeat==null)S.settings.push.repeat=false;
  if(!(S.settings.push.repeatMax>=1))S.settings.push.repeatMax=6;
  if(!S.settings.ideaCollapsed)S.settings.ideaCollapsed={};
  // neue Abstaende auch auf noch offene erste Rueckfragen anwenden (einmalig je Version)
  if(S.settings.checkGapsV!==CHECK_GAPS_V){
    S.habits.forEach(h=>{if(h.archived&&h.check&&!h.check.off&&!h.check.n)h.check.due=newCheck(h.archivedAt).due;});
    S.settings.checkGapsV=CHECK_GAPS_V;
  }
  // bereits erreichte Meilensteine still als "gefeiert" markieren - keine Feier-Welle beim ersten Start
  S.habits.forEach(h=>{if(!h.milestones)h.milestones={stable:isStable(h),archive:isArchiveReady(h)};});
  if(!Array.isArray(S.ideas))S.ideas=[];
  S.ideas.forEach(i=>{if(i.note==null)i.note='';if(!i.prio)i.prio='mid';});
  if(!Array.isArray(S.groups))S.groups=[];
  const known=new Set(S.habits.map(h=>h.id));
  S.groups.forEach(g=>{
    if(!Array.isArray(g.habitIds))g.habitIds=[];
    g.habitIds=g.habitIds.filter(id=>known.has(id));   // drop deleted habits
    if(!g.icon)g.icon='leaf';
    if(g.collapsed==null)g.collapsed=true;
  });
  save();
}
/* a habit belongs to at most one group */
function groupOf(hid){return S.groups.find(g=>g.habitIds.includes(hid))||null;}
// archivierte Gewohnheiten tauchen nirgends im Tracking auf, behalten aber ihre Gruppe
function activeHabits(){return S.habits.filter(h=>!h.archived);}
function ungroupedHabits(){return activeHabits().filter(h=>!groupOf(h.id));}
function groupHabits(g){return g.habitIds.map(id=>S.habits.find(h=>h.id===id)).filter(h=>h&&!h.archived);}
migrate();

/* ---------- Date helpers ---------- */
const DAYS_SHORT=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return new Date();}
function todayStr(){return ds(today());}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function parse(s){const[y,m,dd]=s.split('-').map(Number);return new Date(y,m-1,dd);}
function wd(d){return (d.getDay()+6)%7;} // 0=Mon
function mondayOf(d){return addDays(d,-wd(d));}
function fmtLong(d){return d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});}
function weekKey(d){const m=mondayOf(d);return ds(m);}
function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function sameYMD(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}

/* ---------- Entry helpers ---------- */
function getE(hid,sid,date){return (S.entries[hid]&&S.entries[hid][sid])?S.entries[hid][sid][date]:undefined;}
function setE(hid,sid,date,v){
  if(!S.entries[hid])S.entries[hid]={};
  if(!S.entries[hid][sid])S.entries[hid][sid]={};
  if(v)S.entries[hid][sid][date]=v; else delete S.entries[hid][sid][date];
  save();
}
// Day result for goal/streak purposes.
// 'g'  = day done (ALL situations decided, at least one green, rest orange)
// 'o'  = all situations orange (excused → neutral, doesn't break, doesn't count)
// 'r'  = at least one red (fail → breaks)
// 'pending' = partially tracked (some situation still undecided)
// undefined = nothing tracked at all
function dayFull(h,date){
  let anyR=false,unset=0,green=0,orange=0,n=h.situations.length;
  for(const s of h.situations){const v=getE(h.id,s.id,date);
    if(v===undefined)unset++;else if(v==='r')anyR=true;else if(v==='g')green++;else orange++;}
  if(unset===n)return undefined;
  if(anyR)return 'r';
  if(unset>0)return 'pending';
  if(green===0)return 'o';
  return 'g';
}
function isSchedDay(h,d){
  if(h.schedule==='weekdays')return h.weekdays.includes(wd(d));
  if(h.schedule==='everyN'){
    // normalise to midnight: `d` may carry a time-of-day, which would otherwise
    // round the day difference up after noon and flip the rhythm mid-day
    const a=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const diff=Math.round((a-parse(h.startDate))/86400000);
    return (((diff%h.interval)+h.interval)%h.interval)===0;}
  return true; // daily, weekly, monthly: any day can be used
}
// wie dueToday(), nur fuer ein beliebiges Datum (Tages-Checkliste mit Navigation)
function dueOnDate(h,d){
  if(h.schedule==='daily')return true;
  if(h.schedule==='weekdays')return h.weekdays.includes(wd(d));
  if(h.schedule==='everyN')return isSchedDay(h,d);
  return false; // weekly/monthly are flexible, not a fixed daily duty
}
function dueToday(h){return dueOnDate(h,today());}

/* ---------- Streak / progress ---------- */
// Erster Tag der Gewohnheit: startDate oder frueherer Eintrag (falls nachgetragen)
function habitStart(h){
  let first=h.startDate||todayStr();
  const e=S.entries[h.id]||{};
  Object.values(e).forEach(m=>Object.keys(m).forEach(k=>{if(k<first)first=k;}));
  return parse(first);
}
// "Dabei seit": Alter der Gewohnheit in Kalendertagen (erster Tag und heute zaehlen mit) -
// Grundlage fuer Stabil/Archiv-reif. Ob sie auch laeuft, pruefen die Fenster in recentPeriods().
function habitAge(h){
  const t=today();
  return Math.max(1,Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-habitStart(h))/86400000)+1);
}
// Streak nach "nie zweimal auslassen": gezaehlt werden erledigte geplante Tage.
// Ein einzelner verpasster Tag zaehlt nicht mit, bricht aber nicht - erst zwei
// verpasste geplante Tage hintereinander. Orange und heute-noch-offen: uebersprungen.
function streak(h){
  let n=0,miss=0;let d=today();const start=habitStart(h);const tStr=todayStr();
  for(let i=0;i<1500&&d>=start;i++){
    if(!isSchedDay(h,d)){d=addDays(d,-1);continue;}
    const st=dayFull(h,ds(d));
    if(st==='g'){n++;miss=0;}
    else if(st==='o'){/* entschuldigt */}
    else if(ds(d)===tStr&&st!=='r'){/* heute noch offen */}
    else{miss++;if(miss>=2)break;}
    d=addDays(d,-1);
  }
  return n;
}
// Letzter geplanter Tag vor heute verpasst und heute noch nicht erledigt -> "nicht zweimal!"
function streakAtRisk(h){
  if(h.schedule==='weekly'||h.schedule==='monthly')return false;
  const tStr=todayStr();const stT=dayFull(h,tStr);
  if(isSchedDay(h,today())&&(stT==='g'||stT==='o'))return false;
  const start=habitStart(h);let d=addDays(today(),-1);
  for(let i=0;i<60&&d>=start;i++){
    if(isSchedDay(h,d)){const st=dayFull(h,ds(d));return !(st==='g'||st==='o');}
    d=addDays(d,-1);
  }
  return false;
}
function weekGreens(h,mon){mon=mon||mondayOf(today());let c=0;for(let i=0;i<7;i++)if(dayFull(h,ds(addDays(mon,i)))==='g')c++;return c;}
function monthGreens(h,d){const y=d.getFullYear(),m=d.getMonth(),days=new Date(y,m+1,0).getDate();let c=0;
  for(let i=1;i<=days;i++)if(dayFull(h,ds(new Date(y,m,i)))==='g')c++;return c;}
// Consecutive weeks/months in which the frequency target was reached.
function weekMet(h,mon){return weekGreens(h,mon)>=h.weeklyTarget;}
// Wochen/Monate: eine verfehlte Periode wird toleriert, zwei in Folge brechen die Serie.
// Die laufende Periode zaehlt nur, wenn sie schon erfuellt ist.
function weekStreak(h){let mon=mondayOf(today());if(!weekMet(h,mon))mon=addDays(mon,-7);
  const first=mondayOf(habitStart(h));let n=0,miss=0;
  for(let i=0;i<300&&mon>=first;i++){if(weekMet(h,mon)){n++;miss=0;}else if(++miss>=2)break;mon=addDays(mon,-7);}
  return n;}
function monthMet(h,d){return monthGreens(h,d)>=h.monthlyTarget;}
function monthStreak(h){let d=new Date(today().getFullYear(),today().getMonth(),1);
  if(!monthMet(h,d))d=new Date(d.getFullYear(),d.getMonth()-1,1);
  const s=habitStart(h);const first=new Date(s.getFullYear(),s.getMonth(),1);let n=0,miss=0;
  for(let i=0;i<160&&d>=first;i++){if(monthMet(h,d)){n++;miss=0;}else if(++miss>=2)break;d=new Date(d.getFullYear(),d.getMonth()-1,1);}
  return n;}

/* ---------- Meilensteine: Stabil / Archiv-reif ---------- */
// Perioden der letzten `days` Tage, neueste zuerst: 'ok' | 'miss' | 'skip' (entschuldigt/heute offen).
// Tages-Rhythmen: geplante Tage; X pro Woche/Monat: abgeschlossene (oder schon erfuellte) Wochen/Monate.
function recentPeriods(h,days){
  const start=habitStart(h);const out=[];
  if(h.schedule==='weekly'){
    let mon=mondayOf(today());if(!weekMet(h,mon))mon=addDays(mon,-7);
    for(let i=0;i<Math.ceil(days/7);i++){
      if(addDays(mon,6)<start)break;
      const met=weekMet(h,mon);if(!met&&mon<start)break;   // angebrochene Startwoche nicht als Fehler werten
      out.push(met?'ok':'miss');mon=addDays(mon,-7);}
    return out;
  }
  if(h.schedule==='monthly'){
    let d=new Date(today().getFullYear(),today().getMonth(),1);if(!monthMet(h,d))d=new Date(d.getFullYear(),d.getMonth()-1,1);
    for(let i=0;i<Math.max(1,Math.round(days/30));i++){
      if(new Date(d.getFullYear(),d.getMonth()+1,0)<start)break;
      const met=monthMet(h,d);if(!met&&d<start)break;
      out.push(met?'ok':'miss');d=new Date(d.getFullYear(),d.getMonth()-1,1);}
    return out;
  }
  return windowDays(h,days).map(x=>x.st);
}
// Geplante Tage der letzten `days` Tage, neueste zuerst, mit Abstand zu heute
function windowDays(h,days){
  const start=habitStart(h),out=[];let d=today();const tStr=todayStr();
  for(let i=0;i<days&&d>=start;i++){
    if(isSchedDay(h,d)){const st=dayFull(h,ds(d));
      out.push({ago:i,st:st==='g'?'ok':(st==='o'||(ds(d)===tStr&&st!=='r'))?'skip':'miss'});}
    d=addDays(d,-1);
  }
  return out;
}
function stableInfo(h){const c=S.settings;const p=recentPeriods(h,c.stableWindow);
  const clean=!p.includes('miss')&&p.includes('ok');const days=habitAge(h);
  return {days,minDays:c.stableMinDays,window:c.stableWindow,clean,met:days>=c.stableMinDays&&clean};}
function archiveInfo(h){const c=S.settings;const p=recentPeriods(h,c.archiveWindow);
  const ok=p.filter(x=>x==='ok').length,miss=p.filter(x=>x==='miss').length;
  const rate=(ok+miss)?Math.round(ok/(ok+miss)*100):0;const days=habitAge(h);
  return {days,minDays:c.archiveMinDays,window:c.archiveWindow,pct:c.archivePct,rate,
    met:days>=c.archiveMinDays&&(ok+miss)>0&&rate>=c.archivePct};}
// Klartext, warum ein Meilenstein erreicht ist - oder was noch fehlt
function tageWort(n){return n===1?'Tag':'Tage';}
function stableReason(s){
  if(s.met)return `Weil: seit ${s.days} Tagen dabei und die letzten ${s.window} Tage ohne Lücke.`;
  const miss=[];
  if(s.days<s.minDays)miss.push(`noch ${s.minDays-s.days} ${tageWort(s.minDays-s.days)} dabei bleiben`);
  if(!s.clean)miss.push(`die letzten ${s.window} Tage ohne Lücke`);
  return 'Fehlt: '+miss.join(' und ')+'.';
}
function archiveReason(a){
  if(a.met)return `Weil: seit ${a.days} Tagen dabei und ${a.rate} % in den letzten ${a.window} Tagen.`;
  const miss=[];
  if(a.days<a.minDays)miss.push(`noch ${a.minDays-a.days} ${tageWort(a.minDays-a.days)} dabei bleiben`);
  if(a.rate<a.pct)miss.push(`mind. ${a.pct} % in den letzten ${a.window} Tagen (gerade ${a.rate} %)`);
  return 'Fehlt: '+miss.join(' und ')+'.';
}
function isStable(h){return stableInfo(h).met;}
function isArchiveReady(h){return archiveInfo(h).met;}
function habitStatus(h){return isArchiveReady(h)?'archive':isStable(h)?'stable':null;}
function statusBadge(h){const s=habitStatus(h);
  return s==='archive'?'<span class="badge archive">Archiv-reif</span>':s==='stable'?'<span class="badge stable">Stabil</span>':'';}

/* ---------- Fortschritt: ein Weg von Start ueber Stabil bis Archiv-reif ----------
   Einzige Quelle fuer die Anzeige in Heute, Detail und Statistik. Die Regeln selbst
   stehen in stableInfo()/archiveInfo() und bleiben unveraendert. */
// Fruehestens in wie vielen Tagen ein Fenster-Kriterium erfuellt ist, wenn ab jetzt nichts mehr ausfaellt
function daysUntilWindow(h,days,test){
  const unit=h.schedule==='weekly'?7:h.schedule==='monthly'?30:1;
  if(unit>1){
    const len=unit===7?Math.ceil(days/7):Math.max(1,Math.round(days/30));
    const p=recentPeriods(h,days);
    for(let n=1;n<=len;n++){let ok=n,miss=0;
      p.forEach((st,i)=>{if(i+n<len){if(st==='ok')ok++;else if(st==='miss')miss++;}});
      if(test(ok,miss))return n*unit;}
    return len*unit;
  }
  const w=windowDays(h,days);
  const openToday=w.length&&w[0].ago===0&&w[0].st==='skip'&&dayFull(h,todayStr())!=='o';
  for(let n=1;n<=days;n++){let ok=openToday?1:0,miss=0;
    for(let i=1;i<=n;i++)if(isSchedDay(h,addDays(today(),i)))ok++;
    w.forEach(x=>{if(x.ago+n<days){if(x.st==='ok')ok++;else if(x.st==='miss')miss++;}});
    if(test(ok,miss))return n;}
  return days;
}
function inTagen(n){return n===1?'in 1 Tag':`in ${n} Tagen`;}
// phase: 'build' | 'stable' | 'archive' · fill/ghost/mark: Anteile 0..1 der Skala bis Archiv-reif
// Die Fuellung folgt dem Alter und laeuft nie rueckwaerts; sie ueberschreitet aber keine Marke,
// deren zweite Bedingung offen ist - der gesperrte Teil erscheint blass (ghost).
function fortschritt(h){
  const c=S.settings,s=stableInfo(h),a=archiveInfo(h),age=s.days;
  const mark=Math.min(.8,c.stableMinDays/c.archiveMinDays);
  const ageFrac=Math.min(1,age/c.archiveMinDays);
  const base={mark,rate:a.rate,age,stableOn:s.met||a.met,archiveOn:a.met};
  if(a.met)return Object.assign(base,{phase:'archive',fill:1,ghost:1,left:0,text:'Archiv-reif'});
  if(s.met){
    const needAge=Math.max(0,c.archiveMinDays-age);
    const rateOk=a.rate>=c.archivePct;
    const needRate=rateOk?0:daysUntilWindow(h,c.archiveWindow,(ok,miss)=>(ok+miss)>0&&Math.round(ok/(ok+miss)*100)>=c.archivePct);
    const left=Math.max(needAge,needRate,1);
    const text=needRate>needAge?`Quote ${a.rate} %, ab ${c.archivePct} % Archiv-reif`:`Archiv-reif ${inTagen(left)}`;
    return Object.assign(base,{phase:'stable',fill:Math.max(mark,ageFrac),ghost:ageFrac,left,text});
  }
  const needAge=Math.max(0,c.stableMinDays-age);
  const needClean=s.clean?0:daysUntilWindow(h,c.stableWindow,(ok,miss)=>miss===0&&ok>0);
  const left=Math.max(needAge,needClean,1);
  const text=`Stabil ${inTagen(left)}`+(needClean>needAge?' ohne Lücke':'');
  return Object.assign(base,{phase:'build',fill:Math.min(ageFrac,mark),ghost:ageFrac,left,text});
}
// Der Pfad als Balken. opt.text: Satz darunter · opt.big: mit Beschriftung der Marken (Detail)
function pfadHTML(h,opt){
  opt=opt||{};const f=fortschritt(h);const pc=x=>(Math.round(x*1000)/10)+'%';
  return `<div class="pfad ${f.phase}${opt.big?' big':''}" role="img" aria-label="Fortschritt: ${f.text}">
    <div class="pf-track">${f.ghost>f.fill?`<i class="pf-ghost" style="width:${pc(f.ghost)}"></i>`:''}<i class="pf-fill" style="width:${pc(f.fill)}"></i>
      <b class="pf-mark${f.stableOn?' on':''}" style="left:${pc(f.mark)}"></b><b class="pf-mark end${f.archiveOn?' on':''}"></b></div>
    ${opt.big?`<div class="pf-labels"><span style="left:${pc(f.mark)}" class="${f.stableOn?'on':''}">Stabil</span><span class="end ${f.archiveOn?'on':''}">Archiv-reif</span></div>`:''}
    ${opt.text?`<div class="pf-text">${f.text}</div>`:''}</div>`;
}
// Die Regel hinter dem Pfad in zwei Saetzen (fuer das "?" im Detail)
function pfadRegelHTML(){const c=S.settings;
  return `<b>Stabil:</b> seit mindestens ${c.stableMinDays} Tagen dabei und die letzten ${c.stableWindow} Tage ohne Aussetzer. Dann ist Platz für eine neue Gewohnheit.<br>
    <b>Archiv-reif:</b> seit mindestens ${c.archiveMinDays} Tagen dabei und mindestens ${c.archivePct} % in den letzten ${c.archiveWindow} Tagen. Dann läuft sie von allein.<br>
    Entschuldigte Tage zählen nicht als Aussetzer.`;}
// Serie nach "nie zweimal auslassen", passend zum Rhythmus beschriftet
function serieInfo(h){const n=goalCurrent(h);
  const unit=h.schedule==='weekly'?(n===1?'Woche':'Wochen'):h.schedule==='monthly'?(n===1?'Monat':'Monate'):tageWort(n);
  return {n,unit,label:unit+' am Stück'};}
// Quote im Archiv-Fenster (Standard 30 Tage), entschuldigte Tage ausgenommen
function quoteInfo(h){const a=archiveInfo(h);return {pct:a.rate,window:a.window,label:`Quote · ${a.window} Tage`};}

// End-goal (milestone): "N periods in a row", period = day / week / month by rhythm.
function goalCurrent(h){
  if(h.schedule==='weekly')return weekStreak(h);
  if(h.schedule==='monthly')return monthStreak(h);
  return streak(h);
}
function goalUnit(h){
  if(h.schedule==='weekly')return h.goalN===1?'Woche in Folge':'Wochen in Folge';
  if(h.schedule==='monthly')return h.goalN===1?'Monat in Folge':'Monate in Folge';
  return 'Tage am Stück';
}
function goalMet(h){return !!(h.goalEnabled&&h.goalN>0&&goalCurrent(h)>=h.goalN);}
function goalProgress(h){if(!h.goalEnabled||!h.goalN)return null;return {cur:goalCurrent(h),total:h.goalN,unit:goalUnit(h)};}
function goalText(h){
  let base;
  if(h.schedule==='everyN')base=h.interval<=1?'Jeden Tag':('Alle '+h.interval+' Tage');
  else if(h.schedule==='weekly')base=`${h.weeklyTarget}× pro Woche`;
  else if(h.schedule==='monthly')base=`${h.monthlyTarget}× pro Monat`;
  else if(h.schedule==='weekdays')base=h.weekdays.length===7?'Jeden Tag':h.weekdays.slice().sort((a,b)=>a-b).map(i=>DAYS_SHORT[i]).join('·');
  else base='Jeden Tag';
  return base+(h.situations.length>1?` · ${h.situations.length} Situationen`:'');
}
function chipData(h){
  if(h.schedule==='weekly'){const g=weekGreens(h);return{txt:g+'/'+h.weeklyTarget,on:g>=h.weeklyTarget,icon:g>=h.weeklyTarget?'check':'week'};}
  if(h.schedule==='monthly'){const g=monthGreens(h,today());return{txt:g+'/'+h.monthlyTarget,on:g>=h.monthlyTarget,icon:g>=h.monthlyTarget?'check':'week'};}
  const st=streak(h);return{txt:st+(st===1?' Tag':' Tage'),on:st>0,icon:'flame'};
}

/* ---------- Celebration ---------- */
// Prueft Endziel, Stabil und Archiv-reif. Jeder Anlass feiert genau einmal
// (Merker am Habit); das Endziel darf nach einem Abbruch erneut gefeiert werden.
function maybeCelebrate(h){
  if(!h||h.archived)return;
  const q=[];
  if(h.goalEnabled&&h.goalN){
    if(goalMet(h)){if(!h.celebrated){h.celebrated=true;q.push('goal');}}
    else if(h.celebrated)h.celebrated=false;
  }
  if(!h.milestones)h.milestones={stable:false,archive:false};
  if(!h.milestones.stable&&isStable(h)){h.milestones.stable=true;q.push('stable');}
  if(!h.milestones.archive&&isArchiveReady(h)){h.milestones.archive=true;q.push('archive');}
  save();
  q.forEach(k=>celQueue.push({hid:h.id,kind:k}));
  if(q.length&&!celOpen)setTimeout(nextCelebration,320);   // erst das Tagesblatt zugehen lassen
}
const celQueue=[];let celOpen=false;
const celEl=document.getElementById('cel');
function nextCelebration(){
  const it=celQueue.shift();
  if(!it){celEl.classList.remove('show');celOpen=false;return;}
  const h=S.habits.find(x=>x.id===it.hid);if(!h){nextCelebration();return;}
  let kicker,title,text,btns;
  const later=`<button class="danger-btn" onclick="nextCelebration()">Weiter tracken</button>`;
  if(it.kind==='goal'){
    kicker='Ziel erreicht';title=`${h.goalN} ${goalUnit(h)}!`;
    const a=archiveInfo(h);
    text=`<b>${esc(h.name)}</b> – du hast durchgezogen. `+(a.met?'Sie ist jetzt auch Archiv-reif.':'Nächster Schritt: '+fortschritt(h).text+'.');
    btns=`<button class="primary" onclick="nextCelebration()">Weiter</button>`;
  }else if(it.kind==='stable'){
    kicker='Meilenstein';title='Stabil!';
    text=`<b>${esc(h.name)}</b> sitzt. Jetzt ist Platz für eine neue Gewohnheit.`;
    btns=`<button class="primary" onclick="nextCelebration();openIdeasTab()">Zu meinen Ideen</button>
      <button class="danger-btn" onclick="nextCelebration()">Später</button>`;
  }else{
    const a=archiveInfo(h);kicker='Meilenstein';title='Archiv-reif!';
    text=`<b>${esc(h.name)}</b> läuft von allein – seit ${a.days} Tagen dabei und ${a.rate}&nbsp;% in den letzten ${a.window} Tagen. Du kannst sie jetzt archivieren.`;
    btns=`<button class="primary" onclick="archiveHabit('${h.id}');nextCelebration()">Archivieren</button>${later}`;
  }
  document.getElementById('celCard').innerHTML=`
    <div class="cel-ico ${it.kind==='stable'?'stable':''}">${svgIcon(h.icon)}</div>
    <div class="cel-kicker">${kicker}</div><h2>${title}</h2><p>${text}</p>${btns}`;
  // Konfetti neu erzeugen, damit die Animation bei jedem Anlass wieder startet
  const cols=['var(--g1)','var(--g2)','var(--o1)','var(--o2)','var(--accent)','var(--r1)'];
  let conf='';
  for(let i=0;i<42;i++){
    conf+=`<i style="left:${(Math.random()*100).toFixed(1)}%;background:${cols[i%cols.length]};
      --del:${(Math.random()*.6).toFixed(2)}s;--dur:${(2.1+Math.random()*1.4).toFixed(2)}s;
      --dx:${Math.round(Math.random()*160-80)}px;--rot:${Math.round(Math.random()*900-450)}deg;
      ${i%3===0?'border-radius:50%;width:8px;height:8px;':''}"></i>`;
  }
  document.getElementById('confetti').innerHTML=conf;
  celEl.classList.remove('show');void celEl.offsetWidth;celEl.classList.add('show');celOpen=true;
}
function archiveHabit(hid){
  const h=S.habits.find(x=>x.id===hid);if(!h)return;
  h.archived=true;h.archivedAt=todayStr();h.check=newCheck(h.archivedAt);save();hideSheet();renderTrack();
  if(activeView()==='ideas')renderIdeas();
  toast('Ins Archiv gelegt');
}
function unarchiveHabit(hid){
  const h=S.habits.find(x=>x.id===hid);if(!h)return;
  h.archived=false;h.archivedAt=null;h.check=null;save();hideSheet();renderIdeas();toast('Wieder aktiv');
}

/* ---------- Rueckfrage zu archivierten Gewohnheiten ----------
   Archiviert heisst nicht vergessen: in immer groesseren Abstaenden (CHECK_GAPS)
   fragt die App einmal nach, ob die Gewohnheit noch von allein laeuft. "Ja" verschiebt
   die naechste Frage, "Nein" holt die Gewohnheit zurueck ins Tracking. */
function newCheck(fromStr){
  let due=ds(addDays(parse(fromStr||todayStr()),CHECK_GAPS[0]));
  const tomorrow=ds(addDays(today(),1));
  if(due<tomorrow)due=tomorrow;          // schon laenger archiviert: fruehestens morgen fragen
  return {n:0,due,off:false};
}
function nextCheckDue(n){return ds(addDays(today(),CHECK_GAPS[Math.min(n,CHECK_GAPS.length-1)]));}
function daysArchived(h){return Math.max(1,Math.round((today()-parse(h.archivedAt||todayStr()))/86400000));}
// die aelteste faellige Rueckfrage - es wird immer nur eine auf einmal gezeigt
function dueRecall(){const t=todayStr();
  return S.habits.filter(h=>h.archived&&h.check&&!h.check.off&&h.check.due<=t)
    .sort((a,b)=>a.check.due.localeCompare(b.check.due))[0]||null;}
function recallCardHTML(){

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function dayBlend(g,o,r){
  if(!(g+o+r))return '';
  // Each tracked status contributes its own light->dark band, laid out
  // green -> orange -> red. Orange is always part of the transition: when a
  // day has green and red but no orange, a small orange bridge is inserted
  // between them so the gradient flows through orange instead of jumping.
  const seq=[];
  if(g)seq.push(['var(--g1)','var(--g2)',g]);
  if(o)seq.push(['var(--o1)','var(--o2)',o]);
  else if(g&&r)seq.push(['var(--o1)','var(--o2)',Math.max(1,(g+r)/5)]);
  if(r)seq.push(['var(--r1)','var(--r2)',r]);
  const total=seq.reduce((s,x)=>s+x[2],0);
  let acc=0;const stops=[];
  seq.forEach(([c1,c2,n])=>{const s0=(acc/total*100).toFixed(1),s1=((acc+n)/total*100).toFixed(1);
    stops.push(c1+' '+s0+'%');stops.push(c2+' '+s1+'%');acc+=n;});
  return 'linear-gradient(90deg,'+stops.join(',')+')';
}
// Wieviel ist an einem Tag schon entschieden? Basis fuer "Dein Tag" und fuer die
// Rueckmeldung an den Push-Server (stuendliche Nacherinnerung).
function dayCounts(dStr){
  const d=parse(dStr);let total=0,tracked=0,g=0,o=0,r=0;
  activeHabits().forEach(h=>{const due=dueOnDate(h,d);
    h.situations.forEach(s=>{const v=getE(h.id,s.id,dStr);
      if(!due&&!v)return;              // flexible habit (Woche/Monat) not tracked that day → ignore
      total++;
      if(v){tracked++;if(v==='g')g++;else if(v==='o')o++;else r++;}});});
  return {total,tracked,g,o,r};
}
// Tag komplett: jede faellige Situation ist entschieden (gruen, orange oder rot)
function dayComplete(dStr){const c=dayCounts(dStr);return c.tracked>=c.total;}
function todayCardHTML(){
  const {total,tracked,g,o,r}=dayCounts(todayStr());
  if(total===0)return `<div class="today-card"><div class="tc-head"><span class="tc-title">Dein Tag</span></div>
    <div class="tc-empty">Für heute ist nichts geplant. Genieß den Tag.</div></div>`;
  const pct=(tracked/total*100);
  const blend=dayBlend(g,o,r);
  return `<div class="today-card">
    <div class="tc-head"><span class="tc-title">Dein Tag</span><span class="tc-count">${tracked}/${total}</span></div>
    <div class="tc-bar"><i style="width:${pct}%;background:${blend||'var(--surface-2)'}"></i></div></div>`;
}

function todayListHTML(dStr,viewDate,now){
  const isFuture=viewDate>now&&dStr!==todayStr();
  const isToday=dStr===todayStr();
  const dis=isFuture?'disabled':'';
  const shown=h=>dueOnDate(h,viewDate)||h.situations.some(s=>getE(h.id,s.id,dStr)!==undefined);
  let rows='',cards='';
  S.groups.forEach(g=>{
    const {due}=groupDayCounts(g,dStr);
    if(!due)return;
    // Gruppenfeld: ein Segment je faelliger Gewohnheit, ohne Zahlen
    const segs=groupHabits(g).filter(h=>isSchedDay(h,parse(dStr))).map(h=>{
      const st=dayFull(h,dStr);return `<i class="${st==='g'||st==='o'||st==='r'?st:''}"></i>`;}).join('');
    // jede Gruppe ist eine eigene Karte mit farbig abgesetzter Kopfzeile
    cards+=`<div class="tlist tgroup ${g.collapsed?'closed':''}"><div class="trow tghead">
      <button class="tchev" onclick="toggleGroup('${g.id}')"
        aria-label="${g.collapsed?'Gruppe aufklappen':'Gruppe zuklappen'}">
        <svg class="mchev ${g.collapsed?'':'open'}" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="trow-open" onclick="openGroupEditor('${g.id}')" aria-label="${esc(g.name)} bearbeiten">
        <div class="ico-tile">${svgIcon(g.icon)}</div>
        <div class="tname"><div class="n"><span>${esc(g.name)}</span></div></div>
      </button>
      <button class="tstatus" ${dis} onclick="openGroupDay('${g.id}','${dStr}')" aria-label="${esc(g.name)} tracken">${segs}</button>
    </div>`;
    if(!g.collapsed)groupHabits(g).filter(shown).forEach(h=>{cards+=todayHabitRowHTML(h,dStr,dis,false,isToday);});
    cards+=`</div>`;
  });
  ungroupedHabits().filter(shown).forEach(h=>{rows+=todayHabitRowHTML(h,dStr,dis,false,isToday);});
  if(!rows&&!cards)return `<div class="tlist"><div class="tempty">Für diesen Tag ist nichts geplant.</div></div>`;
  return cards+(rows?`<div class="tlist">${rows}</div>`:'');
}

/* ---------- Groups ---------- */
// how many members are due on `date`, and how many of those are settled (green or excused)
function groupDayCounts(g,date){
  let due=0,done=0;
  groupHabits(g).forEach(h=>{
    if(!isSchedDay(h,parse(date)))return;
    due++;const st=dayFull(h,date);if(st==='g'||st==='o')done++;
  });
  return {due,done};
}
function groupRowHTML(g,mon,tStr,now){
  const hs=groupHabits(g);
  let cells='';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i);const date=ds(d);
    const isToday=date===tStr;const isFuture=d>now&&!isToday;
    let segs='';
    hs.forEach(h=>{
      const st=isSchedDay(h,d)?dayFull(h,date):undefined;
      segs+=`<div class="mseg ${st==='g'||st==='o'||st==='r'?st:''}"></div>`;
    });
    if(!hs.length)segs='<div class="mseg"></div>';
    cells+=`<button class="mcell ${isToday?'today':''} ${isFuture?'future':''}"
      ${isFuture?'disabled':''} onclick="openGroupDay('${g.id}','${date}')" aria-label="${esc(g.name)} ${d.getDate()}.">${segs}</button>`;
  }
  let out=`<div class="mgrid mrow grp">
    <button onclick="toggleGroup('${g.id}')" aria-label="${g.collapsed?'Gruppe aufklappen':'Gruppe zuklappen'}"
      style="width:16px;height:16px;display:flex;align-items:center;justify-content:center">
      <svg class="mchev ${g.collapsed?'':'open'}" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="mname" onclick="openGroupEditor('${g.id}')" aria-label="${esc(g.name)} bearbeiten">
      <div class="ico-tile">${svgIcon(g.icon)}</div><span>${esc(g.name)}</span>
    </button>
    ${cells}
    <div></div>
  </div>`;
  if(!g.collapsed)hs.forEach(h=>{out+=habitRowHTML(h,mon,tStr,now,true);});
  return out;
}
function toggleGroup(gid){const g=S.groups.find(x=>x.id===gid);if(!g)return;
  g.collapsed=!g.collapsed;save();renderTrack();}
// One tap: mark every member that is due today as done. Tapping again undoes
// exactly the entries this tap created, leaving anything pre-existing alone.
function quickCheckGroup(gid){
  const g=S.groups.find(x=>x.id===gid);if(!g)return;
  const date=todayStr();const touched=[];
  if(g.lastQuick&&g.lastQuick.date===date&&g.lastQuick.entries.length){
    g.lastQuick.entries.forEach(e=>setE(e.hid,e.sid,date,undefined));
    g.lastQuick=null;save();renderTrack();toast('Zurückgenommen');return;
  }
  groupHabits(g).forEach(h=>{
    if(!isSchedDay(h,today()))return;
    h.situations.forEach(s=>{
      if(getE(h.id,s.id,date)===undefined){setE(h.id,s.id,date,'g');touched.push({hid:h.id,sid:s.id});}
    });
  });
  g.lastQuick={date,entries:touched};save();renderTrack();
  groupHabits(g).forEach(maybeCelebrate);
  toast(touched.length?'Gruppe erledigt 🌱':'War schon erledigt');
}
let curGroupDay=null;
function openGroupDay(gid,date){
  const g=S.groups.find(x=>x.id===gid);if(!g)return;
  if(parse(date)>today()&&date!==todayStr())return;
  curGroupDay={gid,date};curDay=null;
  document.getElementById('sheetTitle').textContent=g.name;
  let body=`<div class="de-date">${fmtLong(parse(date))}</div>
    <button class="bulk-btn main" onclick="bulkSet('${gid}','${date}','g')">Alles erledigt</button>
    <div class="bulk-row">
      <button class="bulk-btn" onclick="bulkSet('${gid}','${date}','o')">Alles entschuldigt</button>
      <button class="bulk-btn" onclick="bulkSet('${gid}','${date}',null)">Zurücksetzen</button>
    </div>`;
  const hs=groupHabits(g);
  if(!hs.length)body+=`<div class="hint" style="margin-top:14px">Diese Gruppe enthält noch keine Gewohnheiten.</div>`;
  hs.forEach(h=>{
    const off=!isSchedDay(h,parse(date));
    h.situations.forEach(s=>{
      const v=getE(h.id,s.id,date);
      const label=h.situations.length>1?`${esc(h.name)} · ${esc(s.name)}`:esc(h.name);
      body+=`<div class="sit-row"><div class="sn">${label}${off?' <span class="off">nicht fällig</span>':''}</div>
        <div class="choices">${cBtn('r','Nicht',v,h.id,s.id,date)}${cBtn('o','Entschuldigt',v,h.id,s.id,date)}${cBtn('g','Erledigt',v,h.id,s.id,date)}</div></div>`;
    });
  });
  document.getElementById('sheetBody').innerHTML=body;showSheet();

function bulkSet(gid,date,val){
  const g=S.groups.find(x=>x.id===gid);if(!g)return;
  groupHabits(g).forEach(h=>{
    if(val!==null&&!isSchedDay(h,parse(date)))return;   // skip members not due that day
    h.situations.forEach(s=>setE(h.id,s.id,date,val||undefined));
  });
  if(val==='g')g.lastQuick=null;                        // manual bulk supersedes the quick-tap undo
  save();renderTrack();openGroupDay(gid,date);
  groupHabits(g).forEach(maybeCelebrate);

    body+=`<div class="sit-row">${h.situations.length>1?`<div class="sn">${esc(s.name)}</div>`:''}
      <div class="choices">
        ${cBtn('r','Nicht',v,hid,s.id,date)}${cBtn('o','Entschuldigt',v,hid,s.id,date)}${cBtn('g','Erledigt',v,hid,s.id,date)}
      </div></div>`;});
  body+=`<button class="clear-day" onclick="clearDay()">Eintrag zurücksetzen</button>`;

function cBtn(val,label,cur,hid,sid,date){
  const cls={r:'r',o:'o',g:'g'}[val];
  return `<button class="choice ${cur===val?'sel':''}" onclick="pick('${hid}','${sid}','${date}','${val}',this)">
    <div class="sw ${cls}"></div><div class="cl">${label}</div></button>`;
}
function pick(hid,sid,date,val,btn){
  const cur=getE(hid,sid,date);
  setE(hid,sid,date,cur===val?undefined:val);
  const row=btn.closest('.sit-row');
  row.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel'));
  if(getE(hid,sid,date))btn.classList.add('sel');
  const h=S.habits.find(x=>x.id===hid);
  renderTrack();
  const av=document.querySelector('.nav-item.active').dataset.view;if(av==='stats')renderStats();
  maybeCelebrate(h);
  // Ist fuer diesen Tag alles entschieden, schliesst sich das Blatt von selbst.
  // Kurz verzoegert, damit die getroffene Auswahl noch sichtbar aufleuchtet.
  if(dayFullyDecided(date))setTimeout(hideSheet,280);
}
// Alle faelligen Situationen des offenen Tagesblatts entschieden?
// Gilt fuer das Einzel-Blatt (curDay) wie fuer das Gruppen-Blatt (curGroupDay).
function dayFullyDecided(date){
  let hs;
  if(curGroupDay&&curGroupDay.date===date){
    const g=S.groups.find(x=>x.id===curGroupDay.gid);if(!g)return false;
    hs=groupHabits(g).filter(x=>isSchedDay(x,parse(date)));
  }else if(curDay&&curDay.date===date){
    const h=S.habits.find(x=>x.id===curDay.hid);if(!h)return false;
    hs=[h];
  }else return false;
  if(!hs.length)return false;
  return hs.every(x=>x.situations.every(s=>getE(x.id,s.id,date)!==undefined));
}
function clearDay(){const h=S.habits.find(x=>x.id===curDay.hid);
  h.situations.forEach(s=>setE(curDay.hid,s.id,curDay.date,undefined));
  hideSheet();renderTrack();toast('Zurückgesetzt');}

/* ---------- Notiz & Ablauf ----------
   Zeilen, die mit "-" (oder "•") anfangen, werden als Ablauf-Liste angezeigt - bewusst
   ohne Haken: der Ablauf ist eine Gedaechtnisstuetze, keine zusaetzliche Tracking-Ebene. */
const STEP_RE=/^\s*[-–—•*]\s*(\S.*)$/;
function noteLabel(note){
  const lines=String(note||'').split('\n');
  const steps=lines.some(l=>STEP_RE.test(l)),text=lines.some(l=>l.trim()&&!STEP_RE.test(l));
  return steps&&text?'Notiz & Ablauf':steps?'Ablauf':'Notiz';
}
function noteHTML(note){
  let html='',list=[];
  const flush=()=>{if(list.length){html+='<ul class="note-list">'+list.map(t=>`<li>${esc(t)}</li>`).join('')+'</ul>';list=[];}};
  String(note||'').split('\n').forEach(l=>{
    const m=l.match(STEP_RE);
    if(m){list.push(m[1].trim());return;}
    flush();if(l.trim())html+=`<p>${esc(l)}</p>`;
  });
  flush();return html;
}
// beim Zeilenumbruch in einer "- "-Zeile geht die Liste weiter; Enter auf leerer "- "-Zeile beendet sie
function noteKey(e,ta){
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  const v=ta.value,pos=ta.selectionStart;if(pos!==ta.selectionEnd)return;
  const ls=v.lastIndexOf('\n',pos-1)+1;
  const m=v.slice(ls,pos).match(/^(\s*[-–—•*]\s+)(.*)$/);if(!m)return;
  e.preventDefault();
  if(!m[2].trim()){ta.value=v.slice(0,ls)+v.slice(pos);ta.selectionStart=ta.selectionEnd=ls;}
  else{const ins='\n'+m[1];ta.value=v.slice(0,pos)+ins+v.slice(pos);ta.selectionStart=ta.selectionEnd=pos+ins.length;}
  draft.note=ta.value;
}

      <div class="val">${d.weeklyTarget}</div><div class="unit">mal pro Woche</div>
      <button style="margin-left:auto" onclick="draft.weeklyTarget=Math.min(7,draft.weeklyTarget+1);renderEditor()">+</button></div>`;

      <button onclick="draft.monthlyTarget=Math.max(1,draft.monthlyTarget-1);renderEditor()">−</button>
      <div class="val">${d.monthlyTarget}</div><div class="unit">mal pro Monat</div>
      <button style="margin-left:auto" onclick="draft.monthlyTarget=Math.min(28,draft.monthlyTarget+1);renderEditor()">+</button></div>`;
  }

  // --- End-goal control ---

  const goalCtrl=d.goalEnabled?`
    <div style="margin-top:13px" class="stepper">
      <button onclick="draft.goalN=Math.max(1,draft.goalN-1);renderEditor()">−</button>
      <div class="val">${d.goalN}</div><div class="unit">${gUnit}</div>

    <div class="hint" style="margin-top:8px">🎉 Du bekommst eine kleine Feier, sobald du das erreichst – danach läuft der Habit normal weiter. Einmal Auslassen ist okay, erst zweimal hintereinander setzt die Serie zurück.</div>`:'';

  // archivierte Gewohnheit: nur Name, Notiz/Ablauf und Symbol - Rhythmus & Tracking ruhen
  const arch=!!d.archived;

  const noteField=`<div class="field"><label>Notiz & Ablauf</label>

        oninput="draft.note=this.value" onkeydown="noteKey(event,this)">${esc(d.note)}</textarea>
      <div class="hint">Zeilen mit „-" am Anfang werden zur Ablauf-Liste – z. B. die einzelnen Schritte deiner Routine.</div></div>`;
  if(arch){
    document.getElementById('sheetBody').innerHTML=`

      <input class="inp" value="${esc(d.name)}" placeholder="z. B. Meditieren" oninput="draft.name=this.value"></div>

function setSchedule(v){draft.schedule=v;
  if(v==='weekdays'&&!draft.weekdays.length)draft.weekdays=[0,1,2,3,4];
  if(v==='everyN'){if(!draft.interval||draft.interval<2)draft.interval=2;draft.startDate=todayStr();}
  renderEditor();}
function toggleWd(i){const a=draft.weekdays;const idx=a.indexOf(i);if(idx>=0)a.splice(idx,1);else a.push(i);renderEditor();}
function saveHabit(){
  const d=draft;if(!d.name.trim()){toast('Bitte einen Namen eingeben');return;}
  if(d.schedule==='weekdays'&&!d.weekdays.length){toast('Bitte Wochentage wählen');return;}
  d.situations=d.situations.filter((s,i)=>s.name.trim()||d.situations.length===1);
  d.situations.forEach((s,i)=>{if(!s.name.trim())s.name=d.situations.length>1?('Situation '+(i+1)):'Standard';});
  d.note=String(d.note||'').replace(/\s+$/,'');
  const isNew=!d.id;
  if(d._fromIdea){S.ideas=S.ideas.filter(i=>i.id!==d._fromIdea);delete d._fromIdea;}
  if(!isNew){const idx=S.habits.findIndex(x=>x.id===d.id);S.habits[idx]=d;}
  else{d.id=uid();S.habits.push(d);}
  d.celebrated=goalMet(d);   // avoid re-celebrating an already-met goal on the next check
  if(d.archived){save();if(activeView()==='ideas')renderIdeas();openArchived(d.id);toast('Gespeichert');return;}
  save();hideSheet();renderTrack();toast(isNew?'Angelegt':'Gespeichert');
}
function deleteHabit(){deleteHabitById(draft.id);}
function deleteHabitById(id){if(!confirm('Diese Gewohnheit und alle Einträge endgültig löschen?'))return;
  S.habits=S.habits.filter(x=>x.id!==id);delete S.entries[id];
  S.groups.forEach(g=>{g.habitIds=g.habitIds.filter(x=>x!==id);});
  save();hideSheet();renderTrack();if(activeView()==='ideas')renderIdeas();toast('Gelöscht');}

/* Sortieren per Ziehen am Griff (Pointer-Events: Touch + Maus), auch zwischen Abschnitten */
let drag=null;
function ideaDragStart(e){
  const card=e.target.closest('.idea-card');if(!card)return;
  e.preventDefault();e.stopPropagation();
  if(drag)ideaDragEnd();
  card.classList.add('dragging');
  drag={card};
  // auf window lauschen: das Loslassen kommt auch an, wenn der Finger den Griff verlassen hat
  addEventListener('pointermove',ideaDragMove,{passive:false});
  addEventListener('pointerup',ideaDragEnd);addEventListener('pointercancel',ideaDragEnd);
}
function ideaDragMove(e){
  if(!drag)return;e.preventDefault();const y=e.clientY;
  // Zielabschnitt: der, dessen Bereich (Kopf + Liste) die Fingerposition enthaelt
  const secs=[...document.querySelectorAll('#view-ideas .isec')];
  let sec=secs.find(sc=>{const r=sc.getBoundingClientRect();return y>=r.top&&y<=r.bottom;});
  if(!sec)sec=y<secs[0].getBoundingClientRect().top?secs[0]:secs[secs.length-1];
  const list=sec.querySelector('.ilist');
  if(list.hidden){list.hidden=false;S.settings.ideaCollapsed[sec.dataset.prio]=false;
    const ch=sec.querySelector('.mchev');if(ch)ch.classList.add('open');}
  const ph=list.querySelector('.idrop');if(ph)ph.remove();
  const others=[...list.querySelectorAll('.idea-card')].filter(c=>c!==drag.card);
  const before=others.find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2;});
  if(before){if(before.previousElementSibling!==drag.card)list.insertBefore(drag.card,before);}
  else if(list.lastElementChild!==drag.card)list.appendChild(drag.card);
  // am Rand mitscrollen
  const sc=document.querySelector('.scroll');
  if(y<90)sc.scrollTop-=10;else if(y>innerHeight-140)sc.scrollTop+=10;
}
function ideaDragEnd(){
  if(!drag)return;const {card}=drag;
  removeEventListener('pointermove',ideaDragMove);
  removeEventListener('pointerup',ideaDragEnd);removeEventListener('pointercancel',ideaDragEnd);
  card.classList.remove('dragging');
  // neue Reihenfolge + Wichtigkeit direkt aus dem DOM uebernehmen
  const byId=Object.fromEntries(S.ideas.map(i=>[i.id,i]));const next=[];
  document.querySelectorAll('#view-ideas .ilist').forEach(l=>{
    l.querySelectorAll('.idea-card').forEach(c=>{const i=byId[c.dataset.id];if(i){i.prio=l.dataset.prio;next.push(i);}});});
  if(next.length===S.ideas.length)S.ideas=next;
  drag=null;save();renderIdeas();
}

function lifeRate(h){let g=0,r=0;const start=habitStart(h);const end=h.archivedAt?parse(h.archivedAt):today();
  for(let d=new Date(start);d<=end;d=addDays(d,1)){if(!isSchedDay(h,d))continue;const st=dayFull(h,ds(d));

function monthAgg(habits,date){let anyR=false,anyG=false,anyO=false,any=false;
  habits.forEach(h=>{const st=dayFull(h,date);if(st){any=true;if(st==='r')anyR=true;else if(st==='g')anyG=true;else anyO=true;}});
  if(!any)return undefined;if(anyG)return 'g';if(anyR)return 'r';if(anyO)return 'o';}
function renderMonth(calHabit){
  const habits=calHabit?[calHabit]:activeHabits();

  const first=new Date(y,m,1);const startBlank=wd(first);const days=new Date(y,m+1,0).getDate();

    cells+=`<div class="mc ${st?'filled':''} ${isT?'tdy':''}">${st?`<div class="sg ${st}"></div>`:''}<div class="num">${dn}</div></div>`;}

}
// Verlauf als Wochenspalten (Mo oben, So unten), beginnt in der Startwoche der Gewohnheit.
// Mindestens 13, hoechstens 53 Wochen - so bleibt kein Jahr leerer Kaestchen stehen.
function renderYear(h){
  const t=today();const end=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  const weeks=Math.min(53,Math.max(13,Math.ceil((end-mondayOf(habitStart(h)))/86400000/7+.01)));
  const mon=addDays(mondayOf(end),-(weeks-1)*7);let cells='';
  for(let i=0;i<weeks*7;i++){const d=addDays(mon,i);
    if(d>end){cells+=`<div class="yc off"></div>`;continue;}
    const st=dayFull(h,ds(d));cells+=`<div class="yc ${st==='g'||st==='o'||st==='r'?st:''}"></div>`;}
  return `<div class="stat-card verlauf"><div class="vl-head"><span>Verlauf</span><span>seit ${fmtShort(habitStart(h)).replace(/\.$/,'')}</span></div>
    <div class="year-grid" style="grid-template-columns:repeat(${weeks},minmax(0,1fr))">${cells}</div></div>`;
}

// Schwellen aendern; neu erreichte Meilensteine werden erst beim naechsten Tracken gefeiert
function stepMs(k,d,mn,mx){S.settings[k]=Math.min(mx,Math.max(mn,S.settings[k]+d));save();renderSettings();}

/* ---------- Taegliche Push-Erinnerung (Cloudflare Worker, siehe push-worker/) ---------- */
const WORKER_URL='https://cadence-push.timborelloeggers.workers.dev';
const PUSH_URL=PREVIEW?'':WORKER_URL;        // Worker-Adresse, z. B. https://cadence-push.<name>.workers.dev
const VAPID_PUBLIC='BF1gxpC5xCgus-L5z7ssTgds6Iz5z4ySpZHWJjvgsNO1qxgVg-rWHHlomRcLgym_YsS0sDK1u6PwD_UpGA8KMws';    // oeffentlicher VAPID-Schluessel (base64url)
function isStandalone(){return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;}
function b64uToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');const pad='='.repeat((4-s.length%4)%4);
  const bin=atob(s+pad);return Uint8Array.from(bin,c=>c.charCodeAt(0));}
function pushId(){if(!S.settings.push.id){S.settings.push.id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));save();}
  return S.settings.push.id;}
async function pushApi(path,body,keepalive){
  // Vorschau: nur das Lesen einer Sicherung ist erlaubt - nichts wird hochgeladen oder angemeldet
  const base=PUSH_URL||(PREVIEW&&path==='/restore'?WORKER_URL:'');
  if(!base)throw new Error('Vorschau: kein Netz');
  const r=await fetch(base.replace(/\/$/,'')+path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),keepalive:!!keepalive});
  if(!r.ok)throw new Error('HTTP '+r.status);return r;}
function togglePush(){if(S.settings.push.enabled)disablePush();else enablePush();}
async function enablePush(){
  if(!PUSH_URL||!VAPID_PUBLIC){toast('Push-Server ist noch nicht eingerichtet');return;}
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)||!isStandalone()){
    toast('Nur in der App vom Homescreen möglich');return;}
  // iOS: die Erlaubnis-Abfrage muss direkt aus dem Tippen kommen - daher als erstes
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('Mitteilungen sind nicht erlaubt');return;}
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(VAPID_PUBLIC)});
    await pushApi('/subscribe',pushBody(sub));
    S.settings.push.enabled=true;save();renderSettings();toast('Erinnerung aktiv – täglich um '+S.settings.push.time);
  }catch(e){toast('Hat nicht geklappt – bitte später nochmal');}
}
async function disablePush(){
  S.settings.push.enabled=false;save();renderSettings();
  try{await pushApi('/unsubscribe',{id:pushId()});
    const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
    if(sub)await sub.unsubscribe();}catch(e){}
  toast('Erinnerung aus');
}
async function setPushTime(v){
  if(!v)return;S.settings.push.time=v;save();
  if(!S.settings.push.enabled)return;
  try{await pushSync();toast('Erinnerung jetzt um '+v);}catch(e){toast('Uhrzeit konnte nicht übertragen werden');}
}
async function testPush(){try{await pushApi('/test',{id:pushId()});toast('Test ist unterwegs');}catch(e){toast('Test fehlgeschlagen');}}

/* ---------- Stuendliche Nacherinnerung ----------
   Der Server schickt nach der taeglichen Erinnerung stuendlich nach, solange der Tag
   nicht komplett getrackt ist. Damit er das weiss, meldet die App ihm (und nur ihm),
   welche Tage fertig sind - keine Inhalte, nur Datum + "erledigt". */
function pushBody(sub){const pu=S.settings.push;
  return {id:pushId(),subscription:sub.toJSON(),time:pu.time,repeat:!!pu.repeat,repeatMax:pu.repeatMax,
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone};}
// aktuelle Einstellungen zum Server schicken (nur sinnvoll, wenn die Erinnerung an ist)
async function pushSync(){
  if(!S.settings.push.enabled)return;
  const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
  if(!sub)throw new Error('kein Abo');
  await pushApi('/subscribe',pushBody(sub));
  statusKey='';await pushStatus();
}
function toggleRepeat(){const pu=S.settings.push;pu.repeat=!pu.repeat;save();renderSettings();
  if(!pu.enabled){toast(pu.repeat?'Gilt, sobald die Erinnerung an ist':'Nacherinnerungen aus');return;}
  pushSync().then(()=>toast(pu.repeat?'Nacherinnerungen an':'Nacherinnerungen aus'))
    .catch(()=>toast('Nicht übertragen – bist du online?'));}
function stepRepeatMax(d){const pu=S.settings.push;
  pu.repeatMax=Math.min(12,Math.max(1,(pu.repeatMax||6)+d));save();renderSettings();
  clearTimeout(stepRepeatMax.t);stepRepeatMax.t=setTimeout(()=>{pushSync().catch(()=>{});},900);}
// Tage, die komplett getrackt sind (heute und gestern - nachts wird oft noch nachgetragen)
function doneDates(){return [todayStr(),ds(addDays(today(),-1))].filter(dayComplete);}
let statusKey='';
function queueStatus(){clearTimeout(queueStatus.t);queueStatus.t=setTimeout(()=>pushStatus(),2500);}
async function pushStatus(keepalive){
  const pu=S.settings.push;
  if(!PUSH_URL||!pu||!pu.enabled||!pu.repeat||!pu.id)return;
  const k=doneDates().join(',');
  if(k===statusKey)return;
  statusKey=k;
  try{await pushApi('/status',{id:pushId(),done:k?k.split(','):[]},keepalive);}catch(e){statusKey='';}
}
// offene Erinnerungen wegraeumen, sobald die App vorn ist
async function clearNotifs(){try{const reg=await navigator.serviceWorker.getRegistration();
  if(!reg||!reg.getNotifications)return;(await reg.getNotifications()).forEach(n=>n.close());}catch(e){}}

/* ---------- Automatische Online-Sicherung ----------
   Laeuft ueber denselben Worker. Die Daten werden auf dem Geraet mit AES-GCM verschluesselt;
   Schluessel und Speicher-Id werden aus dem Wiederherstellungs-Code abgeleitet, der nie das
   Geraet verlaesst. Gesichert wird kurz nach Aenderungen, beim Wegwischen der App und
   beim Start, falls die letzte Sicherung aelter als 20 Stunden ist. */
const CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 32 Zeichen, ohne I/O/0/1
function newBackupCode(){const b=crypto.getRandomValues(new Uint8Array(24));
  return [...b].map(x=>CODE_ABC[x&31]).join('').match(/.{4}/g).join('-');}
function normCode(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function fmtCode(c){return (normCode(c).match(/.{1,4}/g)||[]).join('-');}
function toB64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function sha256(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));}
async function codeParts(code){const c=normCode(code);
  const id=[...(await sha256('cadence-id:'+c)).slice(0,16)].map(x=>x.toString(16).padStart(2,'0')).join('');
  const key=await crypto.subtle.importKey('raw',await sha256('cadence-key:'+c),'AES-GCM',false,['encrypt','decrypt']);
  return {id,key};}
function backupState(){if(!S.settings.backup||!S.settings.backup.code){S.settings.backup={code:newBackupCode(),last:null};save();}
  return S.settings.backup;}
// von save() aufgerufen: Aenderung merken und gebuendelt sichern
function markDirty(){markDirty.dirty=true;clearTimeout(markDirty.t);markDirty.t=setTimeout(()=>doBackup(false),20000);}
async function doBackup(manual,keepalive){
  if(!PUSH_URL||!window.crypto||!crypto.subtle){if(manual)toast('Sicherung hier nicht möglich');return;}
  if(doBackup.busy)return;doBackup.busy=true;
  const bk=backupState();markDirty.dirty=false;
  try{
    const {id,key}=await codeParts(bk.code);const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(S))));
    await pushApi('/backup',{id,backup:{iv:toB64(iv),ct:toB64(ct)}},keepalive);
    bk.last=new Date().toISOString();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}   // direkt schreiben: soll keine neue Sicherung ausloesen
    if(manual)toast('Gesichert');
    if(activeView()==='settings')renderSettings();
  }catch(e){markDirty.dirty=true;if(manual)toast('Sicherung fehlgeschlagen – bist du online?');}
  doBackup.busy=false;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&markDirty.dirty){clearTimeout(markDirty.t);doBackup(false,true);}});
function fmtWhen(iso){if(!iso)return 'noch nie';const d=new Date(iso);
  const t=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  if(ds(d)===todayStr())return 'heute, '+t;if(ds(d)===ds(addDays(today(),-1)))return 'gestern, '+t;
  return d.toLocaleDateString('de-DE',{day:'numeric',month:'short'})+', '+t;}
function openBackupCode(){const bk=backupState();
  document.getElementById('sheetTitle').textContent='Wiederherstellungs-Code';
  document.getElementById('sheetBody').innerHTML=`
    <div class="note-box" style="font-size:19px;font-weight:800;letter-spacing:.06em;text-align:center;padding:16px;white-space:normal;word-break:break-all">${bk.code}</div>
    <div class="hint" style="font-size:13px;line-height:1.5;color:var(--ink-soft);margin-bottom:6px">Mit diesem Code holst du deine Daten zurück, z. B. auf einem neuen iPhone.
      <b>Speicher ihn z. B. in deinen Notizen oder im Passwort-Manager.</b> Ohne den Code kann niemand die Sicherung öffnen – auch du nicht.</div>
    <button class="primary" onclick="copyBackupCode()">Code kopieren</button>

  showSheet();}
async function copyBackupCode(){try{await navigator.clipboard.writeText(backupState().code);toast('Kopiert');}catch(e){toast('Kopieren nicht möglich – bitte abschreiben');}}
function openRestore(){
  document.getElementById('sheetTitle').textContent='Wiederherstellen';
  document.getElementById('sheetBody').innerHTML=`
    <div class="hint" style="font-size:13px;line-height:1.5;color:var(--ink-soft);margin:0 0 14px">Gib den Wiederherstellungs-Code deiner Sicherung ein.
      <b>Die Daten auf diesem Gerät werden dabei ersetzt.</b></div>
    <div class="field"><input id="restoreCode" class="inp" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" spellcheck="false"
      style="text-transform:uppercase;letter-spacing:.05em;font-weight:700"></div>
    <button class="primary" onclick="restoreFromCode()">Sicherung laden</button>`;

async function restoreFromCode(){
  const inp=document.getElementById('restoreCode');const c=normCode(inp&&inp.value);
  if(c.length!==24){toast('Der Code hat 24 Zeichen');return;}
  try{
    const {id,key}=await codeParts(c);
    const j=await (await pushApi('/restore',{id})).json();
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(j.backup.iv)},key,fromB64(j.backup.ct));
    const data=JSON.parse(new TextDecoder().decode(pt));
    const n=(data.habits||[]).length;
    if(!confirm(`Sicherung von ${fmtWhen(j.backup.at)} mit ${n} ${n===1?'Gewohnheit':'Gewohnheiten'} gefunden.\n\nDaten auf diesem Gerät dadurch ersetzen?`))return;
    data.settings=data.settings||{};
    data.settings.backup={code:fmtCode(c),last:j.backup.at};
    if(data.settings.push)data.settings.push.enabled=false;   // Erinnerung auf dem neuen Geraet neu einschalten
    localStorage.setItem(KEY,JSON.stringify(data));
    location.reload();
  }catch(e){toast(String(e&&e.message).includes('404')?'Zu diesem Code gibt es keine Sicherung':'Wiederherstellen fehlgeschlagen');}
}

function exportData(){try{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='cadence-backup.json';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Exportiert');}catch(e){toast('Export hier nicht möglich')}}
function resetData(){if(!confirm('Wirklich ALLE Gewohnheiten und Einträge löschen?'))return;
  S=JSON.parse(JSON.stringify(DEFAULT));save();applyTheme();renderAll();renderSettings();toast('Zurückgesetzt');}

/* ---------- Sheet ---------- */
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet');
function showSheet(){scrim.classList.add('show');sheet.classList.add('show');}
function hideSheet(){scrim.classList.remove('show');sheet.classList.remove('show');}
scrim.addEventListener('click',hideSheet);
document.getElementById('sheetClose').addEventListener('click',hideSheet);

/* ---------- Nav ---------- */
const titles={track:['Heute',()=>fmtLong(today())],stats:['Statistik',()=>'Deine Fortschritte'],
  ideas:['Gewohnheiten',()=>({ideas:'Ideen für später',archive:'Was du geschafft hast'})[ideasView]||'Ideen für später'],
  settings:['Einstellungen',()=>'App & Erinnerung']};
function activeView(){const a=document.querySelector('.nav-item.active');return a?a.dataset.view:'track';}
function openIdeasTab(){ideasView='ideas';const b=document.querySelector('.nav-item[data-view="ideas"]');
  if(activeView()==='ideas')renderIdeas();else b.click();}
function staggerIn(v){const el=V[v];el.classList.remove('stagger');void el.offsetWidth;el.classList.add('stagger');
  clearTimeout(staggerIn._t);staggerIn._t=setTimeout(()=>el.classList.remove('stagger'),800);}
document.querySelectorAll('.nav-item').forEach(b=>{b.addEventListener('click',()=>{
  const v=b.dataset.view;
  if(b.classList.contains('active')){document.querySelector('.scroll').scrollTo({top:0,behavior:'smooth'});return;}
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));V[v].classList.add('active');
  document.getElementById('viewTitle').textContent=titles[v][0];document.getElementById('viewSub').textContent=titles[v][1]();
  if(v==='stats')renderStats();if(v==='settings')renderSettings();if(v==='track')renderTrack();if(v==='ideas')renderIdeas();
  document.querySelector('.scroll').scrollTop=0;staggerIn(v);});});

/* ---------- Theme ---------- */
const themeBtn=document.getElementById('themeBtn');
function applyTheme(){const t=S.settings.theme;
  if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  const dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);
  themeBtn.innerHTML=dark?`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
    :`<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
  applyStyle();}
/* Stil: 'original' (ohne Attribut) oder einer der drei neuen Stile. Setzt data-style am <html>,
   laedt die Schriften des aktiven Stils (ein einziger <link id="styleFonts">) und zieht theme-color nach. */
const STYLES=[['original','Original'],['garten','Ruhiger Garten'],['papier','Papier & Tinte'],['instrument','Instrument'],
  ['glas','Liquid Glass'],['mitternacht','Mitternacht'],['raster','Schweizer Raster']];
// Google-Fonts-Abfrage je Stil. Liquid Glass nutzt die Systemschrift (San Francisco); Inter ist nur der
// Ersatz auf Geraeten ohne sie und wird auf dem iPhone gar nicht erst geladen.
const STYLE_FONTS={
  garten:'family=Figtree:wght@400..800',
  papier:'family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400..800',
  instrument:'family=Inter+Tight:wght@400..800&family=JetBrains+Mono:wght@400..700',
  glas:'family=Inter:wght@400..700',
  mitternacht:'family=Plus+Jakarta+Sans:wght@400..800',
  raster:'family=Archivo:wght@400..900'};
function styleName(){const s=S.settings.style;return STYLE_FONTS[s]?s:'original';}
function applyStyle(){const s=styleName(),root=document.documentElement;
  if(s==='original')root.removeAttribute('data-style');else root.setAttribute('data-style',s);
  let link=document.getElementById('styleFonts');
  if(s==='original'){if(link)link.remove();}
  else{const href='https://fonts.googleapis.com/css2?'+STYLE_FONTS[s]+'&display=swap';
    if(!link){link=document.createElement('link');link.rel='stylesheet';link.id='styleFonts';document.head.appendChild(link);}
    if(link.getAttribute('href')!==href)link.setAttribute('href',href);}
  syncThemeColor();}
// theme-color (steht im Deploy-Wrapper): im Original unveraendert lassen, sonst auf den Grund des Stils setzen
function syncThemeColor(){const metas=document.querySelectorAll('meta[name="theme-color"]');if(!metas.length)return;
  const orig=styleName()==='original';
  const bg=orig?'':getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  metas.forEach(m=>{if(m.dataset.orig==null)m.dataset.orig=m.getAttribute('content')||'';
    m.setAttribute('content',orig||!bg?m.dataset.orig:bg);});}
function setStyle(s){S.settings.style=s;save();applyStyle();renderSettings();}
// Stil-Auswahl in den Einstellungen: vier Vorschau-Kacheln, jede in den Farben und Schriften ihres Stils
// (die Tokens haengen per data-sw an der Kachel). Die Schriften der nicht aktiven Stile werden nur fuer
// die paar Zeichen der Kachel geladen.
const STYLE_FONTS_PREVIEW={garten:'family=Figtree:wght@600',papier:'family=Instrument+Serif&family=Schibsted+Grotesk:wght@600',
  instrument:'family=Inter+Tight:wght@600&family=JetBrains+Mono:wght@500',
  glas:'family=Inter:wght@600',mitternacht:'family=Plus+Jakarta+Sans:wght@600',raster:'family=Archivo:wght@700'};
function stylePickHTML(){const cur=styleName();
  const fams=Object.keys(STYLE_FONTS_PREVIEW).filter(k=>k!==cur).map(k=>STYLE_FONTS_PREVIEW[k]).join('&');
  const href='https://fonts.googleapis.com/css2?'+fams+'&text=Heut36Tag&display=swap';
  let link=document.getElementById('styleFontsPreview');
  if(!link){link=document.createElement('link');link.rel='stylesheet';link.id='styleFontsPreview';
    document.head.insertBefore(link,document.getElementById('styleFonts'));}
  if(link.getAttribute('href')!==href)link.setAttribute('href',href);
  return `<div class="stil"><div class="stil-t">Stil</div><div class="stgrid">${STYLES.map(([k,n])=>`
    <button class="stopt ${k===cur?'sel':''}" onclick="setStyle('${k}')" aria-pressed="${k===cur}">
      <div class="stsw" data-sw="${k}"><div class="stsw-h">Heute</div>
        <div class="stsw-c"><span class="stsw-n">36</span><span class="stsw-l">Tage</span><i class="a"></i><i class="g"></i><i class="o"></i><i class="r"></i></div></div>
      <div class="stname"><span>${esc(n)}</span>${k===cur?'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>':''}</div></button>`).join('')}</div></div>`;}
themeBtn.addEventListener('click',cycleTheme);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);

/* ---------- Toast ---------- */
let toastT;const toastEl=document.getElementById('toast');
function toast(msg,big){toastEl.textContent=msg;toastEl.className='toast show'+(big?' big':'');clearTimeout(toastT);
  toastT=setTimeout(()=>toastEl.classList.remove('show'),big?2600:1900);}

/* ---------- Init ---------- */
function renderAll(){renderTrack();document.getElementById('viewSub').textContent=titles.track[1]();}
applyStyle();applyTheme();renderAll();staggerIn('track');
if(PREVIEW){const b=document.createElement('div');b.className='pv-badge';b.textContent='Vorschau';document.body.appendChild(b);}
clearNotifs();pushStatus();
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){clearNotifs();pushStatus();}else pushStatus(true);});
// beim Start sichern, wenn die letzte Sicherung laenger als 20 Stunden her ist
setTimeout(()=>{const b=backupState();if(!b.last||Date.now()-Date.parse(b.last)>20*3600000)doBackup(false);},4000);
setInterval(()=>{const t=todayStr();if(t!==renderAll._d){renderAll._d=t;pushStatus();if(document.querySelector('.nav-item.active').dataset.view==='track')renderTrack();}},60000);
renderAll._d=todayStr();
</script>
