:root[data-style="instrument"] .pfad.big .pf-mark{width:2px;height:16px}
:root[data-style="instrument"] .pf-labels span.on{color:var(--ink)}


/* ======================================================================
   Weitere Stile. Jeder steht vollstaendig in seinem eigenen Abschnitt:
   Tokens (hell, dunkel per data-theme, dunkel per System), Vorschau-Kachel, Bauteile.
   ====================================================================== */

/* --- Stil: Liquid Glass (glas) --- */
/* Zwei Ebenen: der Inhalt liegt ruhig in iOS-Gruppen (weiss auf Systemgrau, Haarlinien bis zum Text eingerueckt),
   die Bedienung schwebt darueber aus Glas (Tableiste, Kopfknopf, Blatt, Toast). Glas nie auf Karten.
   Eigene Hilfs-Tokens beginnen mit --gl-. */
:root[data-style="glas"],.stsw[data-sw="glas"]{
  --bg:#f2f2f7; --surface:#ffffff; --surface-2:rgba(118,118,128,.12); --surface-3:rgba(118,118,128,.2);
  --ink:#000000; --ink-soft:#3a3a3c; --muted:#6c6c70; --faint:#8e8e93;
  --line:rgba(60,60,67,.12); --line-2:rgba(60,60,67,.2);
  --accent:#007aff; --accent-soft:rgba(0,122,255,.12); --accent-ink:#0066db; --on-accent:#fff;
  --g1:#34c759; --g2:#34c759; --o1:#ff9500; --o2:#ff9500; --r1:#ff3b30; --r2:#ff3b30;
  --g-ink:#1f7f37; --o-ink:#a85a00; --r-ink:#d70015;
  --fill-g:var(--g2); --fill-o:var(--o2); --fill-r:var(--r2);
  --on-fill:#fff; --on-g:#0b0b0c; --on-o:#0b0b0c; --on-r:#0b0b0c; --knob:#fff;
  --shadow:none; --shadow-lg:none; --rs:1.2;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --font-head:var(--font-display); --font-num:var(--font-display);
  --gl-mat:rgba(255,255,255,.68); --gl-mat-solid:#fbfbfd;
  --gl-thick:rgba(242,242,247,.8); --gl-thick-solid:#f2f2f7; --gl-up:#ffffff;
  --gl-rim:rgba(255,255,255,.75); --gl-pill:rgba(60,60,67,.1);
  --gl-fx:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 .5px rgba(0,0,0,.14),0 10px 30px -8px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.05);
  --gl-sep:rgba(60,60,67,.29); --gl-ring:rgba(60,60,67,.36); --gl-chev:rgba(60,60,67,.3);
  --gl-seg:#ffffff; --gl-seg-fx:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04);
  --gl-dim:rgba(0,0,0,.22); --gl-tile:#8e8e93;
  --gl-wash:radial-gradient(70% 42% at 8% 4%,rgba(0,122,255,.11),transparent 72%),
    radial-gradient(60% 40% at 100% 34%,rgba(175,82,222,.08),transparent 72%),
    radial-gradient(64% 38% at 0% 72%,rgba(48,176,199,.08),transparent 72%),
    radial-gradient(80% 40% at 62% 102%,rgba(255,149,0,.1),transparent 72%);
}
:root[data-style="glas"][data-theme="dark"],:root[data-theme="dark"] .stsw[data-sw="glas"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:rgba(118,118,128,.24); --surface-3:rgba(118,118,128,.36);
  --ink:#ffffff; --ink-soft:#d1d1d6; --muted:#98989f; --faint:#7c7c82;
  --line:rgba(84,84,88,.4); --line-2:rgba(84,84,88,.65);
  --accent:#0a84ff; --accent-soft:rgba(10,132,255,.2); --accent-ink:#409cff; --on-accent:#fff;
  --g1:#30d158; --g2:#30d158; --o1:#ff9f0a; --o2:#ff9f0a; --r1:#ff453a; --r2:#ff453a;
  --g-ink:#30d158; --o-ink:#ff9f0a; --r-ink:#ff6961;
  --on-fill:#fff; --on-g:#0b0b0c; --on-o:#0b0b0c; --on-r:#0b0b0c; --knob:#fff;
  --gl-mat:rgba(44,44,48,.6); --gl-mat-solid:#1e1e21;
  --gl-thick:rgba(28,28,30,.74); --gl-thick-solid:#1c1c1e; --gl-up:#2c2c2e;
  --gl-rim:rgba(255,255,255,.13); --gl-pill:rgba(255,255,255,.13);
  --gl-fx:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 .5px rgba(0,0,0,.6),0 12px 32px -8px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
  --gl-sep:rgba(84,84,88,.65); --gl-ring:rgba(235,235,245,.34); --gl-chev:rgba(235,235,245,.3);
  --gl-seg:#636366; --gl-seg-fx:0 3px 8px rgba(0,0,0,.24),0 1px 1px rgba(0,0,0,.12);
  --gl-dim:rgba(0,0,0,.5); --gl-tile:#636366;
  --gl-wash:radial-gradient(70% 42% at 8% 4%,rgba(10,132,255,.2),transparent 72%),
    radial-gradient(60% 40% at 100% 34%,rgba(191,90,242,.13),transparent 72%),
    radial-gradient(64% 38% at 0% 72%,rgba(64,200,224,.11),transparent 72%),
    radial-gradient(80% 40% at 62% 102%,rgba(255,159,10,.13),transparent 72%);
}
@media (prefers-color-scheme:dark){
  :root[data-style="glas"]:not([data-theme="light"]),:root:not([data-theme="light"]) .stsw[data-sw="glas"]{
    --bg:#000000; --surface:#1c1c1e; --surface-2:rgba(118,118,128,.24); --surface-3:rgba(118,118,128,.36);
    --ink:#ffffff; --ink-soft:#d1d1d6; --muted:#98989f; --faint:#7c7c82;
    --line:rgba(84,84,88,.4); --line-2:rgba(84,84,88,.65);
    --accent:#0a84ff; --accent-soft:rgba(10,132,255,.2); --accent-ink:#409cff; --on-accent:#fff;
    --g1:#30d158; --g2:#30d158; --o1:#ff9f0a; --o2:#ff9f0a; --r1:#ff453a; --r2:#ff453a;
    --g-ink:#30d158; --o-ink:#ff9f0a; --r-ink:#ff6961;
    --on-fill:#fff; --on-g:#0b0b0c; --on-o:#0b0b0c; --on-r:#0b0b0c; --knob:#fff;
    --gl-mat:rgba(44,44,48,.6); --gl-mat-solid:#1e1e21;
    --gl-thick:rgba(28,28,30,.74); --gl-thick-solid:#1c1c1e; --gl-up:#2c2c2e;
    --gl-rim:rgba(255,255,255,.13); --gl-pill:rgba(255,255,255,.13);
    --gl-fx:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 .5px rgba(0,0,0,.6),0 12px 32px -8px rgba(0,0,0,.7),0 2px 6px rgba(0,0,0,.3);
    --gl-sep:rgba(84,84,88,.65); --gl-ring:rgba(235,235,245,.34); --gl-chev:rgba(235,235,245,.3);
    --gl-seg:#636366; --gl-seg-fx:0 3px 8px rgba(0,0,0,.24),0 1px 1px rgba(0,0,0,.12);
    --gl-dim:rgba(0,0,0,.5); --gl-tile:#636366;
    --gl-wash:radial-gradient(70% 42% at 8% 4%,rgba(10,132,255,.2),transparent 72%),
      radial-gradient(60% 40% at 100% 34%,rgba(191,90,242,.13),transparent 72%),
      radial-gradient(64% 38% at 0% 72%,rgba(64,200,224,.11),transparent 72%),
      radial-gradient(80% 40% at 62% 102%,rgba(255,159,10,.13),transparent 72%);
  }
}

/* Vorschau-Kachel: Grosstitel, darunter eine kleine Glaskapsel auf dem Farbschleier */
.stsw[data-sw="glas"]{background:var(--gl-wash),var(--bg);border-color:var(--line);border-radius:calc(14px*var(--rs))}
.stsw[data-sw="glas"] .stsw-h{font-size:22px;font-weight:700;letter-spacing:-.02em}
.stsw[data-sw="glas"] .stsw-c{padding:6px 9px;border:1px solid var(--gl-rim);border-radius:calc(16px*var(--rs));
  background:var(--gl-mat);box-shadow:var(--gl-fx)}
.stsw[data-sw="glas"] .stsw-n{font-size:15px;font-weight:700}
.stsw[data-sw="glas"] .stsw-l{font-size:10.5px;font-weight:500}
.stsw[data-sw="glas"] .stsw-c i{width:11px;height:11px;border-radius:calc(3px*var(--rs))}

/* Grund: leiser Farbschleier, am Bildschirm fixiert, damit das Glas etwas zum Durchscheinen hat */
:root[data-style="glas"] body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--gl-wash)}
/* Rand-Effekt oben: Inhalt verblasst unter der Statusleiste */
:root[data-style="glas"] .app::before{content:"";position:fixed;top:0;left:0;right:0;z-index:30;pointer-events:none;
  height:calc(var(--safe-top) + 10px);background:linear-gradient(to bottom,var(--bg) 35%,transparent)}

/* Schrift: SF-Gewichte 400 / 600 / 700 */
:root[data-style="glas"] :is(h1,h2,h3){font-family:var(--font-head)}
:root[data-style="glas"] .head{padding:calc(var(--safe-top) + 18px) 20px 6px;align-items:center}
:root[data-style="glas"] .head h1{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.12}
:root[data-style="glas"] .head .sub{font-size:15px;font-weight:400;margin-top:1px}
:root[data-style="glas"] .scroll{padding:10px 16px 132px}
:root[data-style="glas"] .section-label{margin:24px 16px 8px;font-size:13px;font-weight:600;letter-spacing:0;text-transform:none}
:root[data-style="glas"] :is(.isec-head .t,.recall-card .rc-k,.cel-kicker,.kbody h4,.st-fig .l,.day .dl,.mhead .dl,.cal .cd,.esec){letter-spacing:0;text-transform:none}

/* Glas-Material (nur Bedienebene) */
:root[data-style="glas"] :is(.nav-inner,.head-btn,.toast,.sheet,.cel-card){border:1px solid var(--gl-rim);box-shadow:var(--gl-fx);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
:root[data-style="glas"] :is(.nav-inner,.head-btn){background:var(--gl-mat)}
:root[data-style="glas"] :is(.toast,.sheet,.cel-card){background:var(--gl-thick)}

/* Kopfknopf */
:root[data-style="glas"] .head-btn{width:44px;height:44px}
:root[data-style="glas"] .head-btn svg{width:20px;height:20px;stroke:var(--ink);stroke-width:1.8}

/* Tableiste: schwebende Glaskapsel, aktiver Eintrag in innerer Kapsel (Radien konzentrisch) */
:root[data-style="glas"] .nav{padding:0 16px max(12px,calc(var(--safe-bottom) - 10px));background:none;pointer-events:none}
:root[data-style="glas"] .nav-inner{pointer-events:auto;padding:4px;border-radius:calc(27px*var(--rs))}
:root[data-style="glas"] .nav-item{min-height:54px;padding:7px 0 6px;gap:2px;justify-content:center;border-radius:calc(22.5px*var(--rs));color:var(--ink)}
:root[data-style="glas"] .nav-item svg{width:23px;height:23px;stroke-width:1.7}
:root[data-style="glas"] .nav-item span{font-size:10px;font-weight:500}
:root[data-style="glas"] .nav-item.active{background:var(--gl-pill);color:var(--accent-ink)}
:root[data-style="glas"] .nav-item.active span{font-weight:600}

/* Inhaltsgruppen: weiss auf Grau, keine Raender, keine Schatten */
:root[data-style="glas"] :is(.today-card,.recall-card,.card,.matrix,.tlist,.set-group,.hero-stat,.stat-card,.st-list,.st-pfad,.st-big>div,.hd-card,.hd-figs>div,.ms-box,.idea-card,.arch-card,.arch-sum div,.note-box,.kcard){
  border:0;border-radius:calc(20px*var(--rs));box-shadow:none}
:root[data-style="glas"] :is(.today-card,.recall-card,.matrix,.tlist,.hero-stat,.stat-card,.st-pfad,.st-big,.hd-card,.hd-figs){margin-bottom:16px}
:root[data-style="glas"] .set-group{margin-bottom:8px}

/* Dein Tag */
:root[data-style="glas"] .today-card{padding:14px 16px 16px}
:root[data-style="glas"] .tc-head{margin-bottom:10px}
:root[data-style="glas"] .tc-title{font-size:15px;font-weight:600;letter-spacing:0}
:root[data-style="glas"] .tc-count{font-size:15px;font-weight:600;color:var(--muted)}
:root[data-style="glas"] .tc-bar{height:8px;border-radius:calc(4px*var(--rs))}
:root[data-style="glas"] .tc-bar i{border-radius:calc(4px*var(--rs))}

/* Umschalter: iOS-Segmente, gewaehlt = angehobene Kapsel */
:root[data-style="glas"] .seg-toggle{padding:3px;gap:0;border-radius:calc(18px*var(--rs));background:var(--surface-2)}
:root[data-style="glas"] .seg-toggle button::after{content:"";position:absolute;inset:-3px 0}
:root[data-style="glas"] .seg-toggle button{position:relative;min-height:38px;padding:8px 6px;border-radius:calc(15.5px*var(--rs));font-size:14px;font-weight:500;color:var(--ink)}
:root[data-style="glas"] .seg-toggle button.sel{background:var(--gl-seg);color:var(--ink);font-weight:600;box-shadow:var(--gl-seg-fx)}
:root[data-style="glas"] .view-toggle{margin-bottom:12px}

/* Tageswechsel */
:root[data-style="glas"] .wknav{margin-bottom:12px}
:root[data-style="glas"] .wknav .nbtn{position:relative;width:36px;height:36px;border:0;border-radius:50%;background:var(--surface)}
:root[data-style="glas"] .wknav .nbtn::after{content:"";position:absolute;inset:-4px}
:root[data-style="glas"] .wknav .nbtn svg{width:17px;height:17px;stroke:var(--accent);stroke-width:2.2}
:root[data-style="glas"] .wknav .lbl{font-size:15px;font-weight:600;color:var(--ink)}
:root[data-style="glas"] .wknav .jump{width:auto;height:36px;padding:0 14px;border-radius:calc(15px*var(--rs));font-size:14px;font-weight:600}

/* Heute-Liste: Gruppe mit eingerueckten Haarlinien */
:root[data-style="glas"] .tlist{padding:0 16px}
:root[data-style="glas"] .trow{position:relative;min-height:62px;padding:0;border-top:0}
:root[data-style="glas"] .trow-open{align-self:stretch;padding:11px 0}
:root[data-style="glas"] .tchev{position:relative}
:root[data-style="glas"] .tchev::after{content:"";position:absolute;inset:-14px -8px -14px -16px}
:root[data-style="glas"] .trow::before{content:"";position:absolute;top:0;left:45px;right:-16px;height:1px;background:var(--gl-sep);
  transform:scaleY(.5);transform-origin:0 0;pointer-events:none}
:root[data-style="glas"] .tlist>.trow:first-child::before,:root[data-style="glas"] .tlist>.trow-grp:first-child>.trow:first-child::before{display:none}
:root[data-style="glas"] .trow.sub{padding-left:25px}
:root[data-style="glas"] .trow.sub::before{left:65px}
:root[data-style="glas"] .trow-open{gap:13px}
:root[data-style="glas"] .tname .n{font-size:16px;font-weight:600;letter-spacing:-.01em}
:root[data-style="glas"] .tname .n svg{stroke:var(--gl-chev)}
:root[data-style="glas"] .tname .sit{font-size:13px;font-weight:400}
:root[data-style="glas"] .tmeta .warn{font-size:12px;font-weight:600}
:root[data-style="glas"] .tname .pfad{margin-top:7px}
:root[data-style="glas"] .tghead{margin:0 -16px;padding:0 16px;background:transparent}
:root[data-style="glas"] .tgroup.closed .tghead{margin-bottom:0}
:root[data-style="glas"] .tghead .tname .n{font-family:var(--font-head);font-size:17px;font-weight:700;color:var(--ink)}
:root[data-style="glas"] .tghead .mchev,:root[data-style="glas"] .mrow.grp .mchev{stroke:var(--muted)}
:root[data-style="glas"] .tghead .ico-tile svg,:root[data-style="glas"] .mrow.grp .ico-tile svg{stroke:#fff}
:root[data-style="glas"] .tempty{font-size:15px;font-weight:400}

/* Symbol-Kachel: ruhig grau, damit die Abhak-Kachel fuehrt */
:root[data-style="glas"] .ico-tile{border-radius:calc(7px*var(--rs));background:var(--surface-2)}
:root[data-style="glas"] .ico-tile svg{stroke:var(--ink-soft)}
:root[data-style="glas"] .tghead .ico-tile,:root[data-style="glas"] .mrow.grp .ico-tile{background:var(--accent)}

/* Abhak-Kachel: Groesse bleibt; leer = duenner Ring auf dem Gruppengrund, gefuellt = flache Systemfarbe, weisses Zeichen */
:root[data-style="glas"] .tstatus,:root[data-style="glas"] .tghead .tstatus{background:transparent;box-shadow:inset 0 0 0 1.5px var(--gl-ring)}
:root[data-style="glas"] .tstatus i svg{width:19px;height:19px;stroke-width:3}

/* Fortschritt: duenn, Systemblau, Marken als kleine Ringe */
:root[data-style="glas"] .pf-track{height:4px;border-radius:calc(2px*var(--rs));background:var(--surface-3)}
:root[data-style="glas"] .pf-mark{width:8px;height:8px;border:1.5px solid var(--faint);background:var(--surface)}
:root[data-style="glas"] .pf-mark.on{border-color:var(--accent);background:var(--surface)}
:root[data-style="glas"] .pf-text{font-size:13px;font-weight:400}
:root[data-style="glas"] .pfad.big .pf-track{height:8px;border-radius:calc(4px*var(--rs))}
:root[data-style="glas"] .pfad.big .pf-mark{width:16px;height:16px;border-width:2.5px}
:root[data-style="glas"] .pfad.big .pf-text{font-size:17px;font-weight:600;margin-top:10px}
:root[data-style="glas"] .pf-labels{font-size:12px;font-weight:500}
:root[data-style="glas"] .pf-labels span.on{font-weight:600}

/* Zaehler und Marken */
:root[data-style="glas"] .chip-streak{font-weight:600}
:root[data-style="glas"] .trow .chip-streak{font-size:14px;font-weight:600}
:root[data-style="glas"] .badge{padding:2px 8px;font-size:11px;font-weight:600}

/* Knoepfe: Kapseln */
:root[data-style="glas"] .primary{min-height:50px;padding:14px;border-radius:calc(21px*var(--rs));font-size:17px;font-weight:600}
:root[data-style="glas"] .ghost-btn{min-height:50px;border-radius:calc(21px*var(--rs));font-size:16px;font-weight:600}
:root[data-style="glas"] .ghost-btn.quiet{font-weight:500}
:root[data-style="glas"] .danger-btn{min-height:50px;border-radius:calc(21px*var(--rs));font-size:16px;font-weight:500}
:root[data-style="glas"] :is(.bulk-btn,.clear-day){min-height:48px;border-radius:calc(20px*var(--rs));font-size:15px;font-weight:600;color:var(--ink)}
:root[data-style="glas"] .bulk-btn.main{min-height:50px;border-radius:calc(21px*var(--rs));font-size:17px;color:var(--on-fill)}
:root[data-style="glas"] .add-btn{min-height:52px;border:0;border-radius:calc(20px*var(--rs));background:var(--surface);color:var(--accent-ink);font-size:16px;font-weight:500}
:root[data-style="glas"] .add-btn:active{background:var(--surface-3)}
:root[data-style="glas"] .add-inline{font-size:15px;font-weight:500;min-height:44px}
:root[data-style="glas"] .st-more{font-size:15px;font-weight:500;color:var(--accent-ink)}
:root[data-style="glas"] .recall-card .rc-btns button{min-height:44px;border-radius:calc(18px*var(--rs));font-size:15px;font-weight:600}
:root[data-style="glas"] .recall-card .rc-k{font-size:13px;font-weight:600}
:root[data-style="glas"] .recall-card .rc-q{font-size:15px;font-weight:400}
:root[data-style="glas"] .recall-card .rc-q b{font-weight:600}

/* Blatt: Glas, die Seite dahinter abgedunkelt; Griff wie in iOS */
:root[data-style="glas"] .scrim{background:var(--gl-dim);-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-style="glas"] .sheet{--surface:var(--gl-up);bottom:8px;width:calc(100% - 16px);max-width:444px;max-height:calc(92dvh - 8px);
  border-radius:calc(30px*var(--rs));padding-bottom:max(0px,calc(var(--safe-bottom) - 14px));transform:translate(-50%,calc(100% + 40px))}
:root[data-style="glas"] .sheet.show{transform:translate(-50%,0)}
:root[data-style="glas"] .grabber{width:36px;height:5px;margin:6px auto 4px;background:var(--gl-chev)}
:root[data-style="glas"] .sheet-head{padding:8px 16px 12px 20px}
:root[data-style="glas"] .sheet-head h2{font-size:22px;font-weight:700;letter-spacing:-.015em}
:root[data-style="glas"] .sheet-body{padding:0 16px 20px}
:root[data-style="glas"] .x-btn{position:relative;width:36px;height:36px;background:var(--surface-2)}
:root[data-style="glas"] .x-btn::after{content:"";position:absolute;inset:-4px}
:root[data-style="glas"] .x-btn svg{stroke:var(--ink-soft);stroke-width:2.4}
:root[data-style="glas"] :is(.de-date,.hd-rhythm){margin-left:4px;font-size:15px;font-weight:400}
:root[data-style="glas"] .toast{padding:12px 20px;border-radius:calc(20px*var(--rs));color:var(--ink);font-size:15px;font-weight:600}
:root[data-style="glas"] .toast.big{color:var(--ink);font-size:16px;font-weight:700}
:root[data-style="glas"] .cel{background:var(--gl-dim);-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-style="glas"] .cel-card{border-radius:calc(30px*var(--rs))}
:root[data-style="glas"] .cel-card h2{font-size:28px;font-weight:700;letter-spacing:-.02em}
:root[data-style="glas"] .cel-kicker{font-size:13px;font-weight:600}
:root[data-style="glas"] .cel-card p{font-size:15px}

/* Formulare */
:root[data-style="glas"] .field > label{margin:0 0 7px 4px;font-size:13px;font-weight:600;color:var(--muted)}
:root[data-style="glas"] .field .hint{margin-left:4px;font-size:13px;font-weight:400}
:root[data-style="glas"] .field .hint b{font-weight:600}
:root[data-style="glas"] .esec{margin:26px 4px 12px;padding-top:0;border-top:0;font-family:var(--font-head);font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
:root[data-style="glas"] .esec .opt{font-size:15px;font-weight:400;color:var(--muted)}
:root[data-style="glas"] .inp{min-height:48px;border:1.5px solid transparent;border-radius:calc(13px*var(--rs));font-weight:400}
:root[data-style="glas"] .inp:focus{border-color:var(--accent)}
:root[data-style="glas"] .set-row .inp{min-height:36px;border-radius:calc(9px*var(--rs))}
:root[data-style="glas"] :is(.set-group,.hd-card,.stat-card,.ms-box) .inp{background-color:var(--surface-2)}
:root[data-style="glas"] :is(.choice,.pick-row,.icon-pick button,.wd-pick button){border-color:transparent}
:root[data-style="glas"] :is(.choice,.pick-row,.icon-pick button).sel{border-color:var(--accent)}
:root[data-style="glas"] .choice .cl{font-size:13px;font-weight:500}
:root[data-style="glas"] .choice.sel .cl{font-weight:600}
:root[data-style="glas"] .icon-pick{border:0}
:root[data-style="glas"] .icon-pick:not(.flat){padding:8px;background:var(--surface-2)}
:root[data-style="glas"] .wd-pick button{border-radius:50%;font-size:14px;font-weight:500;color:var(--ink)}
:root[data-style="glas"] .wd-pick button.sel{background:var(--accent);color:var(--on-accent);font-weight:600}
:root[data-style="glas"] .stepper button{width:44px;height:44px;border-radius:50%;color:var(--accent-ink)}
:root[data-style="glas"] .stepper .val{font-size:28px;font-weight:700}
:root[data-style="glas"] .stepper .unit{font-size:15px;font-weight:400}
:root[data-style="glas"] .mini-step button{position:relative;width:32px;height:32px;border-radius:50%;color:var(--accent-ink)}
:root[data-style="glas"] .mini-step button::after{content:"";position:absolute;inset:-6px}
:root[data-style="glas"] .mini-step .v{font-size:16px;font-weight:600}
:root[data-style="glas"] .del{width:44px;height:48px;border-radius:calc(13px*var(--rs))}
:root[data-style="glas"] .sit-row .sn{margin-left:4px;font-size:15px;font-weight:600}
:root[data-style="glas"] .pr-name{font-size:16px;font-weight:500}
:root[data-style="glas"] .pr-name em{font-size:12px;font-weight:400}
:root[data-style="glas"] .pr-box{border-radius:50%}
:root[data-style="glas"] .chip{position:relative;min-height:40px;padding:7px 15px;border:0;font-size:14px;font-weight:500;color:var(--ink)}
:root[data-style="glas"] .chip::after{content:"";position:absolute;inset:-2px 0}
:root[data-style="glas"] .chip.sel{background:var(--accent);color:var(--on-accent);font-weight:600}

/* Schalter: iOS-Form mit laenglichem Knopf, an = Systemgruen */
:root[data-style="glas"] .switch{width:58px;height:30px;border-radius:calc(12.5px*var(--rs))}
:root[data-style="glas"] .switch.on{background:var(--g2)}
:root[data-style="glas"] .switch::after{top:2px;left:2px;width:35px;height:26px;border-radius:calc(11px*var(--rs));background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.05)}
:root[data-style="glas"] .switch.on::after{background:#fff;transform:translateX(19px)}

/* Einstellungen: iOS-Zeilen, Haarlinien ab Text, Chevrons */
:root[data-style="glas"] .set-row{position:relative;min-height:54px;padding:10px 16px;gap:14px;border-bottom:0}
:root[data-style="glas"] .set-row::after{content:"";position:absolute;bottom:0;left:16px;right:0;height:1px;background:var(--gl-sep);
  transform:scaleY(.5);transform-origin:0 100%;pointer-events:none}
:root[data-style="glas"] .set-row:has(> .si)::after{left:60px}
:root[data-style="glas"] .set-row:last-child::after{display:none}
:root[data-style="glas"] .set-row .si{width:30px;height:30px;border-radius:calc(6px*var(--rs));background:var(--gl-tile)}
:root[data-style="glas"] .set-row .si svg{width:18px;height:18px;stroke:#fff;stroke-width:1.9}
:root[data-style="glas"] .set-row .si.acc{background:var(--accent)}
:root[data-style="glas"] .set-row .si.acc svg{stroke:#fff}
:root[data-style="glas"] .set-row .st .t{font-size:16px;font-weight:400;letter-spacing:-.01em}
:root[data-style="glas"] .set-row .st .d{font-size:13px;font-weight:400;line-height:1.35}
:root[data-style="glas"] .set-row .chev{width:15px;height:15px;stroke:var(--gl-chev);stroke-width:2.6}
:root[data-style="glas"] .set-row.tap:active{background:var(--surface-3)}
:root[data-style="glas"] .pill-val{font-size:16px;font-weight:400}
:root[data-style="glas"] .set-note{padding:0 16px;margin:0 0 8px;font-size:13px;font-weight:400}
:root[data-style="glas"] .stil{padding:14px 16px 16px}
:root[data-style="glas"] .stil-t{font-size:16px;font-weight:400}
:root[data-style="glas"] .stname{font-size:13px;font-weight:500}
:root[data-style="glas"] .stopt.sel .stname{font-weight:600}
:root[data-style="glas"] .ms-top b{font-size:15px;font-weight:600}
:root[data-style="glas"] .ms-row{border-top-color:var(--line)}

/* Statistik und Detail: Kennzahlen kraeftig, Beschriftung leise */
:root[data-style="glas"] .hs .n{font-size:34px;font-weight:700;letter-spacing:-.02em}
:root[data-style="glas"] .hs .l{font-size:12px;font-weight:500}
:root[data-style="glas"] .st-big>div{padding:16px}
:root[data-style="glas"] .st-big .n{font-size:40px;font-weight:700;letter-spacing:-.025em}
:root[data-style="glas"] .st-big .l{font-size:13px;font-weight:500;margin-top:4px}
:root[data-style="glas"] .st-pfad{padding:16px}
:root[data-style="glas"] .st-row{position:relative;min-height:68px;padding:12px 16px;gap:13px}
:root[data-style="glas"] .st-row+.st-row{border-top:0}
:root[data-style="glas"] .st-row+.st-row::before{content:"";position:absolute;top:0;left:63px;right:0;height:1px;background:var(--gl-sep);
  transform:scaleY(.5);transform-origin:0 0;pointer-events:none}
:root[data-style="glas"] .st-row:active{background:var(--surface-3)}
:root[data-style="glas"] .st-row .st-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
:root[data-style="glas"] .st-row .pf-text{font-size:12px}
:root[data-style="glas"] .st-figs{gap:10px}
:root[data-style="glas"] .st-fig{min-width:40px}
:root[data-style="glas"] .st-fig .n{font-size:17px;font-weight:600;line-height:1.25}
:root[data-style="glas"] .st-fig .l{font-size:11px;font-weight:500;color:var(--muted)}
:root[data-style="glas"] .stat-card{padding:16px}
:root[data-style="glas"] .stat-card .sh h3{font-size:16px;font-weight:600}
:root[data-style="glas"] .stat-card .sh .pct,:root[data-style="glas"] .arch-card .ap{font-size:20px;font-weight:600}
:root[data-style="glas"] .mnav h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
:root[data-style="glas"] .mnav button{border:0;border-radius:50%;background:var(--surface)}
:root[data-style="glas"] .mnav button svg{stroke:var(--accent);stroke-width:2.2}
:root[data-style="glas"] .cal .cd{font-size:12px;font-weight:500}
:root[data-style="glas"] .cal .mc .num{font-size:13px;font-weight:500}
:root[data-style="glas"] .cal .mc.filled .num{font-weight:600}
:root[data-style="glas"] .legend div{font-size:13px;font-weight:400}
:root[data-style="glas"] .hd-card{padding:4px 16px 16px}
:root[data-style="glas"] .hd-head{font-size:15px;font-weight:600;color:var(--ink)}
:root[data-style="glas"] .hd-figs>div{padding:14px 12px}
:root[data-style="glas"] .hd-figs b{font-size:34px;font-weight:700;letter-spacing:-.02em}
:root[data-style="glas"] .hd-figs span{font-size:12px;font-weight:500}
:root[data-style="glas"] .hd-warn{font-size:12px;font-weight:600}
:root[data-style="glas"] .hd-rule{font-size:14px}
:root[data-style="glas"] .hd-rule b{font-weight:600}
:root[data-style="glas"] .hd-goal{margin-left:4px;font-size:14px;font-weight:400}
:root[data-style="glas"] .hd-ready{font-size:15px;font-weight:500}
:root[data-style="glas"] .verlauf .vl-head{font-size:15px;font-weight:600}
:root[data-style="glas"] .verlauf .vl-head span+span{font-size:13px;font-weight:400}
:root[data-style="glas"] .note-box{padding:12px 16px;font-size:15px}

/* Woche */
:root[data-style="glas"] .matrix{padding:12px 12px 8px}
:root[data-style="glas"] .mhead{border-bottom:0}
:root[data-style="glas"] .mhead .dl{font-size:11px;font-weight:500}
:root[data-style="glas"] .mrow{border-top-color:var(--line)}
:root[data-style="glas"] .mname span{font-size:12.5px;font-weight:600}
:root[data-style="glas"] .mrow.sub .mname span{font-weight:500}
:root[data-style="glas"] .mrow.grp{background:var(--surface-2)}
:root[data-style="glas"] .mrow.grp .mname span{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--ink)}
:root[data-style="glas"] .mstreak{font-weight:600;color:var(--muted)}

/* Gewohnheiten, Archiv, Wissen */
:root[data-style="glas"] .isec-head{padding:14px 16px 8px}
:root[data-style="glas"] .isec-head .t{font-size:13px;font-weight:600}
:root[data-style="glas"] .isec-head .c{font-size:13px;font-weight:500}
:root[data-style="glas"] :is(.idea-card,.arch-card){padding:12px 14px 12px 16px;margin-bottom:8px}
:root[data-style="glas"] .idea-card .itext{font-size:16px;font-weight:400}
:root[data-style="glas"] .idea-card .inote{font-size:13px;font-weight:400}
:root[data-style="glas"] .idea-card .iact button{width:36px;height:36px;border-radius:50%}
:root[data-style="glas"] .idea-addbtn{border-radius:calc(13px*var(--rs));background:var(--accent);color:var(--on-accent)}
:root[data-style="glas"] .ilist .idrop{border-radius:calc(20px*var(--rs));font-size:14px;font-weight:400}
:root[data-style="glas"] .arch-card .an{font-size:16px;font-weight:600}
:root[data-style="glas"] .arch-card .ad{font-size:13px;font-weight:400}
:root[data-style="glas"] .arch-sum b{font-size:28px;font-weight:700}
:root[data-style="glas"] .arch-sum span{font-size:12px;font-weight:500}
:root[data-style="glas"] .kcard{margin-bottom:8px}
:root[data-style="glas"] .kcard summary{padding:13px 16px;min-height:60px}
:root[data-style="glas"] .kcard summary .kt b{font-size:16px;font-weight:600}
:root[data-style="glas"] .kcard summary .kt span{font-size:13px;font-weight:400}
:root[data-style="glas"] .kcard summary .mchev{stroke:var(--gl-chev)}
:root[data-style="glas"] .kbody{padding:0 16px 16px;font-size:15px}
:root[data-style="glas"] .kbody h4{font-size:15px;font-weight:600;color:var(--ink)}
:root[data-style="glas"] .kbody .law b{font-size:15px;font-weight:600}
:root[data-style="glas"] .empty h2{font-size:22px;font-weight:700}
:root[data-style="glas"] .empty p{font-size:15px}

/* Ohne Transparenz: feste Flaechen statt Glas */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root[data-style="glas"] :is(.nav-inner,.head-btn){background:var(--gl-mat-solid)}
  :root[data-style="glas"] :is(.toast,.sheet,.cel-card){background:var(--gl-thick-solid)}
}
@media (prefers-reduced-transparency:reduce){
  :root[data-style="glas"] :is(.nav-inner,.head-btn){background:var(--gl-mat-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
  :root[data-style="glas"] :is(.toast,.sheet,.cel-card){background:var(--gl-thick-solid);-webkit-backdrop-filter:none;backdrop-filter:none}
}


/* --- Stil: Mitternacht (mitternacht) --- */
/* Abendstil: tiefes Nachtblau, Flaechen nur durch Tonstufen getrennt, Akzent Mondlicht-Violett.
   Hell = "Daemmerung": blasses, kuehles Blaugrau mit Marine-Tinte. */
:root[data-style="mitternacht"],.stsw[data-sw="mitternacht"]{
  --bg:#eef1f8; --bg-top:#f7f9fd; --surface:#fbfcff; --surface-2:#e4e9f4; --surface-3:#d2daec;
  --ink:#1a2140; --ink-soft:#3a4468; --muted:#566080; --faint:#66719a;
  --line:rgba(26,33,64,.08); --line-2:rgba(26,33,64,.17);

  --fill-g:var(--g2); --fill-o:var(--o2); --fill-r:var(--r2);
  --on-fill:#0f1a2e; --on-g:#0f1a2e; --on-o:#0f1a2e; --on-r:#0f1a2e; --knob:#fff;
  --shadow:none; --shadow-lg:none; --rs:.9;

}
:root[data-style="mitternacht"][data-theme="dark"],:root[data-theme="dark"] .stsw[data-sw="mitternacht"]{
  --bg:#0d1220; --bg-top:#151c36; --surface:#151b2e; --surface-2:#1d2540; --surface-3:#2a3459;
  --ink:#e6e9f5; --ink-soft:#c0c6dd; --muted:#9aa3c4; --faint:#8089ae;
  --line:rgba(160,174,255,.08); --line-2:rgba(160,174,255,.17);
  --accent:#9aa8ff; --accent-soft:#232c57; --accent-ink:#b5c0ff; --on-accent:#0d1220;
  --g1:#5fcf9a; --g2:#5fcf9a; --o1:#f0b45c; --o2:#f0b45c; --r1:#f0787a; --r2:#f0787a;
  --g-ink:#7fddb2; --o-ink:#f2be72; --r-ink:#f59a9c;
  --on-fill:#0d1220; --on-g:#0d1220; --on-o:#0d1220; --on-r:#0d1220; --knob:#d5daee;
}
@media (prefers-color-scheme:dark){
  :root[data-style="mitternacht"]:not([data-theme="light"]),:root:not([data-theme="light"]) .stsw[data-sw="mitternacht"]{
    --bg:#0d1220; --bg-top:#151c36; --surface:#151b2e; --surface-2:#1d2540; --surface-3:#2a3459;
    --ink:#e6e9f5; --ink-soft:#c0c6dd; --muted:#9aa3c4; --faint:#8089ae;
    --line:rgba(160,174,255,.08); --line-2:rgba(160,174,255,.17);
    --accent:#9aa8ff; --accent-soft:#232c57; --accent-ink:#b5c0ff; --on-accent:#0d1220;
    --g1:#5fcf9a; --g2:#5fcf9a; --o1:#f0b45c; --o2:#f0b45c; --r1:#f0787a; --r2:#f0787a;
    --g-ink:#7fddb2; --o-ink:#f2be72; --r-ink:#f59a9c;
    --on-fill:#0d1220; --on-g:#0d1220; --on-o:#0d1220; --on-r:#0d1220; --knob:#d5daee;
  }
}

/* Vorschau-Kachel */
.stsw[data-sw="mitternacht"]{background:linear-gradient(180deg,var(--bg-top),var(--bg))}
.stsw[data-sw="mitternacht"] .stsw-h{font-size:19px;font-weight:700;letter-spacing:-.02em}
.stsw[data-sw="mitternacht"] .stsw-c{background:var(--surface-2);border-color:transparent;border-radius:calc(12px*var(--rs))}
.stsw[data-sw="mitternacht"] .stsw-c i{border-radius:50%;width:12px;height:12px}
.stsw[data-sw="mitternacht"] .stsw-n{font-size:14px;font-weight:700}

/* Seite: ruhiger senkrechter Verlauf, weiche Schrift */
:root[data-style="mitternacht"] body{background:var(--bg) linear-gradient(180deg,var(--bg-top),var(--bg) 380px) no-repeat;line-height:1.55}
:root[data-style="mitternacht"] :is(h1,h2,h3){font-family:var(--font-head)}
:root[data-style="mitternacht"] .head{padding:calc(var(--safe-top) + 20px) 20px 6px}
:root[data-style="mitternacht"] .head h1{font-size:27px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
:root[data-style="mitternacht"] .head .sub{font-size:13px;font-weight:500;margin-top:5px;letter-spacing:.01em}
:root[data-style="mitternacht"] .head-btn,:root[data-style="mitternacht"] .wknav .nbtn,:root[data-style="mitternacht"] .mnav button{
  background:var(--surface);border-color:var(--line)}
:root[data-style="mitternacht"] .scroll{padding:14px 16px 132px}

/* Flaechen: weiche Tafeln, getrennt durch Tonstufe, hoechstens eine feine Linie */
:root[data-style="mitternacht"] :is(.today-card,.matrix,.tlist,.set-group,.hero-stat,.stat-card,.hd-card,.st-list,.st-pfad,.st-big>div){
  background:var(--surface);border:1px solid var(--line);border-radius:calc(18px*var(--rs));margin-bottom:12px}
:root[data-style="mitternacht"] :is(.recall-card,.card,.idea-card,.arch-card,.kcard,.ms-box,.hd-figs>div,.arch-sum div,.note-box){
  background:var(--surface);border:1px solid var(--line);border-radius:calc(16px*var(--rs))}
:root[data-style="mitternacht"] .card-sub{background:var(--surface-2)}
:root[data-style="mitternacht"] .today-card{padding:14px 16px 16px}
:root[data-style="mitternacht"] .tc-head{margin-bottom:10px}
:root[data-style="mitternacht"] .tc-title{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
:root[data-style="mitternacht"] .tc-count{font-size:15px;font-weight:700;color:var(--ink)}
:root[data-style="mitternacht"] .tc-bar{height:4px;border-radius:2px;background:var(--surface-3)}
:root[data-style="mitternacht"] .tc-bar i{border-radius:2px}
:root[data-style="mitternacht"] .tc-empty{font-size:13px}

/* Beschriftungen: Satzschreibung, leicht gesperrt, gedaempft */
:root[data-style="mitternacht"] :is(.section-label,.isec-head .t,.esec,.recall-card .rc-k,.kbody h4,.cel-kicker,.st-fig .l,.day .dl,.cal .cd,.mhead .dl){
  text-transform:none;letter-spacing:.025em;font-weight:600}
:root[data-style="mitternacht"] .section-label{font-size:12.5px;margin:26px 4px 10px}
:root[data-style="mitternacht"] :is(.isec-head .t,.esec,.recall-card .rc-k,.kbody h4,.cel-kicker){font-size:12.5px}
:root[data-style="mitternacht"] :is(.day .dl,.cal .cd,.mhead .dl){font-size:10.5px}
:root[data-style="mitternacht"] .st-fig .l{font-size:11px}
:root[data-style="mitternacht"] :is(.esec,.recall-card .rc-k,.kbody h4,.cel-kicker){color:var(--accent-ink)}

/* mittlere Gewichte statt Fett */
:root[data-style="mitternacht"] :is(.tname .n,.card-name h3,.st-row .st-name,.arch-card .an,.sit-row .sn,.field > label,.mname span,.stat-card .sh h3,
  .hd-head,.ms-top b,.kcard summary .kt b,.pr-name,.primary,.ghost-btn,.bulk-btn,.recall-card .rc-btns button,.wknav .jump,.add-inline,.verlauf .vl-head,
  .legend div,.chip,.choice .cl,.wd-pick button,.chip-streak,.badge,.mstreak,.set-row .st .t){font-weight:600}
:root[data-style="mitternacht"] .tname .n{font-size:15px}
:root[data-style="mitternacht"] .tname .sit{font-size:12.5px;margin-top:2px}
:root[data-style="mitternacht"] .field > label{font-size:13px}
:root[data-style="mitternacht"] :is(.hs .n,.st-fig .n,.st-big .n,.hd-figs b,.stat-card .sh .pct,.arch-card .ap,.arch-sum b,.stepper .val,.mnav h2,.mini-step .v){
  font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
:root[data-style="mitternacht"] .hs .n{font-size:30px}
:root[data-style="mitternacht"] .st-big .n{font-size:36px}
:root[data-style="mitternacht"] .hd-figs b{font-size:28px}
:root[data-style="mitternacht"] .st-fig .n{font-size:19px}
:root[data-style="mitternacht"] .stat-card .sh .pct{font-size:17px}
:root[data-style="mitternacht"] .arch-card .ap{font-size:17px}
:root[data-style="mitternacht"] .arch-sum b{font-size:21px}
:root[data-style="mitternacht"] .stepper .val{font-size:24px}
:root[data-style="mitternacht"] .mnav h2{font-size:18px}
:root[data-style="mitternacht"] :is(.sheet-head h2,.empty h2,.cel-card h2){font-weight:700;letter-spacing:-.02em}
:root[data-style="mitternacht"] .sheet-head h2{font-size:21px}
:root[data-style="mitternacht"] .cel-card h2{font-size:24px}
:root[data-style="mitternacht"] .st-fig .n,:root[data-style="mitternacht"] .st-big .n{color:var(--ink)}
:root[data-style="mitternacht"] .stat-card .sh .pct{color:var(--accent-ink)}

/* Heute-Liste */
:root[data-style="mitternacht"] .tlist{padding:2px 16px}
:root[data-style="mitternacht"] .trow{padding:14px 0}
:root[data-style="mitternacht"] .ico-tile,:root[data-style="mitternacht"] .set-row .si.acc{background:var(--surface-2)}
:root[data-style="mitternacht"] .ico-tile svg,:root[data-style="mitternacht"] .set-row .si.acc svg{stroke:var(--accent-ink)}
:root[data-style="mitternacht"] .set-row .si{background:var(--surface-2)}
:root[data-style="mitternacht"] .tghead{background:var(--surface-2);margin:0 -16px;padding:12px 16px}
:root[data-style="mitternacht"] .tgroup{padding-top:0}
:root[data-style="mitternacht"] .tghead .ico-tile{background:var(--surface-3)}
:root[data-style="mitternacht"] .tghead .tname .n{font-family:var(--font-body);font-size:15px;font-weight:700;color:var(--ink)}
:root[data-style="mitternacht"] .tghead .mchev,:root[data-style="mitternacht"] .mrow.grp .mchev{stroke:var(--muted)}
:root[data-style="mitternacht"] .mrow.grp{background:var(--surface-2)}
:root[data-style="mitternacht"] .mrow.grp .ico-tile{background:var(--surface-3)}
:root[data-style="mitternacht"] .mrow.grp .mname span{font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--ink)}
:root[data-style="mitternacht"] .mrow.grp .mcell{background:var(--surface)}
:root[data-style="mitternacht"] .chip-streak{background:var(--surface-2);color:var(--ink-soft)}
:root[data-style="mitternacht"] .chip-streak.on{background:var(--accent-soft);color:var(--accent-ink)}
/* Abhak-Kachel: leer = eine Stufe heller mit feinem Ring, erledigt = ruhiges Gruen, hellstes Element der Zeile */
:root[data-style="mitternacht"] .tstatus{border-radius:calc(13px*var(--rs));background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line-2)}
:root[data-style="mitternacht"] .tghead .tstatus{background:var(--surface-3)}
:root[data-style="mitternacht"] .tstatus.g,:root[data-style="mitternacht"] .tstatus.o,:root[data-style="mitternacht"] .tstatus.r{box-shadow:none}
:root[data-style="mitternacht"] .tstatus i + i{border-left-color:var(--surface)}

/* Umschalter, Felder, Knoepfe */
:root[data-style="mitternacht"] .seg-toggle{background:var(--surface-2);border-radius:calc(14px*var(--rs));padding:4px}
:root[data-style="mitternacht"] .seg-toggle button{border-radius:calc(11px*var(--rs));font-weight:600}
:root[data-style="mitternacht"] .seg-toggle button.sel{background:var(--surface-3);color:var(--ink)}
:root[data-style="mitternacht"] .chip{background:var(--surface);border-color:var(--line)}
:root[data-style="mitternacht"] .chip.sel{background:var(--accent-soft);color:var(--accent-ink)}
:root[data-style="mitternacht"] .inp{background-color:var(--surface);border:1px solid var(--line-2);font-weight:500}
:root[data-style="mitternacht"] .inp:focus{border-color:var(--accent)}
:root[data-style="mitternacht"] :is(.choice,.pick-row,.icon-pick button,.wd-pick button){border-width:1px;border-color:var(--line-2);background:var(--surface)}
:root[data-style="mitternacht"] :is(.choice,.pick-row,.icon-pick button).sel{background:var(--accent-soft);border-color:var(--accent)}
:root[data-style="mitternacht"] .icon-pick{background:var(--surface-2);border-color:var(--line)}
:root[data-style="mitternacht"] .icon-pick.flat{background:transparent}
:root[data-style="mitternacht"] .wd-pick button.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
:root[data-style="mitternacht"] .primary{border-radius:calc(15px*var(--rs));padding:16px;font-weight:700}
:root[data-style="mitternacht"] .ghost-btn{border-radius:calc(15px*var(--rs))}
:root[data-style="mitternacht"] .ghost-btn.quiet{background:var(--surface-2);color:var(--ink-soft)}
:root[data-style="mitternacht"] .add-btn{background:var(--surface);border:1px solid var(--line);color:var(--accent-ink);border-radius:calc(18px*var(--rs))}
:root[data-style="mitternacht"] .add-btn:active{background:var(--surface-2)}
:root[data-style="mitternacht"] .switch{background:var(--surface-3)}
:root[data-style="mitternacht"] .toast{background:var(--surface-3);color:var(--ink);border:1px solid var(--line-2)}
:root[data-style="mitternacht"] .toast.big{background:var(--accent);color:var(--on-accent);border-color:transparent}
:root[data-style="mitternacht"] .set-row{padding:15px 16px}
:root[data-style="mitternacht"] .set-row + .set-row{border-top:1px solid var(--line)}
:root[data-style="mitternacht"] .st-row{padding:14px 16px}

/* Navigation: angedockt und leise, Aktiv = Akzent in Symbol und Beschriftung plus kleiner Punkt */
:root[data-style="mitternacht"] .nav{background:var(--bg)}
:root[data-style="mitternacht"] .nav-inner{border-top:1px solid var(--line);padding:4px 10px calc(var(--safe-bottom) + 4px)}
:root[data-style="mitternacht"] .nav-item{padding:8px 0 5px;gap:3px;border-radius:calc(12px*var(--rs));color:var(--muted)}
:root[data-style="mitternacht"] .nav-item::after{content:"";width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px;transition:background .2s}
:root[data-style="mitternacht"] .nav-item.active{background:transparent;color:var(--accent-ink)}
:root[data-style="mitternacht"] .nav-item.active::after{background:var(--accent)}
:root[data-style="mitternacht"] .nav-item span{font-size:10.5px;font-weight:600;letter-spacing:.01em}
:root[data-style="mitternacht"] .nav-item svg{stroke-width:1.7}

/* Blatt und Ueberlagerungen */
:root[data-style="mitternacht"] .sheet{background:var(--bg);border-top:1px solid var(--line-2);border-radius:calc(24px*var(--rs)) calc(24px*var(--rs)) 0 0}
:root[data-style="mitternacht"] .scrim,:root[data-style="mitternacht"] .cel{background:rgba(5,8,20,.58)}
:root[data-style="mitternacht"] .cel-card{background:var(--surface);border:1px solid var(--line-2)}
:root[data-style="mitternacht"] .x-btn{background:var(--surface-2)}
:root[data-style="mitternacht"] .grabber{background:var(--surface-3)}

/* Fortschritt: duenne Spur, Akzent-Fuellung, Marken als kleine Ringe */
:root[data-style="mitternacht"] .pf-track{height:3px;background:var(--surface-3)}
:root[data-style="mitternacht"] .pf-mark{width:8px;height:8px;background:var(--surface);border:1.5px solid var(--faint)}
:root[data-style="mitternacht"] .pf-mark.on{background:var(--accent);border-color:var(--accent)}
:root[data-style="mitternacht"] .pfad.big .pf-track{height:5px;border-radius:3px}
:root[data-style="mitternacht"] .pfad.big .pf-mark{width:14px;height:14px;border-width:2px}
:root[data-style="mitternacht"] .pf-text{font-weight:500}
:root[data-style="mitternacht"] .pfad.big .pf-text{font-weight:600;font-size:14px}
:root[data-style="mitternacht"] .pf-labels span{font-weight:600}


/* --- Stil: Schweizer Raster (raster) --- */
/* Schweizer Raster: Schrift, Raster und wenige starke Linien. Hell zuerst, kein Schmuck. */
:root[data-style="raster"],.stsw[data-sw="raster"]{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f1f1f1; --surface-3:#e2e2e2;
  --ink:#111111; --ink-soft:#333333; --muted:#595959; --faint:#757575;
  --line:#dddddd; --line-2:#a8a8a8;
  --accent:#0b3bff; --accent-soft:#e9eeff; --accent-ink:#0b3bff; --on-accent:#ffffff;
  --g1:#1fa34a; --g2:#1fa34a; --o1:#de7400; --o2:#de7400; --r1:#e03131; --r2:#e03131;
  --g-ink:#14803a; --o-ink:#a85800; --r-ink:#c92a2a;
  --fill-g:var(--g2); --fill-o:var(--o2); --fill-r:var(--r2);
  --on-fill:#ffffff; --on-g:#ffffff; --on-o:#ffffff; --on-r:#ffffff; --knob:#111111;
  --shadow:none; --shadow-lg:none; --rs:.12;
  --font-body:"Archivo",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-display:var(--font-body); --font-head:var(--font-body); --font-num:var(--font-body);
}
:root[data-style="raster"][data-theme="dark"],:root[data-theme="dark"] .stsw[data-sw="raster"]{
  --bg:#0e0e0e; --surface:#0e0e0e; --surface-2:#1c1c1c; --surface-3:#323232;
  --ink:#ffffff; --ink-soft:#d6d6d6; --muted:#a6a6a6; --faint:#8a8a8a;
  --line:#2e2e2e; --line-2:#5c5c5c;
  --accent:#6b8cff; --accent-soft:#161c3d; --accent-ink:#8ba5ff; --on-accent:#0e0e0e;
  --g1:#1fa34a; --g2:#1fa34a; --o1:#de7400; --o2:#de7400; --r1:#e03131; --r2:#e03131;
  --g-ink:#43cd70; --o-ink:#ffa62b; --r-ink:#ff7b7b;
  --on-fill:#ffffff; --on-g:#ffffff; --on-o:#ffffff; --on-r:#ffffff; --knob:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root[data-style="raster"]:not([data-theme="light"]),:root:not([data-theme="light"]) .stsw[data-sw="raster"]{
    --bg:#0e0e0e; --surface:#0e0e0e; --surface-2:#1c1c1c; --surface-3:#323232;
    --ink:#ffffff; --ink-soft:#d6d6d6; --muted:#a6a6a6; --faint:#8a8a8a;
    --line:#2e2e2e; --line-2:#5c5c5c;
    --accent:#6b8cff; --accent-soft:#161c3d; --accent-ink:#8ba5ff; --on-accent:#0e0e0e;
    --g1:#1fa34a; --g2:#1fa34a; --o1:#de7400; --o2:#de7400; --r1:#e03131; --r2:#e03131;
    --g-ink:#43cd70; --o-ink:#ffa62b; --r-ink:#ff7b7b;
    --on-fill:#ffffff; --on-g:#ffffff; --on-o:#ffffff; --on-r:#ffffff; --knob:#ffffff;
  }
}

/* Vorschau-Kachel */
.stsw[data-sw="raster"] .stsw-h{font-size:25px;font-weight:900;letter-spacing:-.05em;line-height:.9}
.stsw[data-sw="raster"] .stsw-c{background:transparent;border-width:2px 0 0;border-color:var(--ink);border-radius:0;padding:7px 0 0}
.stsw[data-sw="raster"] .stsw-n{font-size:16px;font-weight:800;letter-spacing:-.03em}
.stsw[data-sw="raster"] .stsw-l{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}

/* Grundlagen: Schrift tragt die Hierarchie, alles buendig an einer Kante */
:root[data-style="raster"] body{font-feature-settings:"kern","tnum" 0}
:root[data-style="raster"] :is(h1,h2,h3){font-family:var(--font-head)}
:root[data-style="raster"] .scroll{padding:6px 20px 128px}
:root[data-style="raster"] .head{padding:calc(var(--safe-top) + 22px) 20px 14px;align-items:flex-end}
:root[data-style="raster"] .head h1{font-size:40px;font-weight:900;letter-spacing:-.045em;line-height:.92}
:root[data-style="raster"] .head .sub{margin-top:9px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
:root[data-style="raster"] .head-btn{background:transparent;border:1px solid var(--ink);box-shadow:none;width:44px;height:44px}
:root[data-style="raster"] .head-btn svg{stroke:var(--ink)}
:root[data-style="raster"] .x-btn{width:44px;height:44px;margin:-6px -10px -6px 0;background:transparent;border-radius:0}
:root[data-style="raster"] .x-btn svg{stroke:var(--ink);stroke-width:2.4}

/* Keine Karten: ein Block ist eine 2px-Linie, darunter Haarlinien zwischen den Zeilen */
:root[data-style="raster"] :is(.today-card,.recall-card,.card,.matrix,.tlist,.set-group,.hero-stat,.stat-card,.ms-box,.hd-card,.st-list,.st-pfad,.note-box,.wknav){
  background:transparent;border:0;border-top:2px solid var(--ink);border-radius:0;box-shadow:none;
  padding-left:0;padding-right:0;margin-bottom:30px}
:root[data-style="raster"] :is(.idea-card,.arch-card,.kcard){background:transparent;border:0;border-bottom:1px solid var(--line);
  border-radius:0;box-shadow:none;padding-left:0;padding-right:0;margin-bottom:0}
:root[data-style="raster"] .section-label{margin:34px 0 0;padding-top:9px;border-top:2px solid var(--ink);
  font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink)}
:root[data-style="raster"] .section-label + :is(.set-group,.st-list,.stat-card,.tlist,.matrix,.hd-card,.ms-box,.note-box,.card){border-top:0}
:root[data-style="raster"] .set-group{overflow:visible}
:root[data-style="raster"] .today-card{padding-top:11px;padding-bottom:0;margin-bottom:6px}
:root[data-style="raster"] .tc-head{align-items:baseline;margin-bottom:12px}
:root[data-style="raster"] .tc-title{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
:root[data-style="raster"] .tc-count{font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--ink)}
:root[data-style="raster"] .tc-empty{font-weight:600}
:root[data-style="raster"] .tc-bar{height:3px;border-radius:0;background:var(--surface-3)}
:root[data-style="raster"] .tc-bar i{border-radius:0;background:var(--accent)!important}
:root[data-style="raster"] .recall-card{padding-top:12px;padding-bottom:14px}
:root[data-style="raster"] .recall-card .rc-k{color:var(--ink);letter-spacing:.12em;font-weight:800}
:root[data-style="raster"] .recall-card .rc-q{font-size:15px;font-weight:500}
:root[data-style="raster"] .recall-card .rc-btns button{border-radius:calc(12px*var(--rs));background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);min-height:44px}
:root[data-style="raster"] .recall-card .rc-btns button.yes{background:var(--ink);color:var(--bg)}
:root[data-style="raster"] .recall-card .ico-tile{display:none}
:root[data-style="raster"] .recall-card .rc-later{min-height:44px;color:var(--ink-soft)}

/* Heute-Liste */
:root[data-style="raster"] .tlist{padding-top:0;padding-bottom:0;overflow:visible}
:root[data-style="raster"] .trow{padding:15px 0;gap:14px;border-top-color:var(--line)}
:root[data-style="raster"] .trow.sub{padding-left:18px}
:root[data-style="raster"] .tname .n{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
:root[data-style="raster"] .tname .sit{font-size:12.5px;font-weight:500;margin-top:3px}
:root[data-style="raster"] .tname .n svg{stroke:var(--faint)}
:root[data-style="raster"] .tname .pfad{margin-top:9px}
:root[data-style="raster"] .tmeta .warn{font-weight:800}
:root[data-style="raster"] .trow .ico-tile,
:root[data-style="raster"] .st-row .ico-tile,
:root[data-style="raster"] .arch-card .ico-tile,
:root[data-style="raster"] .stat-card .sh .ico-tile,
:root[data-style="raster"] .set-row .si,
:root[data-style="raster"] .mname .ico-tile,
:root[data-style="raster"] .kcard summary .ico-tile{display:none}
:root[data-style="raster"] .tghead{margin:0;padding:15px 0 13px;background:transparent;border-bottom:1px solid var(--line)}
:root[data-style="raster"] .tgroup.closed .tghead{margin-bottom:0;border-bottom:0}
:root[data-style="raster"] .tghead .tname .n{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
:root[data-style="raster"] .tghead .ico-tile{display:none}
:root[data-style="raster"] .tghead .mchev,:root[data-style="raster"] .mrow.grp .mchev{stroke:var(--ink)}
:root[data-style="raster"] .tghead .tstatus{background:transparent}
:root[data-style="raster"] .tchev{width:18px}
/* Abhak-Kachel: leer = Quadrat mit 2px Rand, erledigt = volle Farbflaeche */
:root[data-style="raster"] .tstatus,:root[data-style="raster"] .tghead .tstatus{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
:root[data-style="raster"] .tstatus.g{background:var(--fill-g);box-shadow:none}
:root[data-style="raster"] .tstatus.o{background:var(--fill-o);box-shadow:none}
:root[data-style="raster"] .tstatus.r{background:var(--fill-r);box-shadow:none}
:root[data-style="raster"] .tstatus i + i{border-left:2px solid var(--bg)}
:root[data-style="raster"] .tstatus i svg{stroke-width:3;width:20px;height:20px}
:root[data-style="raster"] .tempty{color:var(--muted);font-weight:600}
/* Serie: nur Zahl, keine Chip-Flaeche */
:root[data-style="raster"] .chip-streak,:root[data-style="raster"] .chip-streak.on,:root[data-style="raster"] .chip-streak.warn{
  background:transparent;border-radius:0;padding:0 2px;color:var(--ink);font-weight:800}
:root[data-style="raster"] .chip-streak.warn{color:var(--o-ink)}
:root[data-style="raster"] .trow .chip-streak{font-size:15px;letter-spacing:-.02em;padding:0}
:root[data-style="raster"] .badge,:root[data-style="raster"] .badge.stable,:root[data-style="raster"] .badge.archive{
  padding:2px 6px;border-radius:0;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px currentColor;
  font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
:root[data-style="raster"] .badge.archive{color:var(--g-ink)}

/* Woche (Matrix) */
:root[data-style="raster"] .matrix{padding-top:12px;padding-bottom:6px}
:root[data-style="raster"] .wknav{border-top:0;padding:0;margin-bottom:14px}
:root[data-style="raster"] .wknav .nbtn,:root[data-style="raster"] .mnav button{background:transparent;border:1px solid var(--ink);box-shadow:none;width:44px;height:44px}
:root[data-style="raster"] .wknav .nbtn svg,:root[data-style="raster"] .mnav button svg{stroke:var(--ink)}
:root[data-style="raster"] .wknav .lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);text-align:left}
:root[data-style="raster"] .wknav .jump{height:44px;border-radius:0;background:transparent;color:var(--accent-ink);font-weight:800;box-shadow:inset 0 0 0 1px var(--accent)}
:root[data-style="raster"] .mhead .dl{font-weight:800;color:var(--ink)}
:root[data-style="raster"] .mgrid{grid-template-columns:14px 104px repeat(7,minmax(0,1fr)) 30px;gap:3px}
:root[data-style="raster"] .mname span{font-size:12px;font-weight:600;letter-spacing:-.01em}
:root[data-style="raster"] .mrow.sub .mname{padding-left:8px}
:root[data-style="raster"] .mrow.grp{background:transparent;margin:0;padding:6px 0;border-top:1px solid var(--line)}
:root[data-style="raster"] .mrow.grp .mname span{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
:root[data-style="raster"] .mrow.grp .mcell{background:var(--surface-2)}
:root[data-style="raster"] .mstreak{font-weight:800;color:var(--muted)}
:root[data-style="raster"] .mstreak.on{color:var(--ink)}
:root[data-style="raster"] .mstreak.warn{color:var(--o-ink)}
:root[data-style="raster"] .mcell.today{outline-color:var(--ink);outline-width:2px;outline-offset:1px}
:root[data-style="raster"] .cell.today{border-color:var(--ink)}
:root[data-style="raster"] .cal .mc.tdy{outline-color:var(--ink)}
:root[data-style="raster"] .cal .cd{font-weight:800;color:var(--ink)}

/* Umschalter: Woche/Heute als Text mit Unterstrich, Formular-Umschalter als schwarzes Rechteck */
:root[data-style="raster"] .view-toggle{background:transparent;padding:0;gap:26px;border:0;border-bottom:1px solid var(--line-2);border-radius:0;margin:0 0 14px}
:root[data-style="raster"] .view-toggle button{flex:none;min-width:44px;min-height:44px;padding:10px 0 9px;margin-bottom:-1px;border-radius:0;text-align:left;
  font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--muted);border-bottom:4px solid transparent;background:transparent;box-shadow:none}
:root[data-style="raster"] .view-toggle button.sel{background:transparent;color:var(--ink);border-bottom-color:var(--ink)}
:root[data-style="raster"] .seg-toggle:not(.view-toggle){background:transparent;padding:0;gap:0;border:1px solid var(--ink);border-radius:0;overflow:hidden}
:root[data-style="raster"] .seg-toggle:not(.view-toggle) button{border-radius:0;min-height:44px;font-weight:700;color:var(--ink);box-shadow:none;background:transparent}
:root[data-style="raster"] .seg-toggle:not(.view-toggle) button + button{border-left:1px solid var(--ink)}
:root[data-style="raster"] .seg-toggle:not(.view-toggle) button.sel{background:var(--ink);color:var(--bg)}
:root[data-style="raster"] .chip{background:transparent;border:1px solid var(--line-2);border-radius:0;color:var(--ink);font-weight:700;min-height:44px;padding:0 14px}
:root[data-style="raster"] .chip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
:root[data-style="raster"] .filter-chips{gap:6px}

/* Knoepfe: primaer = schwarzes Rechteck, sekundaer = 1px Rahmen */
:root[data-style="raster"] .primary{background:var(--ink);color:var(--bg);font-weight:800;letter-spacing:.01em;min-height:52px;margin-top:10px}
:root[data-style="raster"] .ghost-btn,:root[data-style="raster"] .ghost-btn.quiet{background:transparent;color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--ink);min-height:48px}
:root[data-style="raster"] .danger-btn{font-weight:700;color:var(--r-ink)}
:root[data-style="raster"] .add-btn{border:1px solid var(--ink);color:var(--ink);font-weight:700;justify-content:flex-start;padding:15px 16px;min-height:50px}
:root[data-style="raster"] .add-btn + .add-btn{margin-top:8px!important}
:root[data-style="raster"] .add-inline{color:var(--accent-ink);font-weight:800}
:root[data-style="raster"] .bulk-btn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
:root[data-style="raster"] .bulk-btn.main{background:var(--fill-g);box-shadow:none;color:var(--on-fill);font-weight:800}
:root[data-style="raster"] .clear-day{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2);font-weight:700}
:root[data-style="raster"] .idea-addbtn{background:var(--accent);color:var(--on-accent)}
:root[data-style="raster"] .stepper button,:root[data-style="raster"] .mini-step button,:root[data-style="raster"] .del{
  background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
:root[data-style="raster"] .mini-step button{width:36px;height:36px}
:root[data-style="raster"] .stepper .val{font-size:36px;font-weight:900;letter-spacing:-.04em;line-height:1}
:root[data-style="raster"] .mini-step .v{font-weight:900;font-size:17px}
:root[data-style="raster"] .switch{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
:root[data-style="raster"] .switch.on{background:var(--accent);box-shadow:none}
:root[data-style="raster"] .switch::after{border-radius:calc(12px*var(--rs));top:6px;left:6px;width:18px;height:18px}
:root[data-style="raster"] .switch.on::after{background:#fff;transform:translateX(20px)}
:root[data-style="raster"] .filter-chips{scrollbar-width:none}
:root[data-style="raster"] .filter-chips::-webkit-scrollbar{display:none}

/* Felder */
:root[data-style="raster"] .inp{background-color:var(--bg);border:1px solid var(--ink);border-radius:calc(12px*var(--rs));font-weight:500}
:root[data-style="raster"] .inp:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
:root[data-style="raster"][data-theme="dark"] .inp{color-scheme:dark}
:root[data-style="raster"] .field > label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
:root[data-style="raster"] .field > label .opt{text-transform:none;letter-spacing:0}
:root[data-style="raster"] .field .hint{color:var(--muted)}
:root[data-style="raster"] .esec{color:var(--ink);font-weight:800;letter-spacing:.12em;border-top:2px solid var(--ink);padding-top:9px;margin:30px 0 14px}
:root[data-style="raster"] :is(.choice,.pick-row,.icon-pick button,.wd-pick button){background:transparent;border:1px solid var(--line-2);box-shadow:none}
:root[data-style="raster"] :is(.choice,.pick-row,.icon-pick button).sel{background:transparent;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
:root[data-style="raster"] .choice.sel .cl{font-weight:800}
:root[data-style="raster"] .choice .cl{color:var(--ink-soft);font-weight:700}
:root[data-style="raster"] .icon-pick{background:transparent;border:1px solid var(--line)}
:root[data-style="raster"] .icon-pick button.sel{transform:none}
:root[data-style="raster"] .icon-pick button svg{stroke:var(--ink-soft)}
:root[data-style="raster"] .icon-pick button.sel svg{stroke:var(--ink)}
:root[data-style="raster"] .wd-pick button{color:var(--ink);font-weight:800}
:root[data-style="raster"] .wd-pick button.sel{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:none}
:root[data-style="raster"] .pr-box{border-color:var(--ink);border-width:2px}
:root[data-style="raster"] .pick-row.sel .pr-box{background:var(--accent);border-color:var(--accent)}
:root[data-style="raster"] .pr-name{font-weight:700}

/* Einstellungen */
:root[data-style="raster"] .set-group{margin-bottom:6px}
:root[data-style="raster"] .set-row .ico-tile{background:transparent;width:24px;justify-items:start}
:root[data-style="raster"] .set-row .ico-tile svg{stroke:var(--ink)}
:root[data-style="raster"] .set-row{padding:15px 0;gap:14px;border-bottom:1px solid var(--line)}
:root[data-style="raster"] .set-row:last-child{border-bottom:0}
:root[data-style="raster"] .set-row .st .t{font-size:16px;font-weight:600;letter-spacing:-.01em}
:root[data-style="raster"] .set-row .st .d{font-size:12.5px}
:root[data-style="raster"] .set-row.tap:active{background:transparent;opacity:.55}
:root[data-style="raster"] .set-row .chev{stroke:var(--ink)}
:root[data-style="raster"] .set-row .inp{padding:8px 10px}
:root[data-style="raster"] .pill-val{color:var(--ink);font-weight:700}
:root[data-style="raster"] .set-note{padding:0;margin:8px 0 6px}
:root[data-style="raster"] .ed-fold{margin-bottom:6px}
:root[data-style="raster"] .ed-fold .set-row{min-height:56px}
:root[data-style="raster"] .ed-fold-body{padding:0 0 14px}
:root[data-style="raster"] .ed-more{padding:2px 0 16px}
:root[data-style="raster"] .ed-more .field + .field{border-top-color:var(--line)}
:root[data-style="raster"] .stil{padding:15px 0 6px}
:root[data-style="raster"] .stil-t{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
:root[data-style="raster"] .stname{padding:0;font-weight:700;color:var(--muted)}
:root[data-style="raster"] .stopt.sel .stname{color:var(--ink);font-weight:800}
:root[data-style="raster"] .stname svg{stroke:var(--accent-ink)}
:root[data-style="raster"] .stopt.sel .stsw{outline-color:var(--accent);outline-width:3px;outline-offset:1px}

/* Ideen, Archiv, Wissen */
:root[data-style="raster"] .idea-card{padding-top:15px;padding-bottom:15px}
:root[data-style="raster"] .idea-card .itext{font-size:16px;font-weight:600}
:root[data-style="raster"] .idea-card .iact button{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
:root[data-style="raster"] .idea-card .iact .conv{background:transparent;box-shadow:inset 0 0 0 1px var(--accent)}
:root[data-style="raster"] .idea-card .iact .conv svg{stroke:var(--accent-ink)}
:root[data-style="raster"] .ilist .idrop{border-radius:0;border-style:solid;border-width:1px;font-weight:700}
:root[data-style="raster"] .isec{border-top:2px solid var(--ink);margin-bottom:24px}
:root[data-style="raster"] .isec-head{padding:10px 0 10px}
:root[data-style="raster"] .isec-head .t{color:var(--ink);font-weight:800;letter-spacing:.12em}
:root[data-style="raster"] .isec-head .c{color:var(--ink);font-weight:800;font-size:13px}
:root[data-style="raster"] .arch-card{padding-top:14px;padding-bottom:14px}
:root[data-style="raster"] .arch-card .an{font-size:16px;font-weight:600}
:root[data-style="raster"] .arch-card .ap{font-size:24px;font-weight:900;letter-spacing:-.04em}
:root[data-style="raster"] .arch-sum{gap:18px}
:root[data-style="raster"] .arch-sum div{background:transparent;border:0;border-top:2px solid var(--ink);border-radius:0;text-align:left;padding:9px 0 0}
:root[data-style="raster"] .arch-sum b{font-size:34px;font-weight:900;letter-spacing:-.045em;line-height:1.05}
:root[data-style="raster"] .arch-sum span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:root[data-style="raster"] .kcard summary{padding:16px 0}
:root[data-style="raster"] .kcard summary .kt b{font-size:16px;font-weight:700}
:root[data-style="raster"] .kcard .mchev{stroke:var(--ink)}
:root[data-style="raster"] .kbody{padding:0 0 16px;color:var(--ink-soft)}
:root[data-style="raster"] .kbody h4{color:var(--ink);font-weight:800;letter-spacing:.1em}
:root[data-style="raster"] .kbody .law{background:transparent;border-radius:0;border-left:2px solid var(--ink);padding:2px 0 2px 12px}
:root[data-style="raster"] .note-box{border-top:0;border-left:2px solid var(--ink);padding:2px 0 2px 12px;margin-bottom:16px}
:root[data-style="raster"] .note-list li::before{border-radius:0;width:5px;height:5px;background:var(--ink)}

/* Statistik: grosse, schwere Kennzahlen */
:root[data-style="raster"] .hero-stat{padding-top:12px;padding-bottom:0}
:root[data-style="raster"] .hs{text-align:left}
:root[data-style="raster"] .hs + .hs{border-left:1px solid var(--line);padding-left:14px}
:root[data-style="raster"] .hs .n{font-size:46px;font-weight:900;letter-spacing:-.055em}
:root[data-style="raster"] .hs .l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
:root[data-style="raster"] .hs .n.g{color:var(--g-ink)}
:root[data-style="raster"] .hs .n.o{color:var(--o-ink)}
:root[data-style="raster"] .bar{height:3px;border-radius:0;background:var(--surface-3);margin-top:18px}
:root[data-style="raster"] .bar i.g{background:var(--g2)}
:root[data-style="raster"] .bar i.o{background:var(--o2)}
:root[data-style="raster"] .bar i.r{background:var(--r2)}
:root[data-style="raster"] .st-big{gap:18px}
:root[data-style="raster"] .st-big>div,:root[data-style="raster"] .hd-figs>div{background:transparent;border:0;border-top:2px solid var(--ink);border-radius:0;box-shadow:none;text-align:left;padding:10px 0 0}
:root[data-style="raster"] .st-big .n{font-size:52px;font-weight:900;letter-spacing:-.055em;line-height:1}
:root[data-style="raster"] .st-big .l,:root[data-style="raster"] .hd-figs span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
:root[data-style="raster"] .st-pfad{padding:12px 0 0}
:root[data-style="raster"] .st-row{padding:16px 0;min-height:68px}
:root[data-style="raster"] .st-row + .st-row{border-top-color:var(--line)}
:root[data-style="raster"] .st-row:active{background:transparent;opacity:.6}
:root[data-style="raster"] .st-row .st-name{font-size:16px;font-weight:600;letter-spacing:-.01em}
:root[data-style="raster"] .st-figs{gap:12px}
:root[data-style="raster"] .st-fig .n{font-size:23px;font-weight:900;letter-spacing:-.045em}
:root[data-style="raster"] .st-fig .l{font-weight:800;letter-spacing:.08em;color:var(--muted)}
:root[data-style="raster"] .st-list{overflow:visible}
:root[data-style="raster"] .st-more{color:var(--ink);font-weight:700}
:root[data-style="raster"] .stat-card{padding-top:12px;padding-bottom:0}
:root[data-style="raster"] .stat-card .sh h3{font-size:17px;font-weight:700;letter-spacing:-.02em}
:root[data-style="raster"] .stat-card .sh .pct{font-size:34px;font-weight:900;letter-spacing:-.05em;line-height:1;color:var(--ink)}
:root[data-style="raster"] .mnav{padding:0}
:root[data-style="raster"] .mnav h2{font-size:24px;font-weight:900;letter-spacing:-.04em}
:root[data-style="raster"] .legend{justify-content:flex-start;gap:20px}
:root[data-style="raster"] .legend div{font-weight:700;color:var(--ink-soft)}

/* Detail-Blatt */
:root[data-style="raster"] .hd-card{padding-top:4px;padding-bottom:14px;margin-bottom:22px}
:root[data-style="raster"] .hd-head{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
:root[data-style="raster"] .hd-help i{background:transparent;box-shadow:inset 0 0 0 1px var(--ink);border-radius:0;color:var(--ink)}
:root[data-style="raster"] .hd-help.on i{background:var(--ink);color:var(--bg)}
:root[data-style="raster"] .hd-rule{color:var(--ink-soft)}
:root[data-style="raster"] .hd-figs{gap:18px;margin-bottom:22px}
:root[data-style="raster"] .hd-figs b{font-size:44px;font-weight:900;letter-spacing:-.055em;line-height:1}
:root[data-style="raster"] .hd-warn{font-weight:800;color:var(--o-ink)}
:root[data-style="raster"] .hd-rhythm{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
:root[data-style="raster"] .hd-goal,:root[data-style="raster"] .hd-ready{font-weight:600}
:root[data-style="raster"] .verlauf .vl-head{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}

/* Blatt */
:root[data-style="raster"] .sheet{border-radius:0;border-top:2px solid var(--ink)}
:root[data-style="raster"] .grabber{height:3px;border-radius:0;width:40px;background:var(--line-2)}
:root[data-style="raster"] .sheet-head{padding:10px 20px 14px}
:root[data-style="raster"] .sheet-head h2,:root[data-style="raster"] .empty h2{font-size:30px;font-weight:900;letter-spacing:-.045em;line-height:1}
:root[data-style="raster"] .de-date{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
:root[data-style="raster"] .sit-row .sn{font-size:16px;font-weight:700}
:root[data-style="raster"] .scrim{background:rgba(0,0,0,.5);backdrop-filter:none;-webkit-backdrop-filter:none}
:root[data-style="raster"] .empty .ico{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
:root[data-style="raster"] .empty .ico svg{stroke:var(--ink)}
:root[data-style="raster"] .cel-card{border-top:4px solid var(--ink)}
:root[data-style="raster"] .cel-card h2{font-size:32px;font-weight:900;letter-spacing:-.045em}
:root[data-style="raster"] .cel-kicker{color:var(--ink);letter-spacing:.14em}
:root[data-style="raster"] .cel-ico.stable{background:var(--accent)}
:root[data-style="raster"] .toast{font-weight:700}

/* Navigation: angedockt, 2px Linie oben, aktiver Reiter mit dicker Akzentleiste */
:root[data-style="raster"] .nav{background:var(--bg)}
:root[data-style="raster"] .nav-inner{padding:0 14px calc(var(--safe-bottom) + 4px);border-top:2px solid var(--ink)}
:root[data-style="raster"] .nav-item{position:relative;border-radius:0;padding:13px 0 7px;gap:4px;color:var(--faint);background:transparent}
:root[data-style="raster"] .nav-item.active{background:transparent;color:var(--ink)}
:root[data-style="raster"] .nav-item.active::before{content:"";position:absolute;left:8px;right:8px;top:-2px;height:5px;background:var(--accent)}
:root[data-style="raster"] .nav-item svg{width:21px;height:21px;stroke-width:2}
:root[data-style="raster"] .nav-item span{font-size:10.5px;font-weight:800;letter-spacing:-.005em}
:root[data-style="raster"] .nav-item{min-width:0;padding-left:0;padding-right:0}

/* Fortschritt: 3px Linie, Marken als kurze senkrechte Striche */
:root[data-style="raster"] .pf-track{height:3px;border-radius:0;background:var(--surface-3)}
:root[data-style="raster"] .pf-fill,:root[data-style="raster"] .pf-ghost{border-radius:0}
:root[data-style="raster"] .pf-mark{width:2px;height:10px;border:0;border-radius:0;background:var(--ink)}
:root[data-style="raster"] .pf-mark.on{background:var(--accent)}
:root[data-style="raster"] .pfad.big .pf-track{height:4px;border-radius:0}
:root[data-style="raster"] .pfad.big .pf-mark{width:3px;height:18px;border:0}
:root[data-style="raster"] .pf-labels{color:var(--muted);font-weight:800}
:root[data-style="raster"] .pf-labels span.on{color:var(--ink)}
:root[data-style="raster"] .pf-text{font-weight:600}
:root[data-style="raster"] .pfad.big .pf-text{font-size:15px;font-weight:700}
:root[data-style="raster"] .gb-track{height:3px;border-radius:0;background:var(--surface-3)}
:root[data-style="raster"] .gb-track i{border-radius:0;background:var(--accent)}
:root[data-style="raster"] .gb-cap{font-weight:800}

  clean:'<path d="M12 3l1.6 4.5L18 9l-4.4 1.5L12 15l-1.6-4.5L6 9l4.4-1.5z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/>',

  flower:'<circle cx="12" cy="12" r="2.4"/><path d="M12 9.6c0-2.6.6-4.6-.5-6.6-1 2 0 4 .5 6.6zM12 14.4c0 2.6-.6 4.6.5 6.6 1-2 0-4-.5-6.6zM9.6 12c-2.6 0-4.6-.6-6.6.5 2 1 4 0 6.6-.5zM14.4 12c2.6 0 4.6.6 6.6-.5-2-1-4 0-6.6.5z"/>',
